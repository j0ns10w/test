<!DOCTYPE html><html lang="zh-Hant"><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pixel English Hero</title>
<style>
:root{--ps:clamp(5px,1.45vw,9px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:#1a1c2c;background-image:radial-gradient(#262b44 1px,transparent 1px);background-size:8px 8px;color:#f4f4f4;font-family:"Courier New",Consolas,"Microsoft JhengHei",monospace;font-size:15px;line-height:1.45}
#main{max-width:980px;margin:0 auto;padding:10px;min-height:100vh}
h1,h2,h3{margin:.25em 0;letter-spacing:1px}
small{opacity:.85}
.pbox{background:#262b44;border:4px solid #0d0d14;box-shadow:inset -4px -4px 0 #1b1f33,inset 4px 4px 0 #3e4a78,0 4px 0 #0d0d14;padding:12px;margin:10px 0}
.btn{font-family:inherit;font-weight:bold;font-size:15px;color:#fff;background:#3b5dc9;border:3px solid #0d0d14;box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.3);padding:10px 14px;cursor:pointer;text-shadow:2px 2px 0 rgba(0,0,0,.5);touch-action:manipulation;border-radius:0}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(2px);box-shadow:inset 3px 3px 0 rgba(0,0,0,.35)}
.btn:disabled{filter:grayscale(.9) brightness(.6);cursor:not-allowed;transform:none}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.big{font-size:18px;padding:14px 22px}
.btn.wide{width:100%;margin-top:8px}
.btn.red{background:#b13e53}.btn.green{background:#2f9e57}.btn.gold{background:#d18a1f}.btn.purple{background:#7a3db8}.btn.gray{background:#566c86}.btn.teal{background:#257179}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.center{justify-content:center;text-align:center}
.good{color:#a7f070}.bad{color:#ff6b7f}.gold{color:#ffcd75}.exp{color:#73eff7}
input,textarea,select{font-family:inherit;font-size:14px;background:#0d0d14;color:#f4f4f4;border:3px solid #566c86;padding:6px}
textarea{width:100%;min-height:120px}
.hidden{display:none!important}
/* sprite */
.sprite{position:relative;display:inline-block;flex:none}
.sprite>i{position:absolute;left:-1em;top:-1em;width:1em;height:1em;display:block}
.flip{transform:scaleX(-1)}
/* title */
.logo{font-size:clamp(28px,7vw,54px);text-align:center;color:#ffcd75;text-shadow:4px 4px 0 #b13e53,8px 8px 0 #0d0d14;line-height:1.1;margin:20px 0 6px}
.sub{text-align:center;color:#73eff7}
.class-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.ccard{background:#1b1f33;border:3px solid #0d0d14;padding:10px;text-align:center;display:flex;flex-direction:column;gap:4px}
.ccard .spr{font-size:6px;height:110px;display:flex;align-items:flex-end;justify-content:center}
.ccard p{font-size:13px;text-align:left;margin:2px 0}
/* topbar */
.topbar{display:flex;align-items:center;gap:8px;background:#0d0d14;padding:6px;border:3px solid #3e4a78;position:sticky;top:0;z-index:20}
.tb-title{flex:1;font-weight:bold;font-size:16px}
.tb-info{font-size:13px;white-space:nowrap}
/* menu */
.hero-card{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.hc-sprite{font-size:7px;padding:8px;background:#1b1f33;border:3px solid #0d0d14}
.hc-info{flex:1;min-width:220px}
.title-tag{display:inline-block;background:#5d275d;padding:2px 8px;border:2px solid #0d0d14;color:#ffcd75;font-size:13px;margin:4px 0}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mbtn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:16px 8px;position:relative}
.mbtn .ic{font-size:28px}
.mbtn small{font-weight:normal}
.badge{position:absolute;top:-8px;right:-8px;background:#ff004d;border:2px solid #0d0d14;font-size:12px;padding:1px 6px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
/* tags */
.tag{display:inline-block;padding:1px 6px;border:2px solid #0d0d14;font-size:12px;font-weight:bold;color:#fff;text-shadow:1px 1px 0 #000}
.t-vocabulary{background:#2f9e57}.t-grammar{background:#3b7dd8}.t-sentence{background:#d9643a}.t-conversation{background:#9b4ddb}.t-reading{background:#b8860b}
/* stage */
.stage{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stage.locked{opacity:.55}
.st-sprite{width:90px;height:90px;display:flex;align-items:flex-end;justify-content:center;background:#1b1f33;border:3px solid #0d0d14;padding:4px}
.st-info{flex:1;min-width:220px;font-size:14px}
.st-info div{margin:2px 0}
/* items */
.item{background:#1b1f33;border:3px solid;padding:8px;margin:6px 0;font-size:13px}
.iname{font-weight:bold;font-size:14px}
.istats{color:#c2f0c2}
.slot{background:#0d0d14;border:2px dashed #566c86;padding:6px;margin:6px 0}
.slot-name{font-weight:bold;color:#73eff7}
.empty{opacity:.5;padding:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:700px){.grid2{grid-template-columns:1fr}}
/* skill tree */
.tree{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.node{background:#1b1f33;border:3px solid #566c86;padding:8px;cursor:pointer;font-size:13px;position:relative}
.node b{font-size:14px}
.node.can{border-color:#a7f070;box-shadow:0 0 0 2px #2f9e57}
.node.max{border-color:#ffcd75}
.node.lock{opacity:.5;cursor:not-allowed}
.pips{letter-spacing:2px;color:#ffcd75;margin-top:4px}
/* stats */
.stat-table{width:100%;border-collapse:collapse;font-size:14px}
.stat-table td{border-bottom:2px dotted #3e4a78;padding:4px}
.stat-table td:last-child{text-align:right;font-weight:bold;color:#ffcd75}
/* battle */
#scene{position:relative;height:clamp(240px,42vh,370px);border:4px solid #0d0d14;overflow:hidden;background:linear-gradient(var(--s1),var(--s2) 70%)}
#scene .ground{position:absolute;left:0;right:0;bottom:0;height:27%;background:linear-gradient(var(--g1) 0 12px,var(--g2) 12px);border-top:4px solid #0d0d14}
#scene .ground::before{content:'';position:absolute;left:0;right:0;top:16px;bottom:0;background:repeating-linear-gradient(90deg,transparent 0 24px,rgba(0,0,0,.18) 24px 32px),repeating-linear-gradient(0deg,transparent 0 12px,rgba(0,0,0,.12) 12px 16px)}
.cloud{position:absolute;width:60px;height:14px;background:rgba(255,255,255,.7);box-shadow:14px -10px 0 rgba(255,255,255,.7),28px 0 0 rgba(255,255,255,.7);animation:drift 30s linear infinite}
@keyframes drift{from{transform:translateX(-120px)}to{transform:translateX(110vw)}}
.actor{position:absolute;bottom:21%;font-size:var(--ps);z-index:3}
#hero{left:7%}#mon{right:7%}
.bob{animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-.5em)}}
.ghosty{opacity:.85}
.lunge-r{animation:lungeR .35s}@keyframes lungeR{40%{transform:translateX(70%)}}
.lunge-l{animation:lungeL .35s}@keyframes lungeL{40%{transform:translateX(-60%)}}
.hit{animation:hit .35s}@keyframes hit{0%,100%{transform:translateX(0)}25%{transform:translateX(8px);filter:brightness(3)}50%{transform:translateX(-8px)}75%{transform:translateX(5px);filter:brightness(3)}}
.cast{animation:cast .45s}@keyframes cast{50%{transform:translateY(-12px);filter:drop-shadow(0 0 8px #73eff7) brightness(1.5)}}
.healfx{animation:healfx .5s}@keyframes healfx{50%{filter:drop-shadow(0 0 10px #a7f070) brightness(1.4)}}
.dead{animation:die .9s forwards}@keyframes die{to{opacity:0;transform:translateY(20px) scale(.6);filter:brightness(3)}}
.hud{position:absolute;top:6px;width:47%;background:rgba(13,13,20,.82);border:3px solid #0d0d14;padding:5px 8px;font-size:13px;z-index:6}
.hud-l{left:6px}.hud-r{right:6px;text-align:right}
.bar{height:12px;border:2px solid #0d0d14;background:#333c57;margin:3px 0}
.bar>div{height:100%;background:#38b764;transition:width .3s steps(6)}
.bar.mon>div{background:#e04a5f}.bar.exp>div{background:#41a6f6}
.ap{color:#73eff7;font-weight:bold}.combo{color:#ffcd75;font-weight:bold}
.dmg{position:absolute;z-index:9;font-weight:bold;font-size:22px;text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000;pointer-events:none;animation:floatUp 1.1s forwards;white-space:nowrap;transform:translateX(-50%)}
@keyframes floatUp{0%{opacity:0;margin-top:0}15%{opacity:1}100%{opacity:0;margin-top:-56px}}
.proj{position:absolute;width:16px;height:16px;z-index:8;box-shadow:0 0 0 4px rgba(255,255,255,.35),0 0 12px 4px currentColor}
#bpanel{min-height:200px}
.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.diff{color:#ffcd75}
.qnum{margin-left:auto;opacity:.7;font-size:13px}
.qtext{font-size:17px;background:#0d0d14;border:3px solid #3e4a78;padding:10px;margin:6px 0;white-space:pre-wrap}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.choice{text-align:left;background:#333c57;font-size:15px;min-height:48px}
.choice.right{background:#2f9e57;animation:blink .4s steps(2) 2}
.choice.wrong{background:#b13e53}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.act{display:flex;flex-direction:column;align-items:center;min-height:58px}
.act small{font-weight:normal;font-size:11px}
.okmsg{background:#1e5631;border:3px solid #0d0d14;padding:8px;font-weight:bold}
.badmsg{background:#6b1f2e;border:3px solid #0d0d14;padding:8px;font-weight:bold}
.explain{background:#1b1f33;border-left:6px solid #ffcd75;padding:8px;margin:6px 0}
.busy{text-align:center;font-size:18px;padding:40px 10px;color:#ffcd75}
.blog{font-size:12px;opacity:.85;background:#0d0d14;padding:6px;border:2px solid #3e4a78;min-height:40px}
@media(max-width:600px){.choices{grid-template-columns:1fr}.hud{font-size:11px;width:48%}.qtext{font-size:15px}.btn{font-size:14px}}
/* modal */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:12px}
#modalBox{max-width:520px;width:100%;max-height:90vh;overflow:auto;animation:pop .25s steps(4)}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.mbtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px}
.qlist{max-height:300px;overflow:auto;font-size:12px;background:#0d0d14;padding:6px}
.qlist div{border-bottom:1px dotted #3e4a78;padding:3px 0}
table.cnt{border-collapse:collapse;font-size:13px}
table.cnt td,table.cnt th{border:2px solid #3e4a78;padding:3px 8px;text-align:center}
</style>
</head>
<body>
<div id="main"></div>
<div id="modal" class="hidden"><div id="modalBox" class="pbox"></div></div>

<script>
/* =====================================================================
   📚 QUESTION BANK 題庫（老師可直接編輯）
   type: vocabulary | grammar | sentence | conversation | reading
   difficulty: 1(易) 2(中) 3(難)
   answerIndex: 正確答案位置，從 0 開始（0 = 第一個選項）
   ===================================================================== */
const QUESTION_BANK = [
  // ---------- vocabulary ----------
  {type:"vocabulary",difficulty:1,question:"Which word means 'a place where you borrow books'?",choices:["library","kitchen","hospital","bakery"],answerIndex:0,explanation:"Library 圖書館 is a place where you can borrow books."},
  {type:"vocabulary",difficulty:1,question:"The opposite of 'hot' is ___.",choices:["cold","warm","big","fast"],answerIndex:0,explanation:"Hot 熱 ↔ Cold 冷，是反義詞。"},
  {type:"vocabulary",difficulty:1,question:"Which one is a fruit?",choices:["carrot","banana","potato","onion"],answerIndex:1,explanation:"Banana 香蕉 is a fruit. The others are vegetables 蔬菜."},
  {type:"vocabulary",difficulty:2,question:"'Brave' means ___.",choices:["afraid","courageous","lazy","tired"],answerIndex:1,explanation:"Brave = courageous 勇敢的。Afraid 是害怕的。"},
  {type:"vocabulary",difficulty:2,question:"Choose the word that means 'very big'.",choices:["tiny","huge","narrow","short"],answerIndex:1,explanation:"Huge 巨大的 = very big. Tiny 是非常小的。"},
  {type:"vocabulary",difficulty:2,question:"My grandmother is very ___. She always helps others.",choices:["kind","angry","rude","noisy"],answerIndex:0,explanation:"幫助別人的人是 kind 仁慈的、親切的。"},
  {type:"vocabulary",difficulty:3,question:"'Reluctant' is closest in meaning to ___.",choices:["eager","unwilling","delighted","careless"],answerIndex:1,explanation:"Reluctant 不情願的 = unwilling。Eager 是渴望的，意思相反。"},
  {type:"vocabulary",difficulty:3,question:"The scientist made an important ___ about the stars.",choices:["discovery","discover","discovered","discovering"],answerIndex:0,explanation:"冠詞 an important 後面需要名詞：discovery 發現。"},
  {type:"vocabulary",difficulty:3,question:"'Ancient' means ___.",choices:["very old","very new","very fast","very loud"],answerIndex:0,explanation:"Ancient 古老的 = very old，例如 ancient Egypt 古埃及。"},
  // ---------- grammar ----------
  {type:"grammar",difficulty:1,question:"She ___ a student.",choices:["am","is","are","be"],answerIndex:1,explanation:"主詞 She（第三人稱單數）搭配 be 動詞 is。"},
  {type:"grammar",difficulty:1,question:"They ___ playing soccer now.",choices:["is","am","are","was"],answerIndex:2,explanation:"They 搭配 are；now 表示現在進行式 are + V-ing。"},
  {type:"grammar",difficulty:1,question:"I have two ___.",choices:["cat","cats","a cat","cates"],answerIndex:1,explanation:"two 後面接複數名詞：cats。"},
  {type:"grammar",difficulty:2,question:"He ___ to school yesterday.",choices:["walk","walks","walked","walking"],answerIndex:2,explanation:"yesterday 昨天 → 過去式 walked。"},
  {type:"grammar",difficulty:2,question:"There ___ some milk in the bottle.",choices:["is","are","be","were"],answerIndex:0,explanation:"milk 是不可數名詞，用單數 is。"},
  {type:"grammar",difficulty:2,question:"My brother is ___ than me.",choices:["tall","taller","tallest","more tall"],answerIndex:1,explanation:"than 表示比較，用比較級 taller。"},
  {type:"grammar",difficulty:3,question:"If it ___ tomorrow, we will stay home.",choices:["rain","rains","rained","will rain"],answerIndex:1,explanation:"If 條件句：if 子句用現在簡單式 rains，主要子句用 will。"},
  {type:"grammar",difficulty:3,question:"I have lived here ___ 2015.",choices:["for","since","at","in"],answerIndex:1,explanation:"現在完成式 + since + 時間點（2015）；for + 一段時間。"},
  {type:"grammar",difficulty:3,question:"The letter ___ by Tom last night.",choices:["wrote","was written","is writing","writes"],answerIndex:1,explanation:"信「被」寫，被動語態；last night 用過去式 → was written。"},
  // ---------- sentence ----------
  {type:"sentence",difficulty:1,question:"Choose the correct sentence.",choices:["I like apples.","I likes apples.","I liking apples.","Me like apples."],answerIndex:0,explanation:"主詞 I 搭配原形動詞 like：I like apples."},
  {type:"sentence",difficulty:1,question:"Put in order: ( is / my / This / book )",choices:["This is my book.","My this is book.","Is this book my.","Book my is this."],answerIndex:0,explanation:"句型：This is + 所有格 + 名詞。"},
  {type:"sentence",difficulty:1,question:"Which sentence is a question?",choices:["You are happy.","Are you happy?","Be happy!","You happy are."],answerIndex:1,explanation:"疑問句把 be 動詞放到句首，並用問號：Are you happy?"},
  {type:"sentence",difficulty:2,question:"Choose the correct sentence.",choices:["She don't like fish.","She doesn't like fish.","She not like fish.","She doesn't likes fish."],answerIndex:1,explanation:"第三人稱單數否定用 doesn't + 原形動詞。"},
  {type:"sentence",difficulty:2,question:"Put in order: ( often / goes / He / swimming )",choices:["He goes often swimming.","He often goes swimming.","Often he swimming goes.","He swimming often goes."],answerIndex:1,explanation:"頻率副詞 often 放在一般動詞前面：He often goes swimming."},
  {type:"sentence",difficulty:2,question:"Which sentence uses 'because' correctly?",choices:["I stayed home because I was sick.","Because I stayed home I was sick because.","I because stayed home sick.","I stayed because home sick."],answerIndex:0,explanation:"because 後面接原因子句：because I was sick。"},
  {type:"sentence",difficulty:3,question:"Combine: 'Tom was tired. He kept working.'",choices:["Although Tom was tired, he kept working.","Because Tom was tired, he kept working.","Tom was tired, so he kept working.","If Tom was tired, he kept working."],answerIndex:0,explanation:"累了卻繼續工作，是「讓步」關係，用 Although 雖然。"},
  {type:"sentence",difficulty:3,question:"Choose the correct sentence.",choices:["Neither of the boys are here.","Neither of the boys is here.","Neither of the boys be here.","Neither the boys is here."],answerIndex:1,explanation:"Neither of + 複數名詞，在正式英文中動詞用單數 is。"},
  {type:"sentence",difficulty:3,question:"Put in order: ( never / I / such / seen / have / a big dog )",choices:["I have never seen such a big dog.","I never have seen a big such dog.","I have seen never such a big dog.","Such a big dog I have never seen never."],answerIndex:0,explanation:"現在完成式 have + never + p.p.；such + a + 形容詞 + 名詞。"},
  // ---------- conversation ----------
  {type:"conversation",difficulty:1,question:"A: How are you?\nB: ___",choices:["I'm fine, thank you.","I'm ten years old.","It's a pen.","Yes, I do."],answerIndex:0,explanation:"How are you? 問近況，回答 I'm fine, thank you."},
  {type:"conversation",difficulty:1,question:"A: Thank you very much!\nB: ___",choices:["You're welcome.","Good night.","I'm sorry.","See you."],answerIndex:0,explanation:"別人道謝時回答 You're welcome. 不客氣。"},
  {type:"conversation",difficulty:1,question:"A: What's your name?\nB: ___",choices:["I'm fine.","My name is Amy.","I'm from Taiwan.","It's Monday."],answerIndex:1,explanation:"問名字 → My name is ..."},
  {type:"conversation",difficulty:2,question:"A: Would you like some tea?\nB: ___",choices:["Yes, please.","Yes, I would like.","No, I'm not.","Yes, it is."],answerIndex:0,explanation:"Would you like...? 有禮貌地接受：Yes, please."},
  {type:"conversation",difficulty:2,question:"A: May I borrow your pen?\nB: ___",choices:["Sure, here you are.","No, you aren't.","Yes, I am.","It's my pen."],answerIndex:0,explanation:"借東西給別人時說 Sure, here you are. 給你。"},
  {type:"conversation",difficulty:2,question:"A: What's the matter?\nB: ___",choices:["I have a headache.","It's on the desk.","That's a good idea.","I'm twelve."],answerIndex:0,explanation:"What's the matter? 怎麼了？回答身體或問題狀況。"},
  {type:"conversation",difficulty:3,question:"A: I failed my math test.\nB: ___",choices:["Congratulations!","Don't worry. You'll do better next time.","That sounds great.","Me too, I'm so happy!"],answerIndex:1,explanation:"朋友考不好時要安慰：Don't worry. You'll do better next time."},
  {type:"conversation",difficulty:3,question:"A: Do you mind if I open the window?\nB: ___ It's hot in here.",choices:["Not at all.","Yes, I mind it.","No, you can't.","I don't know you."],answerIndex:0,explanation:"Do you mind...? 是問「你介意嗎」，Not at all 表示完全不介意。"},
  {type:"conversation",difficulty:3,question:"A: Could you tell me how to get to the station?\nB: ___",choices:["Go straight and turn left at the bank.","It takes a bus.","I'm going there by myself.","The station is very old."],answerIndex:0,explanation:"問路要回答路線：Go straight and turn left..."},
  // ---------- reading ----------
  {type:"reading",difficulty:1,question:"Tom has a dog. Its name is Max. Max is brown.\n\nQ: What color is Max?",choices:["black","white","brown","gray"],answerIndex:2,explanation:"文中提到 Max is brown."},
  {type:"reading",difficulty:1,question:"Amy gets up at 7:00. She eats breakfast and goes to school at 7:30.\n\nQ: When does Amy go to school?",choices:["7:00","7:30","8:00","6:30"],answerIndex:1,explanation:"goes to school at 7:30。7:00 是起床時間。"},
  {type:"reading",difficulty:1,question:"It is raining. Ben takes his umbrella.\n\nQ: Why does Ben take his umbrella?",choices:["It is sunny.","It is raining.","It is windy.","It is snowing."],answerIndex:1,explanation:"因為 It is raining 下雨了，所以帶傘。"},
  {type:"reading",difficulty:2,question:"Lisa loves animals. On weekends, she helps at the pet shelter, feeding cats and dogs.\n\nQ: What does Lisa do on weekends?",choices:["She goes shopping.","She helps at a pet shelter.","She plays the piano.","She visits her grandma."],answerIndex:1,explanation:"On weekends, she helps at the pet shelter 週末在動物收容所幫忙。"},

function buildMap(base,ov){const m=base.map(r=>r.split(''));ov.forEach(([x,y,c])=>{if(m[y]){while(m[y].length<=x)m[y].push('.');m[y][x]=c;}});return m.map(r=>r.join(''));}
function sprite(map,pal,flip){
  const sh=[];map.forEach((row,y)=>{for(let x=0;x<row.length;x++){const c=row[x];if(c!=='.'&&pal[c])sh.push(`${x+1}em ${y+1}em 0 ${pal[c]}`);}});
  const w=Math.max(...map.map(r=>r.length)),h=map.length;
  return `<div class="sprite${flip?' flip':''}" style="width:${w}em;height:${h}em"><i style="box-shadow:${sh.join(',')}"></i></div>`;
}
function heroSprite(cls,adv){
  const c=CLASSES[cls];let ov=[...OVER[c.weapon]];if(adv)ov=ov.concat(OVER.crown);
  return sprite(buildMap(SHAPES.human,ov),{...BASE_PAL,...c.pal,...(adv?ADVANCED[adv].pal:{})},false);
}
function monsterSprite(st){let map=SHAPES[st.shape];if(st.over)map=buildMap(map,st.over.flatMap(o=>OVER[o]));return sprite(map,{...BASE_PAL,...st.pal},st.flip);}

const RARITIES=[{id:'Common',color:'#c2c3c7',mult:1,lines:1,w:50},{id:'Uncommon',color:'#4fd67a',mult:1.4,lines:2,w:28},{id:'Rare',color:'#41a6f6',mult:1.9,lines:2,w:14},{id:'Epic',color:'#c77dff',mult:2.6,lines:3,w:6},{id:'Legendary',color:'#ffa300',mult:3.5,lines:4,w:2}];
const PREFIX={Common:['Worn','Simple','Old'],Uncommon:['Sturdy','Bright','Fine'],Rare:['Runic','Silver','Shining'],Epic:['Mythic','Shadow','Arcane'],Legendary:['Celestial','Dragon','Eternal']};
const SUFFIX=['of Grammar','of Words','of Wisdom','of Stories','of Speech','of the Dawn'];
const WEAPON_NAMES={Warrior:['Sword','Axe','Blade'],Mage:['Staff','Wand','Rod'],Archer:['Bow','Longbow','Crossbow'],Scholar:['Tome','Quill','Codex'],none:['Dagger','Club','Spear']};
const SLOT_NAMES={helmet:['Helm','Hood','Cap'],armor:['Armor','Robe','Vest'],accessory:['Ring','Amulet','Charm'],emblem:['Emblem','Crest','Sigil']};
const STAT_BASE={atk:t=>2+t*1.3,def:t=>1+t,hp:t=>8+t*6,crit:t=>1+t*0.35,exp:t=>3+t*0.8,gold:t=>4+t};
const STAT_LABEL={atk:'ATK',def:'DEF',hp:'Max HP',crit:'CRIT%',exp:'EXP%',gold:'GOLD%'};
const CLASS_MAIN={Warrior:'def',Mage:'atk',Archer:'crit',Scholar:'exp'};

/* ---------- 工具 ---------- */
const $=s=>document.querySelector(s);
const main=$('#main');
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const typeTag=t=>`<span class="tag t-${t}">${t} ${TYPE_ZH[t]||''}</span>`;

/* ---------- 存檔 ---------- */
const SAVE_KEY='pixelEnglishHero_save_v1',BANK_KEY='pixelEnglishHero_bank_v1';
let save=null;
let bank=loadBank();
function loadBank(){try{const b=JSON.parse(localStorage.getItem(BANK_KEY));if(Array.isArray(b)&&b.length)return b;}catch(e){}return QUESTION_BANK.slice();}
function saveBank(){try{localStorage.setItem(BANK_KEY,JSON.stringify(bank));}catch(e){}}
function loadSave(){try{return JSON.parse(localStorage.getItem(SAVE_KEY));}catch(e){return null;}}
function persist(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(save));}catch(e){}}

/* ---------- 音效 ---------- */
let actx=null;
function beep(f=440,d=0.08,type='square',v=0.04){if(save&&save.sound===false)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(actx.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+d);o.stop(actx.currentTime+d+0.02);}catch(e){}}
const SFX={ok:()=>{beep(660);setTimeout(()=>beep(990),80);},bad:()=>beep(160,0.25,'sawtooth'),hit:()=>beep(140,0.08),crit:()=>{beep(300,0.05);setTimeout(()=>beep(600,0.1),50);},heal:()=>{beep(520,0.08,'triangle');setTimeout(()=>beep(780,0.12,'triangle'),90);},win:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,0.12),i*110)),lose:()=>[400,300,200].forEach((f,i)=>setTimeout(()=>beep(f,0.2,'triangle'),i*180)),click:()=>beep(800,0.03)};

/* ---------- 角色數值 ---------- */
function expNeed(lv){return 20+lv*25+lv*lv*5;}
function getTitle(){return save.adv?ADVANCED[save.adv].title:CLASSES[save.cls].title;}
function className(){return save.adv?`${save.adv} ${ADVANCED[save.adv].zh}（${save.cls}）`:`${save.cls} ${CLASSES[save.cls].zh}`;}
function getStats(){
  const c=CLASSES[save.cls],lv=save.level;
  const s={maxHp:c.hp+c.hpG*(lv-1),atk:c.atk+c.atkG*(lv-1),def:c.def+c.defG*(lv-1),crit:c.crit,expB:c.expB,goldB:0,hints:c.hints,hintPower:c.hintPower,defendB:0,combo:c.combo,skillB:c.skillB,dmgRed:c.dmgRed};
  if(save.adv){const a=ADVANCED[save.adv];s.maxHp*=a.hpM;s.atk*=a.atkM;s.def*=a.defM;s.crit+=a.crit||0;s.expB+=a.expB||0;s.goldB+=a.goldB||0;s.hints+=a.hints||0;s.combo+=a.combo||0;s.skillB+=a.skillB||0;}
  SKILL_NODES.forEach(n=>{const r=save.skills[n.id]||0;if(!r)return;if(n.cls!=='all'&&n.cls!==save.cls)return;for(const k in n.eff)s[k]+=n.eff[k]*r;});
  SLOTS.forEach(sl=>{const it=save.equip[sl];if(!it||!canEquip(it))return;const t=it.stats;s.atk+=t.atk||0;s.def+=t.def||0;s.maxHp+=t.hp||0;s.crit+=t.crit||0;s.expB+=(t.exp||0)/100;s.goldB+=(t.gold||0)/100;});
  s.maxHp=Math.round(s.maxHp);s.atk=Math.round(s.atk);s.def=Math.round(s.def);s.crit=Math.min(75,Math.round(s.crit));
  return s;
}
function canEquip(it){return !it.cls||it.cls===save.cls;}

/* ---------- 裝備產生 ---------- */
function rollRarity(tier){const w=RARITIES.map((r,i)=>i===0?Math.max(10,r.w-tier*3):r.w*(1+tier*0.15*i));let t=Math.random()*w.reduce((a,b)=>a+b);for(let i=0;i<w.length;i++){if((t-=w[i])<0)return i;}return 0;}
function genItem(stageIdx,minR=0){
  const tier=stageIdx+1;const ri=Math.max(rollRarity(tier),minR);const R=RARITIES[ri];
  const slot=pick(SLOTS);const clsList=Object.keys(CLASSES);const pickCls=()=>Math.random()<0.7?save.cls:pick(clsList);
  let cls=null,mainS,base;
  if(slot==='weapon'){if(Math.random()<0.75)cls=pickCls();mainS='atk';base=pick(WEAPON_NAMES[cls||'none']);}
  else if(slot==='emblem'){cls=pickCls();mainS=CLASS_MAIN[cls];base=cls+' '+pick(SLOT_NAMES.emblem);}
  else{if(Math.random()<0.15)cls=pickCls();mainS=slot==='helmet'?pick(['def','hp']):slot==='armor'?pick(['hp','def']):pick(['crit','exp','gold']);base=pick(SLOT_NAMES[slot]);}
  const bonus=cls?1.2:1;const val=(k,f)=>Math.max(1,Math.round(STAT_BASE[k](tier)*R.mult*f*bonus*rnd(0.85,1.15)));
  const stats={};stats[mainS]=val(mainS,1);
  if(slot==='emblem')stats.atk=(stats.atk||0)+val('atk',0.5);
  const others=shuffle(Object.keys(STAT_BASE).filter(k=>k!==mainS));
  for(let i=0;i<R.lines-1;i++){const k=others[i];stats[k]=(stats[k]||0)+val(k,0.55);}
  let name=pick(PREFIX[R.id])+' '+base;if(ri>=3)name+=' '+pick(SUFFIX);
  return {id:uid(),name,slot,rarity:R.id,ri,cls,stats,value:Math.round((8+tier*6)*R.mult)};
}
function statText(st){return Object.keys(st).map(k=>`+${st[k]} ${STAT_LABEL[k]}`).join(', ');}
function itemCard(it,extra=''){
  const R=RARITIES[it.ri];const ok=canEquip(it);
  return `<div class="item" style="border-color:${R.color}"><div class="iname" style="color:${R.color}">${SLOT_ICON[it.slot]} ${esc(it.name)}</div>
  <div><small>${it.rarity} · ${SLOT_LABEL[it.slot]}${it.cls?` · <span class="${ok?'good':'bad'}">限定 ${it.cls}</span>`:''}</small></div>
  <div class="istats">${statText(it.stats)}</div>${extra?`<div class="row">${extra}</div>`:''}</div>`;
}

/* ---------- 共用介面 ---------- */
function topbar(title){
  return `<div class="topbar"><button class="btn sm" onclick="go('${save?'menu':'title'}')">◀ ${save?'Menu':'Back'}</button><div class="tb-title">${title}</div>${save?`<div class="tb-info"><span class="gold">💰${save.gold}G</span> · Lv${save.level}</div>`:''}</div>`;
}
function modal(html,buttons=[{text:'OK'}]){
  const box=$('#modalBox');
  box.innerHTML=html+`<div class="mbtns">${buttons.map((b,i)=>`<button class="btn ${b.cls||''}" data-i="${i}">${b.text}</button>`).join('')}</div>`;
  $('#modal').classList.remove('hidden');
  box.querySelectorAll('[data-i]').forEach(el=>el.onclick=()=>{$('#modal').classList.add('hidden');const b=buttons[+el.dataset.i];if(b.fn)b.fn();});
}
function confirmBox(msg,fn){modal(`<h3>確認 Confirm</h3><p>${msg}</p>`,[{text:'Cancel 取消',cls:'gray'},{text:'OK 確定',cls:'red',fn}]);}
function go(name){
  SFX.click();window.scrollTo(0,0);
  ({title:renderTitle,menu:renderMenu,stages:renderStages,equip:renderEquip,skills:renderSkills,status:renderStatus,job:renderJob,shop:renderShop,bank:renderBank})[name]();
}

/* ---------- 標題 / 選職業 ---------- */
function renderTitle(){
  const has=!!loadSave();
  main.innerHTML=`<h1 class="logo">PIXEL<br>ENGLISH HERO</h1>
  <p class="sub">答對英文題 → 取得 AP 行動 → 打倒怪物！<br>Answer right, keep your turn!</p>
  <div class="row center" style="margin:14px 0">${has?`<button class="btn gold big" onclick="continueGame()">▶ Continue 繼續冒險</button>`:''}
  <button class="btn sm teal" onclick="go('bank')">📚 題庫 / CSV</button></div>
  <div class="pbox"><h3>⚔️ Choose Your Class 選擇職業</h3>
  <div class="row"><label>Hero Name 名字：<input id="heroName" maxlength="12" value="Hero"></label></div>
  <div class="class-grid">${Object.keys(CLASSES).map(k=>{const c=CLASSES[k],sk=SKILLS[k];return `<div class="ccard">
    <div class="spr">${heroSprite(k,null)}</div><h3>${k} ${c.zh}</h3>
    <p>❤️ HP ${c.hp} · ⚔️ ATK ${c.atk} · 🛡️ DEF ${c.def} · 💥 CRIT ${c.crit}%</p>
    <p class="gold">${c.passive}</p><p class="exp">Skill：${sk.name} — ${sk.desc}</p>
    <button class="btn red" onclick="newGame('${k}')">Choose 選擇</button></div>`;}).join('')}</div></div>`;
}
function continueGame(){save=loadSave();if(!save){renderTitle();return;}go('menu');}
function newGame(cls){
  const doIt=()=>{
    const name=($('#heroName')&&$('#heroName').value.trim())||'Hero';
    save={name,cls,adv:null,level:1,exp:0,gold:50,sp:1,skills:{},equip:{weapon:null,helmet:null,armor:null,accessory:null,emblem:null},bag:[],potions:3,cleared:{},rec:{battles:0,wins:0,correct:0,wrong:0,bestCombo:0},unlockAll:false,sound:true};
    save.equip.weapon={id:uid(),name:'Training '+WEAPON_NAMES[cls][0],slot:'weapon',rarity:'Common',ri:0,cls,stats:{atk:3},value:5};
    persist();go('menu');
    modal(`<h3>Welcome, ${esc(name)}!</h3><p>你成為了 <b>${cls} ${CLASSES[cls].zh}</b>！</p><p>✔ 答對題目：+1 AP、+1 Combo，可以行動或繼續答題。<br>✘ 答錯：顯示解析，怪物回合。<br>🎯 題型符合怪物弱點時傷害 ×1.5！</p>`);
  };
  if(loadSave())confirmBox('已有存檔，開新遊戲會覆蓋舊存檔，確定嗎？',doIt);else doIt();
}

/* ---------- 主選單 ---------- */
function mbtn(to,ic,t,zh,cls,badge){return `<button class="btn mbtn ${cls}" onclick="go('${to}')"><span class="ic">${ic}</span>${t}<small>${zh}</small>${badge?`<span class="badge">${badge}</span>`:''}</button>`;}
function renderMenu(){
  const s=getStats(),need=expNeed(save.level),canJob=save.level>=10&&!save.adv;
  main.innerHTML=`<div class="pbox hero-card"><div class="hc-sprite">${heroSprite(save.cls,save.adv)}</div>
  <div class="hc-info"><h2>${esc(save.name)}</h2><div class="title-tag">${getTitle()}</div>
  <div>${className()} · Lv <b>${save.level}</b></div>
  <div class="bar exp"><div style="width:${Math.min(100,save.exp/need*100)}%"></div></div><small>EXP ${save.exp} / ${need}</small>
  <div>💰 <span class="gold">${save.gold} G</span> · 🧪 Potion x${save.potions} · ⭐ SP ${save.sp}</div>
  <div><small>❤️${s.maxHp} ⚔️${s.atk} 🛡️${s.def} 💥${s.crit}%</small></div></div></div>
  <div class="menu-grid">
   ${mbtn('stages','⚔️','Stages','選擇關卡','red')}
   ${mbtn('equip','🎒','Equipment','裝備背包','',save.bag.length?save.bag.length:'')}
   ${mbtn('skills','🌳','Skill Tree','技能樹','green',save.sp>0?'SP '+save.sp:'')}
   ${mbtn('status','📊','Status','角色狀態','teal')}
   ${mbtn('job','✨','Job Change','轉職','purple',canJob?'NEW':'')}
   ${mbtn('shop','🧪','Shop','商店','gold')}
   ${mbtn('bank','📚','Question Bank','題庫 / CSV','gray')}
  </div>
  <div class="row center" style="margin-top:14px"><button class="btn sm gray" onclick="toggleSound()">${save.sound?'🔊 Sound ON':'🔇 Sound OFF'}</button>
  <button class="btn sm gray" onclick="go('title')">🏠 Title</button><button class="btn sm red" onclick="resetSave()">🗑 Reset Save</button></div>`;
}
function toggleSound(){save.sound=!save.sound;persist();renderMenu();}
function resetSave(){confirmBox('刪除所有角色存檔？（題庫不會刪除）',()=>{localStorage.removeItem(SAVE_KEY);save=null;renderTitle();});}

/* ---------- 關卡選擇 ---------- */
function isUnlocked(i){return i===0||save.unlockAll||(save.cleared[i-1]||0)>0;}
function renderStages(){
  main.innerHTML=topbar('⚔️ Stages 關卡選擇')+STAGES.map((st,i)=>{const un=isUnlocked(i);return `<div class="pbox stage ${un?'':'locked'}">
  <div class="st-sprite" style="font-size:${st.shape==='human'?4:4.5}px">${monsterSprite(st)}</div>
  <div class="st-info"><h3>Stage ${i+1}：${st.name}</h3><small>${st.zh}</small>
   <div>建議等級 Rec. Lv <b class="${save.level>=st.rec?'good':'bad'}">${st.rec}</b> · 弱點 Weak：${typeTag(st.weak)}</div>
   <div>題型：${st.types.map(typeTag).join(' ')}</div>
   <div>難度：<span class="diff">${st.diff.map(d=>'★'.repeat(d)).join(' / ')}</span> · HP ${st.hp} · ATK ${st.atk} · DEF ${st.def}</div>
   <div>獎勵：<span class="exp">EXP ${st.exp}</span> · <span class="gold">${st.gold} G</span> · 掉落率 Drop <b>${Math.round(st.drop*100)}%</b></div>
   <div><small>已通關 Cleared：${save.cleared[i]||0} 次</small></div></div>
  <div>${un?`<button class="btn red big" onclick="startBattle(${i})">Battle!</button>`:'<div>🔒 先通過前一關</div>'}</div></div>`;}).join('')
  +`<div class="row center"><label><input type="checkbox" ${save.unlockAll?'checked':''} onchange="save.unlockAll=this.checked;persist();renderStages()"> 老師模式：解鎖全部關卡</label></div>`;
}

/* ---------- 裝備 ---------- */
function renderEquip(){
  const s=getStats();
  const bag=save.bag.slice().sort((a,b)=>b.ri-a.ri);
  main.innerHTML=topbar('🎒 Equipment 裝備')+`<div class="pbox"><small>目前能力：❤️ ${s.maxHp} · ⚔️ ${s.atk} · 🛡️ ${s.def} · 💥 ${s.crit}% · EXP +${Math.round(s.expB*100)}% · GOLD +${Math.round(s.goldB*100)}%</small>
  <div class="row">${RARITIES.map(r=>`<span style="color:${r.color}">■ ${r.id}</span>`).join(' ')}</div></div>
  <div class="grid2"><div class="pbox"><h3>Equipped 已裝備</h3>${SLOTS.map(sl=>{const it=save.equip[sl];return `<div class="slot"><div class="slot-name">${SLOT_ICON[sl]} ${SLOT_LABEL[sl]}</div>${it?itemCard(it,`<button class="btn sm gray" onclick="unequip('${sl}')">Unequip 卸下</button>`):'<div class="empty">— Empty 空 —</div>'}</div>`;}).join('')}</div>
  <div class="pbox"><h3>Bag 背包 (${bag.length}/60)</h3>
  <div class="row"><button class="btn sm red" onclick="sellCommon()">賣出全部 Common</button></div>
  ${bag.length?bag.map(it=>{const cur=save.equip[it.slot];return itemCard(it,`<button class="btn sm green" ${canEquip(it)?'':'disabled'} onclick="equipItem('${it.id}')">Equip 裝備</button><button class="btn sm gold" onclick="sellItem('${it.id}')">Sell ${it.value}G</button>`+(cur?`<small>目前：${statText(cur.stats)}</small>`:''));}).join(''):'<div class="empty">背包是空的。打倒怪物有機率掉落裝備！</div>'}</div></div>`;
}
function equipItem(id){const i=save.bag.findIndex(x=>x.id===id);if(i<0)return;const it=save.bag[i];if(!canEquip(it))return;save.bag.splice(i,1);if(save.equip[it.slot])save.bag.push(save.equip[it.slot]);save.equip[it.slot]=it;persist();SFX.ok();renderEquip();}
function unequip(sl){if(!save.equip[sl])return;if(save.bag.length>=60){modal('<p>背包已滿！</p>');return;}save.bag.push(save.equip[sl]);save.equip[sl]=null;persist();renderEquip();}
function sellItem(id){const i=save.bag.findIndex(x=>x.id===id);if(i<0)return;save.gold+=save.bag[i].value;save.bag.splice(i,1);persist();beep(990,0.06);renderEquip();}
function sellCommon(){let g=0;save.bag=save.bag.filter(it=>{if(it.ri===0){g+=it.value;return false;}return true;});save.gold+=g;persist();renderEquip();if(g)modal(`<p>賣出 Common 裝備，獲得 <span class="gold">${g} G</span></p>`);}

/* ---------- 技能樹 ---------- */
function nodeHTML(n){
  const r=save.skills[n.id]||0;const reqOk=!n.req||(save.skills[n.req]||0)>0;const can=reqOk&&r<n.max&&save.sp>0;
  const st=r>=n.max?'max':!reqOk?'lock':can?'can':'';
  const reqN=n.req?SKILL_NODES.find(x=>x.id===n.req).name:'';
  return `<div class="node ${st}" onclick="learn('${n.id}')"><b>${n.name}</b><div>${n.desc}</div><div class="pips">${'■'.repeat(r)}${'□'.repeat(n.max-r)} ${r}/${n.max}</div>${n.req?`<small>${reqOk?'✔':'🔒'} 需要：${reqN}</small>`:''}</div>`;
}
function renderSkills(){
  main.innerHTML=topbar('🌳 Skill Tree 技能樹')+`<div class="pbox"><b>⭐ Skill Point：<span class="gold">${save.sp}</span></b><br><small>每升 1 級獲得 1 SP。點擊發亮（綠框）的技能來學習。</small>
  <div class="row"><button class="btn sm red" onclick="resetSkills()">重置技能 Reset (${50*save.level}G)</button></div></div>
  <div class="pbox"><h3>General 通用技能</h3><div class="tree">${SKILL_NODES.filter(n=>n.cls==='all').map(nodeHTML).join('')}</div></div>
  <div class="pbox"><h3>${save.cls} ${CLASSES[save.cls].zh} 職業技能</h3><div class="tree">${SKILL_NODES.filter(n=>n.cls===save.cls).map(nodeHTML).join('')}</div></div>`;
}
function learn(id){const n=SKILL_NODES.find(x=>x.id===id);const r=save.skills[id]||0;if(save.sp<1||r>=n.max)return;if(n.req&&!(save.skills[n.req]>0))return;save.skills[id]=r+1;save.sp--;persist();SFX.ok();renderSkills();}
function resetSkills(){const cost=50*save.level;let total=0;for(const k in save.skills)total+=save.skills[k];if(!total)return;if(save.gold<cost){modal('<p>金幣不足！</p>');return;}confirmBox(`花費 ${cost}G 重置技能並退還 ${total} SP？`,()=>{save.gold-=cost;save.sp+=total;save.skills={};persist();renderSkills();});}

/* ---------- 狀態 ---------- */

  const s=getStats(),key=save.adv||save.cls,sk=SKILLS[key],r=save.rec;
  const acc=r.correct+r.wrong?Math.round(r.correct/(r.correct+r.wrong)*100):0;
  main.innerHTML=topbar('📊 Status 角色狀態')+`<div class="pbox hero-card"><div class="hc-sprite" style="font-size:9px">${heroSprite(save.cls,save.adv)}</div>
  <div class="hc-info"><h2>${esc(save.name)}</h2><div class="title-tag">${getTitle()}</div><div>${className()}</div>
  <div>Lv ${save.level} · EXP ${save.exp}/${expNeed(save.level)}</div></div></div>
  <div class="grid2"><div class="pbox"><h3>Stats 能力值</h3><table class="stat-table">

  <div class="pbox"><h3>📥 CSV 匯入</h3>

  <div class="row"><input type="file" id="csvFile" accept=".csv,text/csv"></div>
  <textarea id="csvText" placeholder="也可以直接貼上 CSV 內容..."></textarea>

  <label><input type="radio" name="mode" value="append" checked> 加入 Append</label><label><input type="radio" name="mode" value="replace"> 取代 Replace</label></div>
  <div class="row"><button class="btn green" onclick="importCSV()">匯入 Import</button><button class="btn sm teal" onclick="downloadTemplate()">下載範本</button><button class="btn sm gold" onclick="exportCSV()">匯出目前題庫</button><button class="btn sm red" onclick="resetBank()">還原內建題庫</button></div></div>`;
  $('#csvFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#csvText').value=r.result;};r.readAsText(f,'UTF-8');};
}
function parseCSV(text){
  text=text.replace(/^\uFEFF/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else{if(c==='"')q=true;else if(c===','){row.push(f);f='';}else if(c==='\n'){row.push(f);rows.push(row);row=[];f='';}else if(c!=='\r')f+=c;}
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
function csvToQuestions(text,base){
  const rows=parseCSV(text),out=[],errors=[];
  rows.forEach((r,i)=>{
    if(r.every(x=>!x.trim()))return;
    if(i===0&&r[0].trim().toLowerCase()==='type')return;
    if(r.length<9){errors.push(`第 ${i+1} 列：欄位不足 9 欄`);return;}
    const type=r[0].trim().toLowerCase();if(!TYPES.includes(type)){errors.push(`第 ${i+1} 列：type 錯誤「${r[0]}」`);return;}
    let diff=parseInt(r[1]);if(isNaN(diff))diff=1;diff=Math.max(1,Math.min(3,diff));
    const choices=[r[3],r[4],r[5],r[6]].map(x=>(x||'').trim());
    let ai=parseInt(r[7]);if(isNaN(ai)){errors.push(`第 ${i+1} 列：answerIndex 不是數字`);return;}ai-=base;
    if(ai<0||ai>3||!choices[ai]){errors.push(`第 ${i+1} 列：answerIndex 超出範圍或該選項為空`);return;}
    if(!r[2].trim()){errors.push(`第 ${i+1} 列：題目為空`);return;}
    out.push({type,difficulty:diff,question:r[2].trim(),choices,answerIndex:ai,explanation:r.slice(8).join(',').trim()});
  });
  return {out,errors};
}
function importCSV(){
  const text=$('#csvText').value;if(!text.trim()){modal('<p>請先選擇檔案或貼上 CSV。</p>');return;}
  const base=+$('#csvBase').value,mode=document.querySelector('input[name=mode]:checked').value;
  const {out,errors}=csvToQuestions(text,base);
  if(!out.length){modal(`<h3>匯入失敗</h3><p>沒有有效題目。</p><div class="qlist">${errors.map(esc).join('<br>')}</div>`);return;}
  bank=mode==='replace'?out:bank.concat(out);saveBank();renderBank();
  modal(`<h3>✔ 匯入成功</h3><p>${mode==='replace'?'已取代題庫':'已加入題庫'}：${out.length} 題，目前共 ${bank.length} 題。</p>${errors.length?`<p class="bad">略過 ${errors.length} 列：</p><div class="qlist">${errors.map(esc).join('<br>')}</div>`:''}`);
}
const csvCell=v=>{v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
function download(name,text){const b=new Blob(['\uFEFF'+text],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
function toCSV(list,base){return 'type,difficulty,question,choice1,choice2,choice3,choice4,answerIndex,explanation\n'+list.map(q=>[q.type,q.difficulty,q.question,q.choices[0],q.choices[1],q.choices[2],q.choices[3],q.answerIndex+base,q.explanation].map(csvCell).join(',')).join('\n');}
function downloadTemplate(){const base=+$('#csvBase').value;download('question_template.csv',toCSV(QUESTION_BANK.slice(0,3),base));}
function exportCSV(){download('question_bank.csv',toCSV(bank,+$('#csvBase').value));}

function calcDmg(mult,o={}){
  const s=B.s,st=B.st;
  let base=s.atk*mult*rnd(0.9,1.1)-(o.pierce?0:st.def*0.5*mult);base=Math.max(1,base);
  const comboMul=1+Math.min(B.combo,20)*s.combo;
  const weak=(o.forceWeak||B.lastType===st.weak);
  const crit=o.forceCrit||Math.random()*100<s.crit;
  return {d:Math.max(1,Math.round(base*comboMul*(weak?1.5:1)*(crit?2:1))),crit,weak};
}
function hitMonster(mult,o){
  const r=calcDmg(mult,o);B.mhp=Math.max(0,B.mhp-r.d);

  anim('mon','hit');r.crit?SFX.crit():SFX.hit();log(`${r.crit?'💥暴擊！':''}${r.weak?'🎯弱點！':''}造成 ${r.d} 傷害`);updateHUD();return r;

  sk.hits.forEach((m,i)=>setTimeout(()=>{projectile(sk.color);setTimeout(()=>{if(B&&B.mhp>0)hitMonster(m*mul,{pierce:sk.pierce,forceWeak:sk.forceWeak,forceCrit:sk.forceCrit});},300);},250+i*230));
  setTimeout(()=>{
    if(!B)return;

function afterAct(delay=500){setTimeout(()=>{if(!B)return;B.lock=false;if(B.mhp<=0)return victory();if(B.ap<=0)nextQuestion();else renderPanel();},delay);}
function monsterTurn(){
  if(B.phase!=='wrong')return;B.phase='busy';B.lock=true;const st=B.st,s=B.s;
  renderPanel(`👹 ${st.name} 使用 ${st.atkName}！`);
  setTimeout(()=>{
    anim('mon','lunge-l');
    setTimeout(()=>{
      let d=st.atk*rnd(0.85,1.15)-s.def*0.5;d=Math.max(1,d)*(1-s.dmgRed);
      let blocked=false;if(B.defending){d*=Math.max(0.1,0.5-s.defendB);B.defending=false;blocked=true;}
      d=Math.max(1,Math.round(d));B.hp=Math.max(0,B.hp-d);
      anim('hero','hit');SFX.hit();floatText('hero','-'+d,'#ff6b7f');if(blocked)floatText('hero','BLOCK!','#73eff7',1);
      log(`👹 ${st.name} 造成 ${d} 傷害${blocked?'（防禦減傷）':''}`);updateHUD();
      setTimeout(()=>{if(B.hp<=0)defeat();else{B.lock=false;nextQuestion();}},800);
    },200);
  },500);
}
function victory(){
  B.phase='end';B.lock=true;const st=B.st,s=B.s;anim('mon','dead',99999);SFX.win();
  const exp=Math.round(st.exp*(1+s.expB)),gold=Math.round(st.gold*(1+s.goldB));
  save.gold+=gold;save.exp+=exp;let ups=0;
  while(save.level<50&&save.exp>=expNeed(save.level)){save.exp-=expNeed(save.level);save.level++;save.sp++;ups++;}
  let drop=null;if(Math.random()<st.drop){drop=genItem(B.i);if(save.bag.length<60)save.bag.push(drop);else drop.full=true;}
  save.cleared[B.i]=(save.cleared[B.i]||0)+1;save.rec.wins++;save.rec.bestCombo=Math.max(save.rec.bestCombo,B.maxCombo);persist();
  const idx=B.i;
  setTimeout(()=>{
    if(ups)setTimeout(()=>[523,784,1046,1318].forEach((f,i)=>setTimeout(()=>beep(f,0.1,'triangle'),i*90)),400);
    const btns=[{text:'🏠 Menu',cls:'gray',fn:()=>go('menu')},{text:'🔁 Retry',cls:'',fn:()=>startBattle(idx)}];
    if(idx+1<STAGES.length)btns.push({text:'▶ Next Stage',cls:'red',fn:()=>startBattle(idx+1)});
    modal(`<div class="center"><h2 class="gold">🏆 VICTORY!</h2><p>打倒了 ${st.name}！</p>
    <p>答對 ${B.correct} · 答錯 ${B.wrong} · 最高 Combo ${B.maxCombo}</p>
    <p><span class="exp">+${exp} EXP</span> · <span class="gold">+${gold} Gold</span></p>
    ${ups?`<p class="good" style="font-size:18px">⬆️ LEVEL UP! Lv ${save.level}（+${ups} SP）</p>`:''}
    ${ups&&save.level>=10&&!save.adv?'<p class="gold">✨ 已達 Lv10，可以到主選單轉職！</p>':''}</div>
    ${drop?`<h3>🎁 Drop 掉落裝備：</h3>${itemCard(drop)}${drop.full?'<p class="bad">背包已滿，裝備遺失！</p>':''}`:'<p class="center"><small>這次沒有掉落裝備。</small></p>'}`,btns);
  },900);
}
function defeat(){
  B.phase='end';anim('hero','dead',99999);SFX.lose();save.rec.bestCombo=Math.max(save.rec.bestCombo,B.maxCombo);persist();const idx=B.i;
  setTimeout(()=>modal(`<div class="center"><h2 class="bad">💀 DEFEATED</h2><p>${esc(save.name)} 被 ${B.st.name} 打倒了…</p><p>答對 ${B.correct} · 答錯 ${B.wrong}</p><p><small>提示：升級、學技能、換裝備或購買 Potion 再來挑戰！</small></p></div>`,
    [{text:'🏠 Menu',cls:'gray',fn:()=>go('menu')},{text:'🔁 Retry',cls:'red',fn:()=>startBattle(idx)}]),900);
}
function flee(){confirmBox('確定要逃跑嗎？不會獲得獎勵。',()=>{save.rec.bestCombo=Math.max(save.rec.bestCombo,B.maxCombo);persist();B=null;go('menu');});}

/* ---------- 特效 ---------- */
function anim(id,cls,dur=500){const el=$('#'+id);if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);if(dur<99999)setTimeout(()=>el.classList.remove(cls),dur);}
function floatText(who,text,color='#fff',off=0){
  const sc=$('#scene'),el=$('#'+who);if(!sc||!el)return;const r=el.getBoundingClientRect(),sr=sc.getBoundingClientRect();
  const d=document.createElement('div');d.className='dmg';d.textContent=text;d.style.color=color;
  d.style.left=(r.left-sr.left+r.width/2+rnd(-14,14))+'px';d.style.top=Math.max(50,(r.top-sr.top+off*24))+'px';
  sc.appendChild(d);setTimeout(()=>d.remove(),1100);
}
function projectile(color){
  const sc=$('#scene');if(!sc)return;const h=$('#hero').getBoundingClientRect(),m=$('#mon').getBoundingClientRect(),sr=sc.getBoundingClientRect();
  const p=document.createElement('div');p.className='proj';p.style.background=color;p.style.color=color;
  const x0=h.right-sr.left,y0=h.top-sr.top+h.height*0.4,x1=m.left-sr.left+m.width*0.4,y1=m.top-sr.top+m.height*0.5;
  p.style.left=x0+'px';p.style.top=y0+'px';sc.appendChild(p);
  if(p.animate)p.animate([{transform:'translate(0,0)'},{transform:`translate(${x1-x0}px,${y1-y0}px)`}],{duration:300,easing:'linear',fill:'forwards'});
  setTimeout(()=>p.remove(),310);
}

/* ---------- 鍵盤快捷鍵：1~4 選答案，Enter 繼續 ---------- */
document.addEventListener('keydown',e=>{
  if(!B||!$('#bpanel')||!$('#modal').classList.contains('hidden'))return;
  if(B.phase==='q'&&/^[1-4]$/.test(e.key)){const k=+e.key-1;if(k<B.q.order.length&&!B.q.removed.includes(k))answer(k);}
  else if(B.phase==='wrong'&&e.key==='Enter')monsterTurn();
  else if(B.phase==='act'){if(e.key==='Enter')nextQuestion();if(e.key==='a')act('attack');if(e.key==='s')act('skill');if(e.key==='d')act('defend');}
});

/* ---------- 啟動 ---------- */
renderTitle();
</script>
