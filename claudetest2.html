<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel English Hero</title>
<style>
/* =========================================================
   Pixel English Hero - 全部樣式 (Pixel Art CSS)
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:"Courier New",Consolas,"Lucida Console",monospace;
  font-size:20px;font-weight:bold;color:#fff;line-height:1.4;
  background-color:#10162f;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 2px,transparent 2px),
    linear-gradient(90deg,rgba(255,255,255,.03) 2px,transparent 2px);
  background-size:16px 16px;
  image-rendering:pixelated;
}
#app{max-width:1200px;margin:0 auto;padding:12px 12px 40px}
.screen{display:none}
.screen.active{display:block;animation:screenIn .3s steps(4)}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

h1.title{font-size:56px;color:#ffd166;text-align:center;letter-spacing:3px;
  text-shadow:4px 4px 0 #b5179e,8px 8px 0 #000;margin:20px 0 10px;line-height:1.15}
h2.screen-title{font-size:36px;color:#ffd166;text-shadow:3px 3px 0 #000;margin:10px 4px}
h3{font-size:26px;color:#8be9fd;text-shadow:2px 2px 0 #000;margin-bottom:10px}
p{margin:6px 0}
.center{text-align:center}
.subtitle{text-align:center;font-size:24px;color:#8be9fd;text-shadow:2px 2px 0 #000}

/* ---------- 像素面板 ---------- */
.panel{background:#1d2b53;border:4px solid #fff;box-shadow:0 0 0 4px #000,6px 6px 0 4px rgba(0,0,0,.5);
  padding:14px;margin:16px 6px}
.card{background:#24346b;border:4px solid #fff;box-shadow:0 0 0 4px #000;padding:14px;margin:4px}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:10px 4px}

/* ---------- 像素按鈕 ---------- */
.pbtn{font-family:inherit;font-weight:bold;font-size:22px;color:#fff;background:#3a5bd9;
  border:4px solid #000;padding:10px 16px;cursor:pointer;min-height:52px;
  box-shadow:inset -4px -4px 0 rgba(0,0,0,.35),inset 4px 4px 0 rgba(255,255,255,.3);
  text-shadow:2px 2px 0 #000;image-rendering:pixelated;user-select:none}
.pbtn:hover{filter:brightness(1.15)}
.pbtn:active{transform:translate(2px,2px);box-shadow:inset 4px 4px 0 rgba(0,0,0,.35)}
.pbtn:disabled{background:#4a4f63;color:#9aa0b5;cursor:not-allowed;filter:none;transform:none}
.pbtn.green{background:#2e9e4f}.pbtn.red{background:#c0392b}.pbtn.gold{background:#c98f0a}
.pbtn.purple{background:#7b3fbf}.pbtn.gray{background:#555c78}.pbtn.cyan{background:#118ab2}
.pbtn.small{font-size:20px;min-height:44px;padding:6px 12px}
.pbtn.big{font-size:30px;padding:16px 40px}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:14px 0}
.btn-row.left{justify-content:flex-start;margin:8px 0 0}
.back-btn{margin:6px}

/* ---------- 血條 / 經驗條 ---------- */
.bar{position:relative;height:30px;background:#222;border:3px solid #000;box-shadow:inset 0 0 0 2px #444;margin:6px 0}
.bar-fill{height:100%;transition:width .4s steps(10);
  background:repeating-linear-gradient(90deg,var(--c1) 0 12px,var(--c2) 12px 14px)}
.bar-hp .bar-fill{--c1:#ef476f;--c2:#b5173f}
.bar-mhp .bar-fill{--c1:#f77f00;--c2:#c25e00}
.bar-exp .bar-fill{--c1:#06d6a0;--c2:#04a57b}
.bar-q .bar-fill{--c1:#ffd166;--c2:#c99a2e}
.bar-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;text-shadow:2px 2px 0 #000;white-space:nowrap}

.chip{display:inline-block;background:#0d1330;border:3px solid #000;padding:2px 10px;margin:3px 4px 3px 0;font-size:20px}
.chip.ap{background:#1565c0}.chip.combo{background:#b5179e}.chip.pot{background:#2e7d32}
.chip.warn{background:#c0392b}.chip.buff{background:#6a1b9a}.chip.weak{background:#ef6c00}
.tag{display:inline-block;border:3px solid #000;padding:0 10px;margin-right:8px;background:#3949ab;font-size:20px}
.tag.diff-easy{background:#2e7d32}.tag.diff-normal{background:#ef6c00}.tag.diff-hard{background:#c62828}
.tag.weak{background:#ffd166;color:#000}
.boss-tag{background:#c62828;border:3px solid #000;padding:0 8px;margin-left:6px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.4}}
.warn{color:#ff8a80}.good{color:#69f0ae}.gold-text{color:#ffd166}

/* ---------- Pixel Art 容器 ---------- */
.pixel-art{position:relative;display:inline-block;image-rendering:pixelated;flex-shrink:0}
.px{position:absolute;background:transparent}
.hero-wrap{position:relative;display:inline-block}
.hero-weapon{position:absolute;transform-origin:50% 90%}
.bob{animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-4px)}}

/* ---------- 開始畫面 ---------- */
.start-sprites{display:flex;justify-content:center;align-items:flex-end;gap:26px;flex-wrap:wrap;margin:24px 0;min-height:120px}

/* ---------- 主選單 ---------- */
.hero-summary{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.hero-summary .hero-box{background:#16204a;border:3px solid #000;padding:16px 40px 10px 16px;min-width:140px;display:flex;justify-content:center}
.hero-info{flex:1;min-width:260px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:16px 6px}
.menu-btn{font-size:24px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;min-height:100px}
.menu-btn .ico{font-size:32px}
.badge{position:absolute;top:-12px;right:-10px;background:#e53935;border:3px solid #000;font-size:18px;padding:2px 8px}

/* ---------- 職業卡 ---------- */
.class-card .sprite-box{height:150px;display:flex;align-items:flex-end;justify-content:center;background:#16204a;margin-bottom:10px;border:3px solid #000;padding:10px 30px 10px 0}
.class-card h3{font-size:30px}
.stat-line{display:flex;justify-content:space-between;border-bottom:2px dotted #3d4f8f;padding:2px 0}

/* ---------- 地區 ---------- */
.area-card .area-banner{height:70px;border:3px solid #000;margin-bottom:10px;position:relative}

/* ---------- 戰鬥 ---------- */
.battle-top{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.battle-top .panel{margin:10px 6px}
.st-name{font-size:24px;color:#ffd166;text-shadow:2px 2px 0 #000}
.lv{color:#8be9fd}
.stage{position:relative;height:310px;border:4px solid #fff;box-shadow:0 0 0 4px #000;overflow:hidden;margin:14px 6px}
.stage-ground{position:absolute;left:0;right:0;bottom:0;height:70px}
.stage-deco{position:absolute;width:12px;height:12px}
.fighter{position:absolute;bottom:52px;z-index:2}
#b-player{left:12%}
#b-monster{right:12%}
.anim-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:5}
.area-tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.6);padding:2px 10px;border:3px solid #000;z-index:6;font-size:20px}
.flee{position:absolute;top:8px;right:8px;z-index:6;min-height:40px;font-size:20px;padding:2px 12px}
.question-panel .q-text{font-size:28px;margin:12px 0 16px;line-height:1.35}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{font-size:24px;text-align:left;background:#2f3e7a;display:flex;gap:12px;align-items:center;min-height:66px}
.choice .letter{background:#ffd166;color:#000;padding:0 10px;border:3px solid #000;text-shadow:none;flex-shrink:0}
.choice:disabled{background:#2f3e7a;color:#c9cfe8}
.choice.correct,.choice.correct:disabled{background:#2e9e4f;color:#fff}
.choice.wrong,.choice.wrong:disabled{background:#c0392b;color:#fff}
.choice.eliminated{opacity:.3;text-decoration:line-through}
.feedback{margin-top:14px;font-size:24px;min-height:10px}
.feedback.ok{color:#69f0ae}.feedback.bad{color:#ff8a80}
.explain{background:#0f1733;border:3px dashed #ffd166;padding:10px;margin-top:8px;color:#fff;font-size:22px}
.action-title{font-size:22px;color:#ffd166;margin-bottom:10px}
.action-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.act{font-size:22px;padding:10px 6px}
.pulse{animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{filter:brightness(1.35)}}
.skill-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;margin:10px 0}
.skill-btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;font-size:22px;gap:4px}
.skill-btn .desc{font-size:20px;font-weight:normal}
.log{max-height:230px;overflow:auto;font-size:20px}
.log div{padding:3px 0;border-bottom:2px dotted #3d4f8f}
.log .l-good{color:#69f0ae}.log .l-bad{color:#ff8a80}.log .l-skill{color:#e1bee7}.log .l-info{color:#8be9fd}

/* 角色動作動畫 */
.shake{animation:shake .4s steps(4)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(10px)}50%{transform:translateX(-10px)}75%{transform:translateX(6px)}}
.hurt{animation:hurt .5s steps(4)}
@keyframes hurt{0%,100%{transform:translateX(0);filter:none}25%{transform:translateX(-12px);filter:brightness(2.2)}50%{transform:translateX(8px);filter:none}75%{transform:translateX(-6px);filter:brightness(2.2)}}
.lunge-r{animation:lungeR .35s steps(3)}
@keyframes lungeR{50%{transform:translateX(50px)}}
.lunge-l{animation:lungeL .35s steps(3)}
@keyframes lungeL{50%{transform:translateX(-50px)}}
.dying{animation:dying .7s steps(6) forwards}
@keyframes dying{to{opacity:0;transform:scale(.3) translateY(40px)}}
.swing{animation:swing .35s steps(3)}
@keyframes swing{50%{transform:rotate(75deg)}}
.stage-shake{animation:shake .45s steps(5)}

/* ---------- 技能動畫 FX ---------- */
.fx{position:absolute;pointer-events:none;animation-fill-mode:both}
.fx-proj{animation:fxFly var(--t,550ms) linear both}
@keyframes fxFly{from{transform:translate(0,0) rotate(var(--rot,0deg))}to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot,0deg))}}
.fx-fireball{width:30px;height:30px;margin:-15px 0 0 -15px;background:#ff3d00;
  box-shadow:0 0 0 5px #ff9100,0 0 0 10px rgba(255,145,0,.4),-22px 0 0 2px rgba(255,61,0,.5)}
.fx-meteor{width:46px;height:46px;margin:-23px 0 0 -23px;background:#ff6d00;
  box-shadow:0 0 0 6px #ffab00,22px -22px 0 4px rgba(255,109,0,.6),42px -42px 0 2px rgba(255,171,0,.4)}
.fx-explode{width:40px;height:40px;margin:-20px 0 0 -20px;background:#ffeb3b;
  box-shadow:0 0 0 8px #ff9800,0 0 0 16px rgba(244,67,54,.6);animation:fxExplode .5s steps(6) both}
.fx-explode.big{width:70px;height:70px;margin:-35px 0 0 -35px}
.fx-explode.gold{background:#fff8e1;box-shadow:0 0 0 8px #ffd54f,0 0 0 16px rgba(255,213,79,.5)}
@keyframes fxExplode{0%{transform:scale(.2);opacity:1}70%{transform:scale(1.6);opacity:1}100%{transform:scale(2.2);opacity:0}}
.fx-slash{width:150px;height:10px;margin:-5px 0 0 -75px;background:#fff;box-shadow:0 0 0 3px #b3e5fc;animation:fxSlash .4s steps(5) both}
@keyframes fxSlash{0%{transform:rotate(var(--rot,-35deg)) scaleX(0);opacity:1}60%{transform:rotate(var(--rot,-35deg)) scaleX(1.1);opacity:1}100%{transform:rotate(var(--rot,-35deg)) scaleX(1.3);opacity:0}}
.fx-hit{width:30px;height:30px;margin:-15px 0 0 -15px;background:#fff;animation:fxHit .35s steps(4) both}
@keyframes fxHit{0%{transform:scale(.3) rotate(0);opacity:1}100%{transform:scale(2) rotate(45deg);opacity:0}}
.fx-shieldblock{width:36px;height:44px;margin:-22px 0 0 -18px;background:#42a5f5;border:4px solid #0d47a1;box-shadow:inset 0 0 0 4px #bbdefb}
.fx-crack{width:170px;height:16px;margin:-8px 0 0 -85px;background:#3e2723;
  clip-path:polygon(0 50%,10% 0,20% 100%,30% 10%,40% 90%,50% 0,60% 100%,70% 20%,80% 90%,90% 0,100% 50%,90% 100%,10% 100%);
  animation:fxCrack .9s steps(6) both}
@keyframes fxCrack{0%{transform:scaleX(0)}40%{transform:scaleX(1)}80%{opacity:1}100%{transform:scaleX(1);opacity:0}}
.fx-rock{width:16px;height:16px;margin:-8px 0 0 -8px;background:#8d6e63;box-shadow:inset -4px -4px 0 #5d4037;animation:fxRock .7s ease-out both}
@keyframes fxRock{0%{transform:translate(0,0)}50%{transform:translate(var(--dx),-70px)}100%{transform:translate(calc(var(--dx) * 2),0);opacity:0}}
.fx-aura{width:110px;height:150px;margin:-75px 0 0 -55px;border:6px solid #ff1744;background:rgba(255,23,68,.15);animation:fxAura .7s steps(6) both}
@keyframes fxAura{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
.fx-spin{width:150px;height:150px;margin:-75px 0 0 -75px;animation:fxSpin 1s linear both}
.fx-spin::before,.fx-spin::after{content:"";position:absolute;left:0;top:50%;width:100%;height:10px;margin-top:-5px;background:#fff;box-shadow:0 0 0 3px #90caf9}
.fx-spin::after{transform:rotate(90deg)}
@keyframes fxSpin{0%{transform:rotate(0) scale(.3);opacity:1}80%{opacity:1}100%{transform:rotate(1080deg) scale(1.1);opacity:0}}
.fx-ice{width:26px;height:80px;margin:-80px 0 0 -13px;background:linear-gradient(90deg,#e1f5fe 0 40%,#4fc3f7 40% 100%);
  clip-path:polygon(50% 0,100% 100%,0 100%);transform-origin:50% 100%;animation:fxIce .7s steps(5) both}
@keyframes fxIce{0%{transform:scaleY(0)}40%{transform:scaleY(1.15)}80%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.fx-bolt{width:64px;height:var(--h,200px);margin-left:-32px;background:#ffeb3b;
  clip-path:polygon(40% 0,75% 0,55% 35%,85% 35%,35% 100%,48% 55%,20% 55%);animation:fxBolt .6s steps(6) both}
@keyframes fxBolt{0%{opacity:0}10%{opacity:1}30%{opacity:.2}45%{opacity:1}100%{opacity:0}}
.fx-flash{width:100%;height:100%;background:#fff;animation:fxFlash .4s steps(4) both}
@keyframes fxFlash{0%{opacity:.7}100%{opacity:0}}
.fx-shield{width:130px;height:160px;margin:-80px 0 0 -65px;background:rgba(79,195,247,.3);
  box-shadow:inset 0 0 0 6px #4fc3f7,inset 0 0 0 12px rgba(255,255,255,.4);
  clip-path:polygon(20% 0,80% 0,100% 20%,100% 80%,80% 100%,20% 100%,0 80%,0 20%);animation:fxShield 1s steps(8) both}
@keyframes fxShield{0%{transform:scale(.3);opacity:0}30%{transform:scale(1.1);opacity:1}80%{transform:scale(1);opacity:1}100%{opacity:0}}
.fx-arrow{width:46px;height:6px;margin:-3px 0 0 -23px;background:#a1887f}
.fx-arrow::after{content:"";position:absolute;right:-12px;top:-6px;border-left:14px solid #eceff1;border-top:9px solid transparent;border-bottom:9px solid transparent}
.fx-arrow::before{content:"";position:absolute;left:-4px;top:-6px;width:10px;height:18px;background:#e53935}
.fx-arrow.poison{background:#66bb6a;box-shadow:0 0 0 3px rgba(118,255,3,.4)}
.fx-arrow.poison::after{border-left-color:#b2ff59}
.fx-arrow.gold{background:#ffd54f;box-shadow:0 0 0 3px rgba(255,213,79,.5)}
.fx-bubble{width:12px;height:12px;background:#76ff03;animation:fxRise .7s steps(5) both}
@keyframes fxRise{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-70px);opacity:0}}
.fx-heal{width:12px;height:12px;background:#69f0ae;box-shadow:0 0 0 3px rgba(105,240,174,.4);animation:fxRise .8s steps(6) both}
.fx-aim{width:90px;height:90px;margin:-45px 0 0 -45px;border:4px solid #ff1744;animation:fxAim .7s steps(6) both}
.fx-aim::before{content:"";position:absolute;background:#ff1744;left:50%;top:-20px;bottom:-20px;width:4px;margin-left:-2px}
.fx-aim::after{content:"";position:absolute;background:#ff1744;top:50%;left:-20px;right:-20px;height:4px;margin-top:-2px}
@keyframes fxAim{0%{transform:scale(2.2);opacity:0}60%{transform:scale(1);opacity:1}100%{transform:scale(.8);opacity:0}}
.fx-scan{width:var(--w,120px);height:8px;margin-left:calc(var(--w,120px) / -2);background:#40c4ff;box-shadow:0 0 0 4px rgba(64,196,255,.35);animation:fxScan .9s steps(9) both}
@keyframes fxScan{0%{transform:translateY(-60px);opacity:0}10%{opacity:1}50%{transform:translateY(60px)}90%{opacity:1}100%{transform:translateY(-60px);opacity:0}}
.fx-qmark{font-size:48px;color:#40c4ff;margin-left:-14px;margin-top:-50px;text-shadow:3px 3px 0 #000;animation:fxRise .9s steps(6) both}
.fx-bookwave{width:40px;height:50px;margin:-25px 0 0 -20px;border:5px solid #80deea;box-shadow:0 0 0 6px rgba(255,255,255,.6),0 0 0 12px rgba(128,222,234,.4)}
.fx-orb{width:20px;height:20px;margin:-10px 0 0 -10px;background:#e040fb;box-shadow:0 0 0 5px rgba(224,64,251,.4)}
.fx-letter{width:38px;height:38px;margin:-19px 0 0 -19px;background:#fff59d;border:4px solid #f57f17;color:#000;font-size:22px;display:flex;align-items:center;justify-content:center}
.fx-beam{height:26px;width:var(--len,200px);margin-top:-13px;background:repeating-linear-gradient(90deg,#fff8e1 0 10px,#ffd54f 10px 20px);
  box-shadow:0 0 0 5px rgba(255,213,79,.5);transform-origin:0 50%;animation:fxBeam .9s steps(8) both}
@keyframes fxBeam{0%{transform:rotate(var(--rot,0deg)) scaleX(0)}35%{transform:rotate(var(--rot,0deg)) scaleX(1)}80%{transform:rotate(var(--rot,0deg)) scaleX(1) scaleY(1);opacity:1}100%{transform:rotate(var(--rot,0deg)) scaleX(1) scaleY(.1);opacity:0}}
.dmg-num{font-size:34px;color:#fff;text-shadow:3px 3px 0 #000,-2px -2px 0 #000;white-space:nowrap;animation:fxNum 1s ease-out both;z-index:10}
.dmg-num.crit{color:#ffd54f;font-size:44px}
.dmg-num.player{color:#ff5252}.dmg-num.heal{color:#69f0ae}.dmg-num.info{color:#80d8ff;font-size:28px}.dmg-num.poison{color:#b2ff59}
@keyframes fxNum{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-20px) scale(1.2);opacity:1}100%{transform:translate(-50%,-80px) scale(1);opacity:0}}

/* ---------- 裝備 ---------- */
.item-card{display:flex;gap:12px;background:#16204a;border:4px solid #888;padding:10px;align-items:flex-start;margin:4px 0}
.item-icon{min-width:64px;min-height:64px;display:flex;justify-content:center;align-items:center;background:#0d1330;border:3px solid #000;padding:6px}
.item-info{flex:1}
.item-name{font-size:22px;text-shadow:2px 2px 0 #000}
.item-sub{font-size:20px;color:#c5cae9}
.item-req{font-size:20px;color:#ffcc80}
.stat-chip{display:inline-block;background:#0d1330;border:2px solid #4a5a9a;padding:0 6px;margin:2px;font-size:20px}
.slot-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.slot-box{background:#24346b;border:3px solid #000;padding:8px}
.slot-label{color:#ffd166;margin-bottom:4px}
.empty-slot{padding:20px;text-align:center;color:#8a93b8;border:3px dashed #4a5a9a}
.equip-top{display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.equip-preview{background:#16204a;border:3px solid #000;padding:20px 50px 14px 20px}

/* ---------- 技能 / 天賦 / 任務 ---------- */
.tree-card{border-color:#888}
.tree-card.learned{border-color:#69f0ae}
.tree-card.available{border-color:#ffd166}
.tree-card.locked{opacity:.7}
.status-line{margin:6px 0}
.quest-card.done{border-color:#ffd166}
.quest-card.claimed{opacity:.6;border-color:#69f0ae}

/* ---------- 匯入 ---------- */
textarea{width:100%;min-height:220px;font-family:inherit;font-size:20px;background:#0d1330;color:#fff;border:4px solid #000;padding:10px}
input[type=file]{font-family:inherit;font-size:20px;color:#fff;margin:8px 0;max-width:100%}
.radio-row label{display:block;margin:6px 0;cursor:pointer;font-size:22px}
.radio-row input{transform:scale(1.6);margin-right:12px}
pre.sample{background:#0d1330;border:3px solid #000;padding:10px;white-space:pre-wrap;word-break:break-all;font-size:20px}

/* ---------- Modal / Toast ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.hidden{display:none}
.modal-box{background:#1d2b53;border:4px solid #fff;box-shadow:0 0 0 4px #000,8px 8px 0 4px rgba(0,0,0,.6);padding:20px;max-width:640px;width:100%;max-height:90vh;overflow:auto}
.modal-box h2{font-size:32px;color:#ffd166;text-shadow:3px 3px 0 #000;margin-bottom:10px}
#toast-wrap{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:94%}
.toast{background:#0d1330;border:4px solid #ffd166;box-shadow:0 0 0 3px #000;padding:8px 16px;font-size:20px;animation:toastIn .3s steps(3)}
@keyframes toastIn{from{transform:translateY(-20px);opacity:0}}

.levelup{color:#ffd166;font-size:30px;animation:blink .8s steps(2) 4}
.big-reward{font-size:26px}

/* ---------- 新增技能動畫 ---------- */
.fx-slash.huge{width:280px;height:18px;margin:-9px 0 0 -140px;box-shadow:0 0 0 4px #ffd54f,0 0 0 10px rgba(255,213,79,.4)}
.fx-orb.drain{background:#ff1744;box-shadow:0 0 0 5px rgba(255,23,68,.4)}
.fx-star{width:14px;height:14px;margin:-7px 0 0 -7px;background:#ffeb3b;box-shadow:0 0 0 3px #f57f17;animation:fxStar .9s steps(6) both}
@keyframes fxStar{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),-40px) rotate(180deg);opacity:0}}

/* ---------- Responsive ---------- */
@media (max-width:820px){
  .battle-top{grid-template-columns:1fr}
  .action-grid{grid-template-columns:repeat(2,1fr)}
  .action-grid .next-btn{grid-column:span 2}
  .stage{height:250px}
}
@media (max-width:560px){
  #app{padding:6px 6px 30px}
  h1.title{font-size:40px}
  h2.screen-title{font-size:32px}
  .choices{grid-template-columns:1fr}
  .stage{height:220px}
  #b-player{left:5%}
  #b-monster{right:5%}
  .question-panel .q-text{font-size:24px}
  .panel{padding:10px;margin:12px 4px}
}
</style>

<script>
/* ==========================================================================

   4. 天賦：修改 TALENTS（天賦資料區）
   5. 任務：修改 QUESTS（任務資料區）
   6. 裝備：修改 CLASS_EQUIPMENT / EQUIPMENT_NAME_DATA（裝備資料區）
   ========================================================================== */

/* ==========================================================================
   ★★★ 老師可編輯題庫區 QUESTION BANK ★★★
   type: vocabulary / grammar / sentence / conversation / reading /
         preposition / verb / past tense / adjective / comparative
   difficulty: easy / normal / hard
   answerIndex: 正確答案在 choices 的位置 (0~3)
   （遊戲顯示時會自動打亂選項順序）
   ========================================================================== */
const QUESTION_BANK = [
  // ----- vocabulary -----
  {id:1,type:"vocabulary",difficulty:"easy",question:"Which word means 「狗」?",choices:["Cat","Dog","Bird","Fish"],answerIndex:1,explanation:"Dog = 狗；Cat = 貓；Bird = 鳥；Fish = 魚。"},
  {id:2,type:"vocabulary",difficulty:"easy",question:"Which one is a fruit?",choices:["Chair","Apple","Pencil","Shoe"],answerIndex:1,explanation:"Apple（蘋果）是水果，其他是物品。"},
  {id:3,type:"vocabulary",difficulty:"easy",question:"The opposite of 'hot' is ___.",choices:["cold","warm","big","fast"],answerIndex:0,explanation:"hot（熱）的相反是 cold（冷）。"},
  {id:4,type:"vocabulary",difficulty:"easy",question:"Which word means 「書」?",choices:["desk","book","bag","door"],answerIndex:1,explanation:"book = 書；desk = 書桌；bag = 包包；door = 門。"},
  {id:5,type:"vocabulary",difficulty:"easy",question:"Which animal can fly?",choices:["Fish","Cow","Bird","Pig"],answerIndex:2,explanation:"Bird（鳥）會飛。"},
  {id:6,type:"vocabulary",difficulty:"easy",question:"What color is the sky on a sunny day?",choices:["Green","Blue","Black","Pink"],answerIndex:1,explanation:"晴天的天空是 blue（藍色）。"},
  {id:7,type:"vocabulary",difficulty:"easy",question:"Which word is a day of the week?",choices:["March","Summer","Monday","Morning"],answerIndex:2,explanation:"Monday 是星期一；March 是三月；Summer 是夏天。"},
  {id:8,type:"vocabulary",difficulty:"easy",question:"We use a ___ to write.",choices:["pen","cup","ball","bed"],answerIndex:0,explanation:"pen（筆）是用來寫字的。"},
  {id:9,type:"vocabulary",difficulty:"normal",question:"'Enormous' means ___.",choices:["very small","very big","very fast","very old"],answerIndex:1,explanation:"enormous = 巨大的 (very big)。"},
  {id:10,type:"vocabulary",difficulty:"normal",question:"Which word means 「圖書館」?",choices:["library","laboratory","lobby","ladder"],answerIndex:0,explanation:"library = 圖書館；laboratory = 實驗室。"},
  {id:11,type:"vocabulary",difficulty:"normal",question:"A person who teaches students is a ___.",choices:["doctor","farmer","teacher","driver"],answerIndex:2,explanation:"teacher = 老師。"},
  {id:12,type:"vocabulary",difficulty:"hard",question:"'Curious' is closest in meaning to ___.",choices:["angry","interested","tired","lazy"],answerIndex:1,explanation:"curious = 好奇的，接近 interested（感興趣的）。"},
  {id:13,type:"vocabulary",difficulty:"hard",question:"The word 'ancient' means ___.",choices:["very old","very new","very loud","very cheap"],answerIndex:0,explanation:"ancient = 古老的。"},
  {id:14,type:"vocabulary",difficulty:"hard",question:"'Generous' people like to ___.",choices:["take things","share things","sleep a lot","run fast"],answerIndex:1,explanation:"generous = 慷慨的，喜歡分享。"},
  {id:15,type:"vocabulary",difficulty:"hard",question:"Which word means 「勇敢的」?",choices:["brave","bright","broken","bored"],answerIndex:0,explanation:"brave = 勇敢的；bright = 明亮的；bored = 無聊的。"},
  // ----- sentence -----
  {id:16,type:"sentence",difficulty:"easy",question:"Choose the correct sentence.",choices:["She like apples.","She likes apples.","She liking apples.","She are like apples."],answerIndex:1,explanation:"主詞 She 是第三人稱單數，動詞要加 s：likes。"},
  {id:17,type:"sentence",difficulty:"easy",question:"Put in order: (is / my / This / bag)",choices:["This is my bag.","My this is bag.","Is this bag my.","Bag my is this."],answerIndex:0,explanation:"正確語序：This is my bag.（這是我的包包。）"},
  {id:18,type:"sentence",difficulty:"easy",question:"Choose the correct sentence.",choices:["I am a student.","I is a student.","I are a student.","I be a student."],answerIndex:0,explanation:"I 搭配 am。"},
  {id:19,type:"sentence",difficulty:"easy",question:"Complete: ___ name is Tom.",choices:["He","His","Him","He's"],answerIndex:1,explanation:"His 是所有格「他的」，His name = 他的名字。"},
  {id:20,type:"sentence",difficulty:"normal",question:"Choose the correct question.",choices:["Where you live?","Where do you live?","Where does you live?","Where you do live?"],answerIndex:1,explanation:"一般動詞問句要用助動詞 do：Where do you live?"},
  {id:21,type:"sentence",difficulty:"normal",question:"Put in order: (to / going / I / am / school)",choices:["I am going to school.","I going am to school.","To school I going am.","Am I going school to."],answerIndex:0,explanation:"現在進行式：I am going to school."},
  {id:22,type:"sentence",difficulty:"normal",question:"Choose the correct question.",choices:["What time it is?","What time is it?","What is time it?","Time what is it?"],answerIndex:1,explanation:"問時間：What time is it?"},
  {id:23,type:"sentence",difficulty:"normal",question:"Complete: There ___ two cats under the table.",choices:["is","are","am","be"],answerIndex:1,explanation:"two cats 是複數，用 There are。"},
  {id:24,type:"sentence",difficulty:"hard",question:"Choose the correct sentence.",choices:["If it will rain, we stay home.","If it rains, we will stay home.","If it rained, we will stay home.","If it rain, we would stay home."],answerIndex:1,explanation:"第一條件句：If + 現在式, 主詞 + will + 原形。"},
  {id:25,type:"sentence",difficulty:"hard",question:"Choose the correct sentence.",choices:["Neither Tom nor I am ready.","Neither Tom nor I are ready.","Neither Tom or I am ready.","Neither Tom nor me am ready."],answerIndex:0,explanation:"neither A nor B：動詞跟著最靠近的主詞 I，所以用 am。"},
  {id:26,type:"sentence",difficulty:"hard",question:"Which sentence is correct?",choices:["The book which I bought it is good.","The book I bought is good.","The book what I bought is good.","The book who I bought is good."],answerIndex:1,explanation:"關係代名詞當受詞可省略；不可再多加 it，也不能用 what / who。"},
  {id:27,type:"sentence",difficulty:"hard",question:"Choose the best sentence.",choices:["Although he was tired, but he kept working.","Although he was tired, he kept working.","Because he was tired, but he kept working.","He was tired, although kept working."],answerIndex:1,explanation:"although 和 but 不能同時使用。"},
  // ----- conversation -----
  {id:28,type:"conversation",difficulty:"easy",question:"A: How are you?  B: ___",choices:["I'm fine, thank you.","I'm ten.","It's a pen.","Yes, I do."],answerIndex:0,explanation:"How are you? 問近況，回答 I'm fine, thank you."},
  {id:29,type:"conversation",difficulty:"easy",question:"A: Thank you!  B: ___",choices:["You're welcome.","Goodbye, sorry.","I'm hungry.","No, thanks."],answerIndex:0,explanation:"別人道謝時回答 You're welcome.（不客氣）"},
  {id:30,type:"conversation",difficulty:"easy",question:"A: What's your name?  B: ___",choices:["I'm twelve.","My name is Amy.","I like dogs.","It's sunny."],answerIndex:1,explanation:"問名字，回答 My name is ..."},
  {id:31,type:"conversation",difficulty:"easy",question:"A: Nice to meet you.  B: ___",choices:["Nice to meet you, too.","I'm sorry.","See you yesterday.","Me neither."],answerIndex:0,explanation:"回應 Nice to meet you, too."},
  {id:32,type:"conversation",difficulty:"normal",question:"A: Would you like some tea?  B: ___",choices:["Yes, please.","Yes, I would like.","No, I don't like it tea.","I'm tea."],answerIndex:0,explanation:"禮貌接受：Yes, please."},
  {id:33,type:"conversation",difficulty:"normal",question:"A: Can I borrow your pen?  B: ___",choices:["Sure, here you are.","Yes, I can't.","No, you are.","It's my pen to borrow."],answerIndex:0,explanation:"借東西給別人：Sure, here you are.（給你）"},
  {id:34,type:"conversation",difficulty:"hard",question:"A: I'm sorry I'm late.  B: ___",choices:["That's all right.","You're welcome.","Congratulations!","Same to you."],answerIndex:0,explanation:"別人道歉時回答 That's all right.（沒關係）"},
  {id:35,type:"conversation",difficulty:"hard",question:"A: Do you mind if I open the window?  B: ___ (你同意)",choices:["Yes, I do.","Not at all.","Yes, please don't.","I mind it."],answerIndex:1,explanation:"Do you mind...? 回答 Not at all 表示「不介意」＝同意。"},
  {id:36,type:"conversation",difficulty:"hard",question:"A: I passed the exam!  B: ___",choices:["Congratulations!","Never mind.","Bless you.","Take care of it."],answerIndex:0,explanation:"恭喜別人：Congratulations!"},
  {id:37,type:"conversation",difficulty:"hard",question:"A: Could you tell me the way to the station?  B: ___",choices:["Go straight and turn left.","I'm a station.","Yes, I could.","It's on time."],answerIndex:0,explanation:"問路要給方向：Go straight and turn left."},
  // ----- preposition -----
  {id:38,type:"preposition",difficulty:"easy",question:"The cat is ___ the box. (在盒子裡)",choices:["in","on","at","to"],answerIndex:0,explanation:"在裡面用 in。"},
  {id:39,type:"preposition",difficulty:"easy",question:"I get up ___ 7 o'clock.",choices:["in","on","at","by"],answerIndex:2,explanation:"幾點鐘用 at。"},
  {id:40,type:"preposition",difficulty:"easy",question:"My birthday is ___ May.",choices:["at","in","on","by"],answerIndex:1,explanation:"月份前用 in。"},
  {id:41,type:"preposition",difficulty:"easy",question:"The book is ___ the desk. (在桌上)",choices:["under","on","in","at"],answerIndex:1,explanation:"在表面上用 on。"},
  {id:42,type:"preposition",difficulty:"easy",question:"We have English class ___ Monday.",choices:["in","at","on","of"],answerIndex:2,explanation:"星期幾前用 on。"},
  {id:43,type:"preposition",difficulty:"normal",question:"The ball is ___ the chair and the table.",choices:["between","among","across","along"],answerIndex:0,explanation:"兩者之間用 between。"},
  {id:44,type:"preposition",difficulty:"normal",question:"She walked ___ the bridge to the other side.",choices:["across","among","at","of"],answerIndex:0,explanation:"橫越用 across。"},
  {id:45,type:"preposition",difficulty:"normal",question:"I'm good ___ drawing.",choices:["in","at","on","with"],answerIndex:1,explanation:"be good at = 擅長。"},
  {id:46,type:"preposition",difficulty:"hard",question:"He has lived here ___ 2015.",choices:["for","since","from","at"],answerIndex:1,explanation:"since + 時間點（自從）；for + 一段時間。"},
  {id:47,type:"preposition",difficulty:"hard",question:"She is afraid ___ spiders.",choices:["of","at","with","from"],answerIndex:0,explanation:"be afraid of = 害怕。"},
  // ----- verb -----
  {id:48,type:"verb",difficulty:"easy",question:"I ___ to school every day.",choices:["go","goes","going","gone"],answerIndex:0,explanation:"主詞 I，現在簡單式用原形 go。"},
  {id:49,type:"verb",difficulty:"normal",question:"She ___ her homework every night.",choices:["do","does","doing","done"],answerIndex:1,explanation:"第三人稱單數 She 用 does。"},
  {id:50,type:"verb",difficulty:"normal",question:"They ___ playing soccer now.",choices:["is","am","are","be"],answerIndex:2,explanation:"They 搭配 are，現在進行式 are playing。"},
  {id:51,type:"verb",difficulty:"normal",question:"Look! The baby ___.",choices:["sleep","sleeps","is sleeping","slept"],answerIndex:2,explanation:"Look! 表示正在發生，用現在進行式。"},
  {id:52,type:"verb",difficulty:"normal",question:"He can ___ very fast.",choices:["run","runs","running","ran"],answerIndex:0,explanation:"can 後面接原形動詞。"},
  {id:53,type:"verb",difficulty:"normal",question:"I enjoy ___ books.",choices:["read","to read","reading","reads"],answerIndex:2,explanation:"enjoy 後面接 V-ing。"},
  {id:54,type:"verb",difficulty:"normal",question:"We want ___ the museum.",choices:["visit","to visit","visiting","visited"],answerIndex:1,explanation:"want 後面接 to + 原形。"},
  {id:55,type:"verb",difficulty:"hard",question:"I have ___ this movie twice.",choices:["see","saw","seen","seeing"],answerIndex:2,explanation:"現在完成式 have + 過去分詞 seen。"},
  {id:56,type:"verb",difficulty:"hard",question:"The window was ___ by the boy.",choices:["break","broke","broken","breaking"],answerIndex:2,explanation:"被動語態 be + 過去分詞 broken。"},
  // ----- past tense -----
  {id:57,type:"past tense",difficulty:"easy",question:"Yesterday I ___ a cake.",choices:["make","made","makes","making"],answerIndex:1,explanation:"Yesterday 用過去式，make → made。"},
  {id:58,type:"past tense",difficulty:"normal",question:"She ___ to the park last Sunday.",choices:["go","goes","went","gone"],answerIndex:2,explanation:"last Sunday 用過去式，go → went。"},
  {id:59,type:"past tense",difficulty:"normal",question:"We ___ TV last night.",choices:["watch","watched","watching","watches"],answerIndex:1,explanation:"last night 用過去式 watched。"},
  {id:60,type:"past tense",difficulty:"normal",question:"He ___ a letter yesterday.",choices:["write","wrote","written","writes"],answerIndex:1,explanation:"write 的過去式是 wrote。"},
  {id:61,type:"past tense",difficulty:"normal",question:"They ___ at home last weekend.",choices:["are","were","was","be"],answerIndex:1,explanation:"They 的 be 動詞過去式是 were。"},
  {id:62,type:"past tense",difficulty:"normal",question:"I ___ my keys this morning.",choices:["lose","lost","losed","losing"],answerIndex:1,explanation:"lose 的過去式是 lost（不規則）。"},
  {id:63,type:"past tense",difficulty:"normal",question:"Did you ___ breakfast today?",choices:["eat","ate","eaten","eating"],answerIndex:0,explanation:"Did 後面接原形動詞。"},
  {id:64,type:"past tense",difficulty:"hard",question:"When I ___ home, my mom was cooking.",choices:["get","got","gets","getting"],answerIndex:1,explanation:"過去發生的事用過去式 got。"},
  {id:65,type:"past tense",difficulty:"hard",question:"She ___ come to the party yesterday.",choices:["doesn't","didn't","don't","wasn't"],answerIndex:1,explanation:"過去式否定：didn't + 原形。"},
  // ----- adjective -----
  {id:66,type:"adjective",difficulty:"easy",question:"An elephant is very ___.",choices:["tiny","big","thin","quick"],answerIndex:1,explanation:"大象很 big（大）。"},
  {id:67,type:"adjective",difficulty:"normal",question:"The movie was so ___ that I fell asleep.",choices:["boring","bored","excited","exciting"],answerIndex:0,explanation:"boring = 令人無聊的（形容事物）。"},
  {id:68,type:"adjective",difficulty:"normal",question:"I am ___ in science.",choices:["interesting","interested","interest","interests"],answerIndex:1,explanation:"人感到有興趣用 interested。"},
  {id:69,type:"adjective",difficulty:"normal",question:"Which word is an adjective?",choices:["quickly","happy","run","under"],answerIndex:1,explanation:"happy 是形容詞；quickly 是副詞。"},
  {id:70,type:"adjective",difficulty:"normal",question:"She has a ___ dress.",choices:["beautiful red","red beautiful","beautifully red","red beautifully"],answerIndex:0,explanation:"形容詞順序：意見 (beautiful) 在顏色 (red) 之前。"},
  {id:71,type:"adjective",difficulty:"normal",question:"The soup tastes ___.",choices:["well","good","nicely","goodly"],answerIndex:1,explanation:"taste 是連綴動詞，後面接形容詞 good。"},
  {id:72,type:"adjective",difficulty:"normal",question:"This bag is too ___ to carry.",choices:["heavy","heavily","heaviness","heavier than"],answerIndex:0,explanation:"too + 形容詞 + to V。"},
  {id:73,type:"adjective",difficulty:"hard",question:"The children were ___ by the magic show.",choices:["amazed","amazing","amaze","amazement"],answerIndex:0,explanation:"人感到驚訝用 amazed。"},
  // ----- comparative -----
  {id:74,type:"comparative",difficulty:"easy",question:"A car is ___ than a bike.",choices:["fast","faster","fastest","more fast"],answerIndex:1,explanation:"比較級 + than：faster than。"},
  {id:75,type:"comparative",difficulty:"normal",question:"Tom is ___ than his brother.",choices:["tall","taller","tallest","more tall"],answerIndex:1,explanation:"tall 的比較級是 taller。"},
  {id:76,type:"comparative",difficulty:"normal",question:"This is the ___ book in the library.",choices:["old","older","oldest","more old"],answerIndex:2,explanation:"the + 最高級：the oldest。"},
  {id:77,type:"comparative",difficulty:"normal",question:"Math is ___ than art for me.",choices:["difficult","more difficult","most difficult","difficulter"],answerIndex:1,explanation:"長的形容詞用 more：more difficult。"},
  {id:78,type:"comparative",difficulty:"normal",question:"My bag is ___ than yours.",choices:["good","better","best","gooder"],answerIndex:1,explanation:"good → better → best（不規則）。"},
  {id:79,type:"comparative",difficulty:"normal",question:"Winter is ___ season of the year.",choices:["cold","colder","the coldest","more cold"],answerIndex:2,explanation:"一年之中最冷：the coldest。"},
  {id:80,type:"comparative",difficulty:"normal",question:"She runs as ___ as her sister.",choices:["fast","faster","fastest","more fast"],answerIndex:0,explanation:"as + 原級 + as。"},
  {id:81,type:"comparative",difficulty:"hard",question:"This is ___ movie I have ever seen.",choices:["bad","worse","the worst","the baddest"],answerIndex:2,explanation:"bad → worse → the worst。"},
  {id:82,type:"comparative",difficulty:"hard",question:"The more you practice, the ___ you become.",choices:["good","better","best","well"],answerIndex:1,explanation:"The 比較級..., the 比較級...（越…就越…）"},
  // ----- grammar -----
  {id:83,type:"grammar",difficulty:"easy",question:"___ apple a day keeps the doctor away.",choices:["A","An","The","Some"],answerIndex:1,explanation:"apple 母音開頭，用 An。"},
  {id:84,type:"grammar",difficulty:"easy",question:"These ___ my friends.",choices:["is","are","am","be"],answerIndex:1,explanation:"These 是複數，用 are。"},
  {id:85,type:"grammar",difficulty:"normal",question:"There isn't ___ milk in the fridge.",choices:["some","any","many","a"],answerIndex:1,explanation:"否定句用 any。"},
  {id:86,type:"grammar",difficulty:"normal",question:"He ___ never been to Japan.",choices:["have","has","is","did"],answerIndex:1,explanation:"現在完成式，He 用 has。"},
  {id:87,type:"grammar",difficulty:"normal",question:"I have two ___.",choices:["child","childs","children","childrens"],answerIndex:2,explanation:"child 的複數是 children。"},
  {id:88,type:"grammar",difficulty:"normal",question:"How ___ water do you drink?",choices:["many","much","more","lot"],answerIndex:1,explanation:"water 不可數，用 How much。"},
  {id:89,type:"grammar",difficulty:"hard",question:"If I ___ a bird, I would fly to you.",choices:["am","were","will be","been"],answerIndex:1,explanation:"與現在事實相反的假設，be 動詞用 were。"},
  {id:90,type:"grammar",difficulty:"hard",question:"She asked me where ___.",choices:["do I live","I lived","did I live","I live did"],answerIndex:1,explanation:"間接問句用直述句語序：where I lived。"},
  {id:91,type:"grammar",difficulty:"hard",question:"By the time we arrived, the movie ___.",choices:["started","has started","had started","starts"],answerIndex:2,explanation:"過去的過去用過去完成式 had started。"},
  {id:92,type:"grammar",difficulty:"hard",question:"English ___ all over the world.",choices:["speaks","is spoken","spoke","is speaking"],answerIndex:1,explanation:"英語「被說」，用被動語態 is spoken。"},
  {id:93,type:"grammar",difficulty:"hard",question:"I'm used to ___ up early.",choices:["get","getting","got","gets"],answerIndex:1,explanation:"be used to + V-ing（習慣於）。"},

/* ==========================================================================
   工具函式 Utilities
   ========================================================================== */
const $ = id => document.getElementById(id);
const rand = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
let uidCounter = 1;
function uid(){ return "it" + Date.now().toString(36) + (uidCounter++) + Math.floor(Math.random()*1000); }
function shuffle(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function weightedPick(obj){ const entries = Object.entries(obj); const total = entries.reduce((s,e)=>s+e[1],0); let r = Math.random()*total; for(const [k,w] of entries){ r -= w; if(r <= 0) return k; } return entries[entries.length-1][0]; }
function debounce(fn, ms){ let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; }
function rarityIndex(r){ return RARITIES.findIndex(x => x.id === r); }
function rarityColor(r){ const R = RARITIES[rarityIndex(r)]; return R ? R.color : "#b0b0b0"; }

/* ==========================================================================
   遊戲狀態 Game State
   ========================================================================== */
let player = null;
let questionBank = clone(QUESTION_BANK);
let customQuestions = false;
let battle = null;
let recentQuestions = [];
const SAVE_KEY = "pixelEnglishHero_save_v1";
const QKEY = "pixelEnglishHero_questions_v1";

/* ---------- 存檔（localStorage 不可用時自動忽略，仍可遊玩） ---------- */
function saveGame(){
  if(!player) return;
  try{ localStorage.setItem(SAVE_KEY, JSON.stringify(player)); }catch(e){ /* 環境限制，忽略 */ }
}
function saveQuestions(){
  try{
    if(customQuestions) localStorage.setItem(QKEY, JSON.stringify(questionBank));
    else localStorage.removeItem(QKEY);
  }catch(e){}
}
function loadGame(){
  try{
    const q = localStorage.getItem(QKEY);
    if(q){ const arr = JSON.parse(q); if(Array.isArray(arr) && arr.length){ questionBank = arr; customQuestions = true; } }
  }catch(e){}
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return;
    const p = JSON.parse(raw);
    if(p && CLASSES[p.className]){
      player = p;
      // 舊存檔補欄位
      if(!player.stats) player.stats = {answered:0,correct:0,kills:0,bosses:0};
      if(!player.maxCombo) player.maxCombo = 0;
      AREAS.forEach(a => { if(!player.areaProgress[a.id]) player.areaProgress[a.id] = {kills:0,totalKills:0,bossKills:0}; });
      QUESTS.forEach(q => { if(!player.quests.find(x => x.id === q.id)) player.quests.push(clone(q)); });
      // 舊版天賦(陣列) → 新版(等級物件)，退還天賦點
      if(Array.isArray(player.learnedTalents)){ player.talentPoints += player.learnedTalents.length; player.learnedTalents = {}; }
      if(!player.learnedTalents) player.learnedTalents = {};
      ensureBounties();
      recalcStats();
    }
  }catch(e){ player = null; }
}

/* ==========================================================================
   玩家 Player
   ========================================================================== */
function expNeeded(lv){ return Math.floor(40 + (lv-1)*30 + (lv-1)*(lv-1)*3); }

function createPlayer(cn){
  const c = CLASSES[cn];
  const p = {
    className:cn, jobName:cn, level:1, exp:0, expToNext:expNeeded(1), gold:30,
    hp:0, maxHp:0, attack:0, defense:0, critRate:0, ap:0, combo:0, maxCombo:0,
    skillPoints:0, talentPoints:0, potions:3,
    expBonus:0, goldBonus:0, dropRateBonus:0, defendPower:0.5,
    learnedSkills:[c.startSkill], learnedTalents:{}, shop:null,
    equipment:{weapon:null,helmet:null,armor:null,accessory:null,emblem:null},
    inventory:[], areaProgress:{}, quests:clone(QUESTS),
    stats:{answered:0,correct:0,kills:0,bosses:0}
  };
  AREAS.forEach(a => p.areaProgress[a.id] = {kills:0,totalKills:0,bossKills:0});
  const sw = STARTER_WEAPONS[cn];
  p.equipment.weapon = {uid:uid(),name:sw.name,slot:"weapon",weaponType:sw.weaponType,rarity:"Common",stats:clone(sw.stats),classRestriction:null,levelRequirement:1,tier:1};
  player = p;
  recalcStats();
  player.hp = totalMaxHp();
  ensureBounties();
  updateQuests("level");
  saveGame();
}

function talentValue(key){
  let t = 0;
  if(!player || !player.learnedTalents) return 0;
  for(const id in player.learnedTalents){
    const tl = TALENTS.find(x => x.id === id);
    if(tl && tl.perLevel && tl.perLevel[key]) t += tl.perLevel[key] * player.learnedTalents[id];
  }
  return t;
}
function findJob(name){
  for(const cn in JOBS){ const j = JOBS[cn].find(x => x.name === name); if(j) return j; }
  return null;
}
/* 重新計算玩家基礎能力（職業 + 等級 + 天賦 + 轉職），裝備加成另外計算 */
function recalcStats(){
  const c = CLASSES[player.className], L = player.level - 1;
  const s = {
    maxHp:c.base.maxHp + c.growth.maxHp*L, attack:c.base.attack + c.growth.attack*L,
    defense:c.base.defense + c.growth.defense*L, critRate:c.base.critRate + c.growth.critRate*L,
    expBonus:c.base.expBonus||0, goldBonus:0, dropRateBonus:0, defendPower:0.5
  };
   for(const id in player.learnedTalents){
    const t = TALENTS.find(x => x.id === id);
    const r = player.learnedTalents[id] || 0;
    if(t && t.perLevel) for(const k in t.perLevel){ if(k in s) s[k] += t.perLevel[k] * r; }
  }
  if(player.jobName !== player.className){
    const j = findJob(player.jobName);
    if(j) for(const k in j.bonus){ if(k in s) s[k] += j.bonus[k]; }
  }
  player.maxHp = Math.floor(s.maxHp);
  player.attack = Math.floor(s.attack);
  player.defense = Math.floor(s.defense);
  player.critRate = Math.floor(s.critRate);
  player.expBonus = s.expBonus;
  player.goldBonus = s.goldBonus;
  player.dropRateBonus = s.dropRateBonus;
  player.defendPower = Math.min(0.9, s.defendPower);
  if(player.hp > totalMaxHp()) player.hp = totalMaxHp();
}
function equipBonus(key){
  let t = 0;
  for(const sl in player.equipment){ const it = player.equipment[sl]; if(it && it.stats && it.stats[key]) t += it.stats[key]; }
  return t;
}
function totalStat(key){ return (player[key]||0) + equipBonus(key); }
function totalMaxHp(){ return totalStat("maxHp"); }

/* 獲得經驗，回傳升級次數 */
function gainExp(amount){
  player.exp += amount;
  let ups = 0;
  while(player.exp >= player.expToNext){
    player.exp -= player.expToNext;
    player.level++; ups++;
    player.skillPoints += SP_PER_LEVEL; player.talentPoints += TP_PER_LEVEL;
    player.expToNext = expNeeded(player.level);
  }
  if(ups > 0){
    recalcStats();
    player.hp = totalMaxHp();
    updateQuests("level");
    toast(`★ LEVEL UP! Now Lv ${player.level} (+${ups} SP / +${ups} TP)`);
  }
  return ups;
}

/* ==========================================================================
   任務系統 Quests
   ========================================================================== */
function updateQuests(type, target, amount){
  if(!player) return;
  amount = amount || 1;
  player.quests.forEach(q => {
    if(q.completed || q.claimed || q.type !== type) return;
    let changed = false;
    switch(type){
      case "kill": if(target && target.indexOf(q.target) !== -1){ q.progress += amount; changed = true; } break;
      case "areaKill": case "bossKill": case "answerType":
        if(target === q.target){ q.progress += amount; changed = true; } break;
      case "correct": case "skillUse": case "gold":
        q.progress += amount; changed = true; break;
      case "combo": if(player.combo > q.progress){ q.progress = Math.min(q.required, player.combo); changed = true; } break;
      case "collectRarity": if(rarityIndex(target) >= rarityIndex(q.target)){ q.progress += 1; changed = true; } break;
      case "level": if(player.level > q.progress){ q.progress = Math.min(q.required, player.level); changed = true; } break;
    }
    if(changed){
      if(q.progress >= q.required){ q.progress = q.required; q.completed = true; toast(`✔ Quest Complete: ${q.name}! Claim it in Quests.`); }
      if(battle && battle.questChanges) battle.questChanges.add(q.id);
    }
  });
}
function rewardsText(r){
  const parts = [];
  if(r.exp) parts.push(`${r.exp} EXP`);
  if(r.gold) parts.push(`${r.gold} Gold`);
  if(r.potion) parts.push(`${r.potion} Potion`);
  if(r.equipment) parts.push(`<span style="color:${rarityColor(r.equipment)}">${r.equipment} Equipment</span>`);
  return parts.join(" · ");
}
function claimQuest(id){
  const q = player.quests.find(x => x.id === id);
  if(!q || !q.completed || q.claimed) return;
  q.claimed = true;
  const r = q.rewards; let html = `<p>Rewards for <b>${esc(q.name)}</b>:</p>`;
  if(r.gold){ player.gold += r.gold; html += `<p class="gold-text">+${r.gold} Gold</p>`; }
  if(r.potion){ player.potions += r.potion; html += `<p class="good">+${r.potion} Potion</p>`; }
  if(r.equipment){
    const it = generateEquipment(r.equipment, tierForLevel());
    addToInventory(it);
    html += itemCardHTML(it, "");
  }
  if(r.exp){
    const ups = gainExp(r.exp);
    html += `<p class="good">+${r.exp} EXP</p>`;
    if(ups) html += `<p class="levelup">LEVEL UP! Lv ${player.level}</p>`;
  }
  saveGame();
  renderQuests();
  showModal("Quest Reward!", html, [{text:"OK",cls:"green"}]);
}

/* ==========================================================================
   裝備系統 Equipment
   ========================================================================== */
function tierForLevel(){ return clamp(1 + Math.floor(player.level/3), 1, 6); }
function rollRarity(isBoss){ return weightedPick(isBoss ? DROP_WEIGHTS.boss : DROP_WEIGHTS.normal); }

/* 產生裝備：依稀有度與地區(tier)產生合理名稱與能力 */
function generateEquipment(rarity, tier){
  tier = clamp(tier||1, 1, 6);
  const area = AREAS[tier-1];
  const ri = Math.max(0, rarityIndex(rarity));
  const R = RARITIES[ri];
  const m = R.mult;
  const ts = 1 + 0.6*(tier-1);
  const levelReq = area.recommendedLevel;
  // Rare 以上有 30% 機率變成職業專屬裝備
  if(ri >= 2 && Math.random() < 0.3){
    const own = CLASS_EQUIPMENT.filter(e => e.classRestriction === player.className);
    const t = Math.random() < 0.75 ? pick(own) : pick(CLASS_EQUIPMENT);
    const stats = {};
    for(const k in t.stats){
      const pct = PERCENT_STATS.indexOf(k) !== -1;
      stats[k] = Math.max(1, Math.round(t.stats[k] * (pct ? 1 : ts) * m / 1.8));
    }
    return {uid:uid(),name:t.name,slot:t.slot,weaponType:t.weaponType||null,rarity:R.id,stats,classRestriction:t.classRestriction,levelRequirement:levelReq,tier,special:true};
  }
  const ND = EQUIPMENT_NAME_DATA;
  const slot = weightedPick({weapon:30,helmet:18,armor:20,accessory:20,emblem:12});
  const rw = pick(ND.rarityWords[R.id]);
  const aw = pick(ND.areaWords[area.id]);
  let name = "", weaponType = null, classRestriction = null;
  const stats = {};
  if(slot === "weapon"){
    weaponType = Math.random() < 0.6 ? pick(CLASS_WEAPON_PREF[player.className]) : pick(WEAPON_TYPES);
    const wd = ND.weapons[weaponType];
    name = `${rw} ${aw} ${pick(wd.names)}`;
    stats.attack = Math.max(1, Math.round((2 + tier*2.5) * m * wd.atk));
    for(const k in wd.extra) stats[k] = Math.max(1, Math.round(wd.extra[k] * m * (PERCENT_STATS.indexOf(k) !== -1 ? 1 : ts)));
  } else if(slot === "helmet"){
    name = `${rw} ${aw} ${pick(ND.slotNames.helmet)}`;
    stats.defense = Math.max(1, Math.round((1 + tier) * m));
    stats.maxHp = Math.round((5 + tier*5) * m);
  } else if(slot === "armor"){
    name = `${rw} ${aw} ${pick(ND.slotNames.armor)}`;
    stats.defense = Math.max(1, Math.round((2 + tier*1.5) * m));
    stats.maxHp = Math.round((10 + tier*8) * m);
  } else if(slot === "accessory"){
    name = `${rw} ${aw} ${pick(ND.slotNames.accessory)}`;
    const k = pick(Object.keys(ND.accessoryStats));
    stats[k] = Math.max(1, Math.round(ND.accessoryStats[k] * m));
    stats.attack = Math.max(1, Math.round((1 + tier*0.8) * m));
  } else {
    classRestriction = Math.random() < 0.8 ? player.className : pick(Object.keys(CLASSES));
    name = `${rw} ${aw} ${classRestriction} Emblem`;
    stats.attack = Math.max(1, Math.round((1 + tier*1.2) * m));
    stats.defense = Math.max(1, Math.round((1 + tier) * m * 0.8));
    stats.critRate = Math.max(1, Math.round(2 * m));
  }
  // 高稀有度額外能力
  const extraBase = {attack:1+tier, defense:1+tier*0.7, maxHp:8+tier*4, critRate:2, expBonus:4, goldBonus:5, dropRateBonus:3};
  const extras = Math.max(0, ri - 1);
  for(let i=0;i<extras;i++){
    const k = pick(Object.keys(extraBase));
    stats[k] = (stats[k]||0) + Math.max(1, Math.round(extraBase[k] * m * 0.5));
  }
  return {uid:uid(),name,slot,weaponType,rarity:R.id,stats,classRestriction,levelRequirement:levelReq,tier};
}
function addToInventory(item){
  player.inventory.push(item);
  updateQuests("collectRarity", item.rarity);
}
function canEquip(item){
  if(item.classRestriction && item.classRestriction !== player.className) return {ok:false, reason:`${item.classRestriction} Only`};
  if(player.level < item.levelRequirement) return {ok:false, reason:`Requires Lv ${item.levelRequirement}`};
  return {ok:true, reason:""};
}
function equipItem(id, refresh){
  const idx = player.inventory.findIndex(x => x.uid === id);
  if(idx < 0) return;
  const item = player.inventory[idx];
  const c = canEquip(item);
  if(!c.ok){ toast("✘ Cannot equip: " + c.reason); return; }
  const old = player.equipment[item.slot];
  player.equipment[item.slot] = item;
  player.inventory.splice(idx, 1);
  if(old) player.inventory.push(old);
  recalcStats();
  saveGame();
  toast(`Equipped ${item.name}!`);
  if(refresh === "victory"){
    const b = $("victory-equip-btn");
    if(b){ b.disabled = true; b.textContent = "✔ Equipped!"; }
  } else renderEquipment();
}
function unequipItem(slot){
  const it = player.equipment[slot];
  if(!it) return;
  player.inventory.push(it);
  player.equipment[slot] = null;
  recalcStats();
  saveGame();
  renderEquipment();
}
function itemValue(it){ const R = RARITIES[Math.max(0,rarityIndex(it.rarity))]; return R.sell * (it.tier||1); }
function sellItem(id){
  const idx = player.inventory.findIndex(x => x.uid === id);
  if(idx < 0) return;
  const it = player.inventory[idx];
  const v = itemValue(it);
  player.inventory.splice(idx, 1);
  player.gold += v;
  saveGame();
  toast(`Sold ${it.name} for ${v} Gold.`);
  renderEquipment();
}
function buyPotion(){
  if(player.gold < POTION_PRICE){ toast("Not enough Gold!"); return; }
  player.gold -= POTION_PRICE; player.potions++;
  saveGame(); toast("Bought 1 Potion!");
  renderEquipment();
}
function statsText(stats){
  return Object.keys(stats).map(k => `<span class="stat-chip">+${stats[k]}${PERCENT_STATS.indexOf(k)!==-1?"%":""} ${STAT_LABELS[k]||k}</span>`).join("");
}
function slotLabel(id){ const s = SLOTS.find(x => x.id === id); return s ? s.label : id; }
function itemCardHTML(item, actionsHTML){
  const col = rarityColor(item.rarity);
  let icon;
  if(item.slot === "weapon") icon = weaponSpriteHTML(item, 4);
  else { const ic = ITEM_ICONS[item.slot]; icon = pixelArt(ic.pattern, Object.assign({}, ic.palette, {c:col}), 6); }
  return `<div class="item-card" style="border-color:${col}">
    <div class="item-icon">${icon}</div>
    <div class="item-info">
      <div class="item-name" style="color:${col}">${esc(item.name)}</div>
      <div class="item-sub">${item.rarity} · ${slotLabel(item.slot)}${item.weaponType?" ("+item.weaponType+")":""}</div>
      <div>${statsText(item.stats)}</div>
      <div class="item-req">${item.classRestriction?item.classRestriction+" Only · ":""}Lv ${item.levelRequirement}+</div>
      ${actionsHTML||""}
    </div></div>`;
}

/* ==========================================================================
   Pixel Art 繪製（box-shadow 像素）
   ========================================================================== */
function pixelArt(pattern, palette, unit){
  const pal = Object.assign({}, DEFAULT_PALETTE, palette||{});
  const sh = []; let w = 0;
  pattern.forEach((row, y) => {
    w = Math.max(w, row.length);
    for(let x=0; x<row.length; x++){
      const ch = row[x];
      if(ch === "." || ch === " ") continue;
      const col = pal[ch];
      if(col) sh.push(`${(x+1)*unit}px ${(y+1)*unit}px 0 0 ${col}`);
    }
  });
  return `<div class="pixel-art" style="width:${w*unit}px;height:${pattern.length*unit}px"><div class="px" style="width:${unit}px;height:${unit}px;left:${-unit}px;top:${-unit}px;box-shadow:${sh.join(",")}"></div></div>`;
}
/* advanced：false = 初始職業；字串 = 轉職名稱（使用 JOB_LOOKS 外觀） */
function classSpriteHTML(cn, unit, advanced, weaponItem, showWeapon){
  let pattern = PLAYER_PATTERNS[cn];
  let pal = Object.assign({}, CLASSES[cn].palette);
  if(typeof advanced === "string" && JOB_LOOKS[advanced]){
    pattern = JOB_LOOKS[advanced].pattern;
    pal = Object.assign({}, JOB_LOOKS[advanced].palette);
  } else if(advanced) pal.c = "#ffd54f";
  const body = pixelArt(pattern, pal, unit);
  let w = "";
  if(showWeapon){
    w = `<div class="hero-weapon" style="left:${10*unit}px;top:${3*unit}px">${weaponSpriteHTML(weaponItem, unit)}</div>`;
  }
  return `<div class="hero-wrap">${body}${w}</div>`;
}
function heroHTML(unit){
  const adv = player.jobName !== player.className ? player.jobName : false;
  return classSpriteHTML(player.className, unit, adv, player.equipment.weapon, true);
}
function weaponSpriteHTML(item, unit){
  const type = item && item.weaponType && WEAPON_SPRITES[item.weaponType] ? item.weaponType : "dagger";
  const ws = WEAPON_SPRITES[type];
  const pal = Object.assign({}, ws.palette, {c: item ? rarityColor(item.rarity) : "#9e9e9e"});
  return pixelArt(ws.pattern, pal, unit);
}
function monsterSpriteHTML(m, unit){
  return pixelArt(MONSTER_PATTERNS[m.sprite] || MONSTER_PATTERNS.slime, m.palette, unit);

function pxUnit(){ const w = window.innerWidth; return w < 500 ? 4 : (w < 900 ? 5 : 7); }

/* ==========================================================================
   Battle System 戰鬥系統
   ========================================================================== */
function findSkill(id){
  for(const cn in SKILL_TREES){ const s = SKILL_TREES[cn].find(x => x.id === id); if(s) return s; }
  return null;
}
/* 抽題：先找地區題型 + 地區難度；不足則用同難度其他題型補足 */
function drawQuestion(area){
  let pool = questionBank.filter(q => area.questionTypes.indexOf(q.type) !== -1 && q.difficulty === area.difficulty);
  if(pool.length < 6){
    const extra = questionBank.filter(q => q.difficulty === area.difficulty && pool.indexOf(q) === -1);
    pool = pool.concat(extra);
  }
  if(pool.length === 0) pool = questionBank.filter(q => area.questionTypes.indexOf(q.type) !== -1);
  if(pool.length === 0) pool = questionBank.slice();
  let fresh = pool.filter(q => recentQuestions.indexOf(q.id) === -1);
  if(fresh.length === 0) fresh = pool;
  const q = pick(fresh);
  recentQuestions.push(q.id);
  const limit = Math.max(1, Math.min(20, Math.floor(pool.length*0.6)));
  while(recentQuestions.length > limit) recentQuestions.shift();
  return q;
}

function startBattle(areaId){
  const area = AREAS.find(a => a.id === areaId);
  if(!area) return;
  if(!questionBank.length){ toast("No questions! Please import questions first."); return; }
  if(player.hp <= 0) player.hp = Math.ceil(totalMaxHp()*0.5);
  const prog = player.areaProgress[areaId];
  const isBoss = prog.kills >= area.requiredKillsForBoss;
  const base = isBoss ? area.boss : pick(area.monsters);
  const m = scaleMonster(clone(base), area, isBoss);
  player.ap = 1 + talentValue("apStart"); // 每場戰鬥至少 1 AP
  battle = {
    area, monster:m, isBoss, phase:"question", question:null, order:[0,1,2,3], hidden:[],
    defend:false, shield:0, buffs:{atk:0,atkTurns:0}, monWeakTurns:0, poison:null,
    hintNext:false, lastType:null, busy:false, showSkills:false, log:[], questChanges:new Set(), firstQ:true
  };
  showScreen("battle");
  renderBattleLayout();
  addLog(isBoss ? `☠ BOSS BATTLE! ${m.name} appears!` : `A wild ${m.name} appears!`, isBoss ? "bad" : "info");
  nextQuestion();
}

      ${deco.join("")}
      <div class="stage-ground" style="background:repeating-linear-gradient(90deg,${a.bg.ground} 0 24px,${a.bg.ground2} 24px 48px);border-top:6px solid ${a.bg.edge}"></div>

function renderFighters(){

  const mu = battle.isBoss ? Math.floor(u*1.6) : u + 1;

function updateBattleStatus(){

  const st = [];
  if(battle.defend) st.push(`<span class="chip buff">🛡 DEFEND</span>`);

  if(battle.hintNext) st.push(`<span class="chip">🔍 HINT READY</span>`);
