/* ==========================================================================
   ★ 背景音樂資料區 BGM_TRACKS（老師可修改）
   tempo 速度 / melody 主旋律 / bass 低音（"-" = 休止）/ drum 鼓聲
   每格是八分音符
   ========================================================================== */
const BGM_TRACKS = {
  menu:{tempo:110, lead:"square", leadVol:0.08, drum:false,
    melody:"E5 - G5 - C6 - B5 A5 G5 - E5 - F5 - D5 - E5 - G5 - A5 - G5 E5 C5 - D5 - - -".split(" "),
    bass:"C3 - C3 - A2 - A2 - F2 - F2 - G2 - G2 -".split(" ")},
  battle:{tempo:150, lead:"square", leadVol:0.08, drum:true,
    melody:"A4 - C5 E5 - A5 G5 E5 F5 - E5 D5 - C5 D5 E5 A4 - C5 E5 - A5 B5 C6 B5 - G5 E5 - D5 E5 -".split(" "),
    bass:"A2 A3 A2 A3 A2 A3 A2 A3 F2 F3 F2 F3 G2 G3 G2 G3".split(" ")},
  boss:{tempo:165, lead:"sawtooth", leadVol:0.06, drum:true,
    melody:"E5 E5 - D5 E5 - G5 - F#5 - E5 - D5 - B4 - C5 C5 - B4 C5 - E5 - D#5 - B4 - A4 - B4 -".split(" "),
    bass:"E2 E2 E3 E2 E2 E2 E3 E2 C2 C2 C3 C2 B1 B1 B2 B1".split(" ")}
};
const bgm = {timer:null, track:null, step:0, next:0};
function desiredTrack(){
  if(currentScreen === "battle") return battle && battle.isBoss ? "boss" : "battle";
  if(currentScreen === "victory" || currentScreen === "defeat") return null; // 勝利 / 失敗時安靜，讓結算音樂清楚
  return "menu";
}
function bgmStop(){
  if(bgm.timer) clearInterval(bgm.timer);
  bgm.timer = null; bgm.track = null;
}
function bgmRefresh(){
  const t = (SOUND.bgm && audioUnlocked && AC) ? desiredTrack() : null;
  if(!t){ bgmStop(); return; }
  if(bgm.track === t && bgm.timer) return;
  bgmStop();
  bgm.track = t; bgm.step = 0; bgm.next = AC.currentTime + 0.08;
  bgm.timer = setInterval(bgmTick, 40);
}
function bgmTick(){
  if(!AC || !bgm.track) return;
  const T = BGM_TRACKS[bgm.track];
  const step = 60 / T.tempo / 2;
  if(bgm.next < AC.currentTime - 0.05) bgm.next = AC.currentTime + 0.05; // 分頁切回來時避免一次播一大串
  while(bgm.next < AC.currentTime + 0.15){
    const m = T.melody[bgm.step % T.melody.length];
    const b = T.bass[bgm.step % T.bass.length];
    if(m && m !== "-") tone({f:noteFreq(m), type:T.lead, dur:step * 0.85, vol:T.leadVol, at:bgm.next, bus:bgmBus});
    if(b && b !== "-") tone({f:noteFreq(b), type:"triangle", dur:step * 0.95, vol:0.16, at:bgm.next, bus:bgmBus});
    if(T.drum){
      if(bgm.step % 2 === 1) noise({filter:"highpass", freq:6000, dur:0.03, vol:0.05, at:bgm.next, bus:bgmBus});
      if(bgm.step % 4 === 0) tone({f:120, f2:40, type:"sine", dur:0.12, vol:0.22, at:bgm.next, bus:bgmBus});
    }
    bgm.step++; bgm.next += step;
  }
}

    case "iceSpike": sfx("ice"); break;
    case "lightning": sfx("lightning"); break;
    case "shield": sfx("shield"); break;

};

const baseLearnSkill = learnSkill;
learnSkill = function(id){
  const s = findSkill(id);
  sfx(s && skillStatus(s).st === "available" ? "learn" : "error");
  return baseLearnSkill(id);
};
const baseLearnTalent = learnTalent;
learnTalent = function(id){
  const t = TALENTS.find(x => x.id === id);
  sfx(t && talentStatus(t).st === "available" ? "learn" : "error");
  return baseLearnTalent(id);
};
const baseDoJob = doJob;
doJob = function(name){
  if(canAdvance()) sfx("job");
  return baseDoJob(name);
};
const baseRestAtInn = restAtInn;
restAtInn = function(){ sfx("heal"); return baseRestAtInn(); };
const baseDoSaveSlot = doSaveSlot;
doSaveSlot = function(n){ sfx("save"); return baseDoSaveSlot(n); };

/* ==========================================================================
   ★ 音效設定畫面（右下角 🔊 按鈕）
   ========================================================================== */
function updateSoundBtn(){
  const b = $("sound-btn");
  if(b) b.textContent = (SOUND.sfx || SOUND.bgm) ? "🔊" : "🔇";
}
function soundSettingsHTML(){
  return `
    <div class="sound-row"><button class="pbtn ${SOUND.sfx ? "green" : "gray"}" onclick="toggleSound('sfx')">${SOUND.sfx ? "🔊 SFX ON 音效開" : "🔇 SFX OFF 音效關"}</button></div>
    <div class="sound-row"><span>SFX 音效音量</span><input type="range" min="0" max="100" value="${Math.round(SOUND.sfxVol * 100)}" oninput="setSoundVol('sfxVol', this.value)" onchange="sfx('coin')"></div>
    <div class="sound-row"><button class="pbtn ${SOUND.bgm ? "green" : "gray"}" onclick="toggleSound('bgm')">${SOUND.bgm ? "🎵 Music ON 音樂開" : "🎵 Music OFF 音樂關"}</button></div>
    <div class="sound-row"><span>Music 音樂音量</span><input type="range" min="0" max="100" value="${Math.round(SOUND.bgmVol * 100)}" oninput="setSoundVol('bgmVol', this.value)"></div>
    <div class="sound-row">
      <button class="pbtn purple small" onclick="sfx('levelUp')">▶ Test 試聽</button>
      <button class="pbtn gold small" onclick="sfx('drop','Legendary')">▶ Legendary</button>
      <button class="pbtn red small" onclick="sfx('explosion')">▶ Boom</button>
    </div>
    ${(window.AudioContext || window.webkitAudioContext) ? "" : `<p class="warn">⚠ 這個瀏覽器不支援 Web Audio，無法播放聲音（遊戲仍可正常遊玩）。</p>`}
    <p class="item-sub">上課時可以只開音效、關掉音樂。iPhone / iPad 如果沒有聲音，請檢查靜音開關。</p>`;
}
function openSoundSettings(){
  unlockAudio();
  showModal("🔊 Sound 音效設定", soundSettingsHTML(), [{text:"OK", cls:"green"}]);
}
function toggleSound(k){
  SOUND[k] = !SOUND[k];
  saveSound(); applyVolumes(); bgmRefresh(); updateSoundBtn();
  if(!$("modal").classList.contains("hidden")) $("modal-body").innerHTML = soundSettingsHTML();
}
function setSoundVol(k, v){
  SOUND[k] = clamp(Number(v) / 100, 0, 1);
  applyVolumes(); saveSound();
}
(function createSoundButton(){
  const b = document.createElement("button");
  b.id = "sound-btn";
  b.className = "pbtn cyan";
  b.title = "Sound 音效設定";
  b.onclick = openSoundSettings;
  document.body.appendChild(b);
  updateSoundBtn();
})();

/* ==========================================================================
   初始化 Init
   ========================================================================== */
loadGame();
renderStart();
showScreen("start");
window.addEventListener("resize", debounce(() => { if(battle && $("b-player")) renderFighters(); }, 250));
$("modal").addEventListener("click", e => { if(e.target.id === "modal") closeModal(); });
</script>
</body>
</html>
