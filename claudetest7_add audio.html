function addLog(msg, cls){
  if(!battle) return;
  battle.log.unshift({msg, cls:cls||""});
  if(battle.log.length > 40) battle.log.pop();
  const el = $("b-log");
  if(el) el.innerHTML = `<h3>Battle Log</h3>` + battle.log.slice(0, 10).map(l => `<div class="l-${l.cls}">▸ ${l.msg}</div>`).join("");
}

/* 每一回合（新題目）開始時：處理 Buff 與中毒 */
async function tickTurn(){
  const b = battle;
  if(b.regen && b.regen.turns > 0){
    const h = Math.min(Math.round(totalMaxHp() * b.regen.pct), totalMaxHp() - player.hp);
    b.regen.turns--;
    if(h > 0){ player.hp += h; showNumber("player", "+" + h, "heal"); addLog(`♥ Regen: recovered ${h} HP.`, "good"); }
    if(b.regen.turns <= 0) b.regen = null;
    updateBattleStatus();
  }
  if(b.buffs.atkTurns > 0){ b.buffs.atkTurns--; if(b.buffs.atkTurns === 0) addLog("Attack buff wore off.", "info"); }
  if(b.monWeakTurns > 0) b.monWeakTurns--;
  if(b.poison && b.poison.turns > 0){
    const d = b.poison.dmg;
    b.monster.hp = Math.max(0, b.monster.hp - d);
    b.poison.turns--;
    showNumber("monster", d, "poison");
    addLog(`${esc(b.monster.name)} takes ${d} ${esc((b.poison.name || "Poison").toLowerCase())} damage.`, "good");
    if(b.poison.turns <= 0) b.poison = null;
    updateBattleStatus();
    if(b.monster.hp <= 0){ await killMonster(); return true; }
  }
  return false;
}

async function nextQuestion(){
  if(!battle || battle.busy || battle.phase === "over") return;
  if(!battle.firstQ){
    battle.busy = true;
    const ended = await tickTurn();
    if(battle) battle.busy = false;
    if(ended || !battle) return;
  }
  battle.firstQ = false;
  battle.showSkills = false;
  const q = drawQuestion(battle.area);
  battle.question = q;
  battle.phase = "question";
  const n = q.choices.length;
  battle.order = shuffle(Array.from({length:n}, (_,i) => i));
  battle.hidden = [];
  if(battle.hintNext){
    const wrong = shuffle(battle.order.filter(i => i !== q.answerIndex));
    battle.hidden = wrong.slice(0, Math.min(2, wrong.length));
    battle.hintNext = false;
    addLog("🔍 Analyze: two wrong choices removed!", "info");
  }
  // 裝備特效：Wise Mind 機率自動刪去 2 個錯誤選項
  if(!battle.hidden.length && Math.random() * 100 < gearEffect("wiseMind")){
  battle.hidden = shuffle(battle.order.filter(i => i !== q.answerIndex)).slice(0, 2);
  addLog("🧠 Wise Mind: two wrong choices removed!", "info");
}
  renderQuestion();
  renderActions();
  updateBattleStatus();
  revealRange($("q-meta"), $("q-feedback"));
}
function renderQuestion(){
  const q = battle.question;
  const weak = q.type === battle.monster.weakness;
  $("q-meta").innerHTML = `<span class="tag">${esc(q.type.toUpperCase())}</span><span class="tag diff-${esc(q.difficulty)}">${esc(q.difficulty)}</span>${weak?'<span class="tag weak">WEAKNESS TYPE! +50% DMG</span>':""}`;
  $("q-text").textContent = q.question;
  $("q-choices").innerHTML = battle.order.map((oi, di) => {
    const hid = battle.hidden.indexOf(oi) !== -1;
    return `<button class="pbtn choice ${hid?"eliminated":""}" ${hid?"disabled":""} onclick="answerQuestion(${di})"><span class="letter">${"ABCD"[di]||"?"}</span><span>${esc(q.choices[oi])}</span></button>`;
  }).join("");
  $("q-feedback").className = "feedback";
  $("q-feedback").innerHTML = wisdomButtonHTML();
}

async function answerQuestion(di){
  if(!battle || battle.phase !== "question" || battle.busy) return;
  const q = battle.question;
  const orig = battle.order[di];
  const correct = orig === q.answerIndex;
  battle.phase = "answered";
  player.stats.answered++;
  document.querySelectorAll("#q-choices .choice").forEach((b, i) => {
    b.disabled = true;
    const oi = battle.order[i];
    if(oi === q.answerIndex) b.classList.add("correct");
    else if(i === di) b.classList.add("wrong");
  });
  const fb = $("q-feedback");
  if(correct){
    player.ap = Math.min(MAX_AP, player.ap + 1); player.combo++;
    if(Math.random() * 100 < gearEffect("manaFlow")){ player.ap = Math.min(MAX_AP, player.ap + 1); addLog("✨ Mana Flow: +1 extra AP!", "skill"); }
    player.maxCombo = Math.max(player.maxCombo, player.combo);
    player.stats.correct++;
    battle.lastType = q.type;
    updateQuests("answerType", q.type);
    updateQuests("combo");
    updateQuests("correct");
    updateQuests("answerDiff", q.difficulty);
    let extra = "";
    if(q.type === battle.monster.weakness) extra += " · WEAKNESS! +50% damage";
    if(player.className === "Mage" && q.type === "grammar") extra += " · Mage: Skill +20%";
    if(player.className === "Scholar" && (q.type === "reading" || q.type === "sentence")) extra += " · Scholar: +10%";
    if(player.className === "Archer" && player.combo >= 3) extra += " · Archer Combo +15%";
    fb.className = "feedback ok";
    fb.innerHTML = `✔ Correct! AP +1 · Combo x${player.combo}${extra}`;
    showNumber("player", "CORRECT!", "heal");
    addLog(`Correct! AP ${player.ap}, Combo x${player.combo}`, "good");
    battle.phase = "action";
    renderActions();
    updateBattleStatus();
    revealRange($("q-feedback"), $("action-panel"));
  } else {
    if(player.combo > 0 && Math.random() * 100 < gearEffect("comboKeeper")) addLog(`🔗 Combo Keeper: Combo x${player.combo} kept! 連擊保留`, "skill");
    else player.combo = 0;
    fb.className = "feedback bad";
    fb.innerHTML = `✘ Wrong! The correct answer is: <b>${esc(q.choices[q.answerIndex])}</b><div class="explain">💡 ${esc(q.explanation||"")}</div>`;
    addLog(`Wrong answer! Combo reset. Answer: ${esc(q.choices[q.answerIndex])}`, "bad");
    battle.busy = true;
    renderActions();
    updateBattleStatus();
    await sleep(900);
    if(!battle) return;
    const dead = await monsterTurn();
    if(dead || !battle) return;
    battle.busy = false;
    battle.phase = "afterWrong";
    renderActions();
    revealRange($("q-feedback"), $("action-panel"));
  }
  saveGame();
}

function renderActions(){
  const el = $("action-panel");
  if(!el || !battle) return;
  const ph = battle.phase, ap = player.ap;
  if(battle.showSkills && ph === "action"){
    const skills = player.learnedSkills.map(findSkill).filter(Boolean).sort((a, b) => a.ap - b.ap);
    el.innerHTML = `<div class="action-title">✦ Skills — AP: ${ap}/${MAX_AP}</div>
      <div class="skill-list">${skills.map(s => `<button class="pbtn purple skill-btn" ${ap < skillApCost(s) || battle.busy ? "disabled" : ""}onclick="useSkill('${s.id}')"><span>${esc(s.name)} · ${skillApCost(s)} AP${skillApCost(s) < s.ap ? " ⬇" : ""}</span><span class="desc">${esc(s.desc)}</span></button>`).join("")}</div>
      <button class="pbtn gray" onclick="toggleSkills(false)">◀ Back</button>`;
    return;
  }
  if(battle.showItems && ph === "action"){
    el.innerHTML = `<div class="action-title">✚ Items — AP: ${ap}/${MAX_AP} · HP ${player.hp}/${totalMaxHp()}</div>
      <div class="skill-list">${POTION_TYPES.map(P => { const n = potionCount(P.id);
        return `<button class="pbtn green skill-btn potion-btn" style="border-left-color:${P.color}" ${n <= 0 || ap < 1 || battle.busy || P.hint ? "disabled" : ""}onclick="usePotion('${P.id}')"><span>${esc(P.name)} x${n} · 1 AP</span><span class="desc">${potionEffectText(P)}</span></button>`; }).join("")}</div>
      <button class="pbtn gray" onclick="toggleItems(false)">◀ Back</button>`;
    return;
  }
  const can = ph === "action" && !battle.busy;
  const next = ph === "afterWrong" && !battle.busy;
  const title = ph === "question" ? "Your turn: answer the question! 答對才能行動"
    : ph === "action" ? `Choose ONE action (AP ${ap}/${MAX_AP}) — then the monster attacks. 選一個行動後換怪物回合`
    : ph === "monster" ? "Monster's turn... 怪物回合"
    : ph === "afterWrong" ? "Wrong answer — you lost your action! Read the explanation, then continue."
    : "...";
  el.innerHTML = `<div class="action-title">${title}</div>
    <div class="action-grid">
      <button class="pbtn red act" ${can && ap >= 1 ? "" : "disabled"} onclick="doAttack()">⚔ Attack (1 AP)</button>
      <button class="pbtn purple act" ${can ? "" : "disabled"} onclick="toggleSkills(true)">✦ Skill</button>
      <button class="pbtn act" ${can && !battle.defend ? "" : "disabled"} onclick="doDefend()">🛡 Defend (0 AP)</button>
      <button class="pbtn green act" ${can && ap >= 1 && totalPotions() > 0 ? "" : "disabled"} onclick="doItem()">✚ Items x${totalPotions()}</button>
      <button class="pbtn ${next ? "gold pulse" : "cyan"} act next-btn" ${(can || next) ? "" : "disabled"} onclick="${next ? "nextQuestion()" : "doFocus()"}">${next ? "➜ Next Question" : `⏳ Focus (+${FOCUS_AP} AP)`}</button>
    </div>`;
}
function toggleSkills(show){
  if(!battle || battle.phase !== "action" || battle.busy) return;
  battle.showSkills = show;
  renderActions();
  revealRange($("action-panel"), $("action-panel"));
}

/* ---------- 行動共用檢查 ---------- */
function actionReady(cost){
  if(!battle || battle.phase !== "action" || battle.busy) return false;
  if(player.ap < cost){ toast("Not enough AP! AP 不足"); return false; }
  return true;
}
/* 玩家行動結束 → 怪物回合 → 下一題 */
async function finishAction(){
  if(!battle) return;
  battle.phase = "monster";
  battle.showSkills = false;
  renderActions(); updateBattleStatus();
  await sleep(450);
  if(!battle) return;
  const dead = await monsterTurn();
  if(dead || !battle) return;
  saveGame();
  await sleep(350);
  if(!battle) return;
  battle.busy = false;
  nextQuestion();
}

/* ==========================================================================
   傷害公式 Damage Formula
   基礎傷害 = 玩家攻擊 + 裝備攻擊
   × 技能倍率 × (1 + Combo × 5%) × 弱點 1.5 × 暴擊 2 − 怪物防禦（最少 1）
   ========================================================================== */
function calcDamage(mult, opts){
  opts = opts || {};
  const m = battle.monster, D = DIFFICULTY;
  battle.hitCount = (battle.hitCount || 0) + 1;
  let dmg = totalStat("attack") * mult * D.playerDamage;
  if(battle.buffs.atkTurns > 0) dmg *= 1 + battle.buffs.atk;
  dmg *= 1 + Math.min(player.combo, D.comboCap) * (D.comboRate + talentValue("comboBonus"));
  let weak = false;
  if(battle.lastType && battle.lastType === m.weakness){ dmg *= D.weaknessMult + gearEffect("weaknessMaster") / 100; weak = true; }
  if(opts.skill){
    dmg *= CLASSES[player.className].skillPower * (1 + talentValue("skillMastery"));
    if(player.className === "Mage" && battle.lastType === "grammar") dmg *= 1.2;
  }
  if(m.isBoss) dmg *= 1 + talentValue("bossHunter") + gearEffect("bossSlayer") / 100;
  if(player.className === "Archer" && player.combo >= 3) dmg *= 1.15;
  if(player.className === "Scholar" && (battle.lastType === "reading" || battle.lastType === "sentence")) dmg *= 1.1;
  if(opts.readingBonus && battle.lastType === "reading") dmg *= 1 + opts.readingBonus;
  if(opts.execute && m.hp <= m.maxHp * 0.3) dmg *= 1 + opts.execute;
  if(m.hp <= m.maxHp * 0.3) dmg *= 1 + gearEffect("executioner") / 100;
  const third = hasEffect("thirdCrit") && battle.hitCount % 3 === 0; // 每第 3 下必定暴擊
  const crit = third || !!opts.alwaysCrit || Math.random() * 100 < totalStat("critRate") + (opts.critBonus || 0);
  if(crit) dmg *= D.critMult + gearEffect("critDamage") / 100;
  dmg -= m.defense * (1 - clamp(opts.pierce || 0, 0, 1));
  dmg *= 0.9 + Math.random() * 0.2;
  return {dmg:Math.max(1, Math.round(dmg)), crit, weak, third};
}
function dealDamage(r, label){
  const m = battle.monster;
  m.hp = Math.max(0, m.hp - r.dmg);
  if(r.third) addLog("⚡ Triple Rhythm: 3rd hit Critical! 第 3 下必定暴擊", "skill");
  const vamp = gearEffect("vampire");
  if(vamp > 0){
    const h = Math.min(Math.round(r.dmg * vamp / 100), totalMaxHp() - player.hp);
    if(h > 0){ player.hp += h; showNumber("player", "+" + h, "heal"); }
  }
  showNumber("monster", (r.crit ? "CRIT " : "") + r.dmg, r.crit ? "crit" : "");
  const P = fxPos();
  if(P) spawnFx("fx-hit", P.mx + rand(-20,20), P.my + rand(-20,20), {}, 400);
  animEl($("b-monster"), "hurt", 500);
  if(r.crit) animEl($("stage"), "stage-shake", 450);
  if(r.crit) updateQuests("crit");
  if(r.weak) updateQuests("weakHit");
  addLog(`${label||"Attack"} deals ${r.dmg} damage${r.crit?" (CRITICAL!)":""}${r.weak?" (WEAKNESS!)":""}.`, "good");
  updateBattleStatus();
}

/* ---------- Attack ---------- */
async function doAttack(){
  if(!actionReady(1)) return;
  player.ap--; battle.busy = true; renderActions(); updateBattleStatus();
  await playAnim("attack");
  if(!battle) return;
  dealDamage(calcDamage(1), "Attack");
  // 裝備特效：Double Strike 機率連擊
  if(battle.monster.hp > 0 && Math.random() * 100 < gearEffect("doubleStrike")){
    await sleep(250);
    if(!battle) return;
    await playAnim("attack");
    if(!battle) return;
    dealDamage(calcDamage(1), "Double Strike 連擊");
  }
  await sleep(300);
  if(!battle) return;
  if(battle.monster.hp <= 0){ await killMonster(); return; }
  finishAction();
}
/* ---------- Defend（不消耗 AP，仍會結束本回合） ---------- */
async function doDefend(){
  if(!battle || battle.phase !== "action" || battle.busy) return;
  if(battle.defend){ toast("Already defending!"); return; }
  battle.busy = true; battle.defend = true; renderActions();
  await playAnim("shield");
  addLog(`🛡 Defend! Next monster attack -${Math.round(player.defendPower*100)}%. (No AP used)`, "info");
  finishAction();
}
/* ---------- Item：打開藥水選單（實際使用在 usePotion） ---------- */
function doItem(){ toggleItems(true); }
/* ---------- Skill ---------- */
async function useSkill(id){
  if(!battle || battle.phase !== "action" || battle.busy) return;
  const s = findSkill(id);
  if(!s || player.learnedSkills.indexOf(id) === -1){ toast("Skill not learned!"); return; }
  if(player.ap < skillApCost(s)){ toast("Not enough AP! AP 不足"); return; }
  const e = s.effect;
  player.ap -= skillApCost(s);
  battle.busy = true; battle.showSkills = false;
  renderActions(); updateBattleStatus();
  updateQuests("skillUse");
  addLog(`✦ ${esc(s.name)}!`, "skill");
  showNumber("player", s.name, "info");
  if(e.buffAtk){ battle.buffs.atk = e.buffAtk; battle.buffs.atkTurns = (e.turns || 3) + 1; }
  await playAnim(s.anim);
  if(!battle) return;

  let dealt = 0;
  if(e.mult){
    let mult = e.mult;
    if(e.comboScale) mult += Math.min(player.combo, 10) * e.comboScale;
    const hits = e.hits || 1;
    for(let i=0; i<hits; i++){
      const r = calcDamage(mult, {skill:true, critBonus:e.critBonus, alwaysCrit:e.alwaysCrit, readingBonus:e.readingBonus, pierce:e.pierce, execute:e.execute});
      dealDamage(r, hits > 1 ? `${s.name} hit ${i+1}` : s.name);
      dealt += r.dmg;
      if(battle.monster.hp <= 0) break;
      if(hits > 1) await sleep(200);
      if(!battle) return;
    }
  }
  const alive = battle.monster.hp > 0;
  if(e.buffAtk) addLog(`Attack +${Math.round(e.buffAtk*100)}% for ${e.turns || 3} turns!`, "skill");
  if(e.shield){ battle.shield = Math.max(battle.shield, e.shield); addLog(`Next damage taken -${Math.round(e.shield*100)}%.`, "skill"); }
  if(e.apGain){ player.ap = Math.min(MAX_AP, player.ap + e.apGain); showNumber("player", `+${e.apGain} AP`, "info"); addLog(`Recovered ${e.apGain} AP.`, "skill"); }
  if(e.weaken && alive){ battle.monWeakTurns = e.weaken; addLog(`${esc(battle.monster.name)}'s attack is lowered!`, "skill"); }
  if(e.poison && alive){
    battle.poison = {dmg:Math.max(1, Math.round(totalStat("attack") * e.poison)), turns:e.poisonTurns || 3, name:e.dotName || "Poison"};
    addLog(`${esc(battle.monster.name)} is affected by ${esc(e.dotName || "Poison")}!`, "skill");
  }
  if(e.lifesteal && dealt > 0){
    const h = Math.min(Math.round(dealt * e.lifesteal), totalMaxHp() - player.hp);
    if(h > 0){ player.hp += h; showNumber("player", "+" + h, "heal"); addLog(`Drained ${h} HP!`, "good"); }
  }
  if((e.stun || e.stunChance) && alive){
    let chance = e.stunChance || 1, turns = e.stun || 1;
    if(battle.monster.isBoss){ chance *= 0.5; turns = 1; } // Boss 暈眩抗性
    if(Math.random() < chance){ battle.stun = Math.max(battle.stun || 0, turns); playAnim("stun"); addLog(`💫 ${esc(battle.monster.name)} is Stunned!`, "skill"); }
    else addLog(`${esc(battle.monster.name)} resisted the Stun.`, "info");
  }
  if(e.hint){ battle.hintNext = true; addLog("🔍 Next question: 2 wrong choices will be removed.", "skill"); }
  if(e.heal){
    const h = Math.min(Math.round(totalMaxHp() * e.heal), totalMaxHp() - player.hp);
    player.hp += h;
    showNumber("player", "+" + h, "heal");
    addLog(`Recovered ${h} HP.`, "good");
  }
  if(e.comboUp){
    player.combo += e.comboUp;
    player.maxCombo = Math.max(player.maxCombo, player.combo);
    updateQuests("combo");
    addLog(`Combo kept and +${e.comboUp}! Combo x${player.combo}`, "skill");
  }
  updateBattleStatus();
  await sleep(300);
  if(!battle) return;
  if(battle.monster.hp <= 0){ await killMonster(); return; }
  finishAction();
}

/* ==========================================================================
   怪物回合 Monster Turn
   ========================================================================== */
async function monsterTurn(){
  const b = battle;
  if(!b) return true;
  const m = b.monster;
  await focusStage();
  if(!battle) return true;
  if(b.stun > 0){
    b.stun--;
    addLog(`💫 ${esc(m.name)} is stunned and cannot attack!`, "good");
    showNumber("monster", "STUNNED", "info");
    updateBattleStatus();
    await sleep(600);
    return false;
  }
  addLog(`${esc(m.name)}'s turn!`, "bad");
  animEl($("b-monster"), "lunge-l", 350);
  await sleep(250);
  if(!battle) return true;

  // 💨 閃避判定（Boss 比較難閃避）
  const dodgeChance = totalDodge() * (m.isBoss ? BOSS_DODGE_MULT : 1);
  if(Math.random() * 100 < dodgeChance){
    animEl($("b-player"), "dodge", 450);
    showNumber("player", "DODGE!", "info");
    addLog(`💨 You dodged ${esc(m.name)}'s attack! 閃避成功`, "good");
    const ct = gearEffect("counter");
    if(ct > 0){
      await sleep(300);
      if(!battle) return true;
      await playAnim("attack");
      if(!battle) return true;
      dealDamage(calcDamage(ct / 100), "Counter 反擊");
      if(battle.monster.hp <= 0){ await sleep(300); await killMonster(); return true; }
    }
    updateBattleStatus();
    await sleep(400);
    return false;
  }

  let atk = m.attack * (b.monWeakTurns > 0 ? 0.75 : 1) * (0.9 + Math.random()*0.2);
  let power = false;
  if(m.isBoss && Math.random() < 0.25){ atk *= 1.4; power = true; }
  let dmg = atk - totalStat("defense");
  if(player.className === "Warrior") dmg *= 0.9;
  if(b.defend){ dmg *= 1 - player.defendPower; b.defend = false; addLog("🛡 Defend reduced the damage!", "info"); }
  if(b.shield > 0){ dmg *= 1 - b.shield; b.shield = 0; addLog("Shield absorbed some damage!", "info"); }
  dmg = Math.max(1, Math.round(dmg));
  // 裝備特效：Guardian Angel 每場戰鬥一次，致命傷害時保留 1 HP
  if(dmg >= player.hp && hasEffect("guardian") && !b.angelUsed){
    b.angelUsed = true;
    dmg = Math.max(0, player.hp - 1);
    showNumber("player", "GUARDIAN!", "info");
    addLog("👼 Guardian Angel! You survived with 1 HP! 守護天使發動", "skill");
  }
  player.hp = Math.max(0, player.hp - dmg);
  b.tookDamage = true;
  const P = fxPos();
  if(P) spawnFx("fx-hit", P.px + rand(-15,15), P.py + rand(-15,15), {}, 400);
  animEl($("b-player"), "hurt", 500);
  if(power){ animEl($("stage"), "stage-shake", 450); addLog(`💥 POWER ATTACK!`, "bad"); }
  showNumber("player", "-" + dmg, "player");
  addLog(`${esc(m.name)} deals ${dmg} damage to you.`, "bad");
  updateBattleStatus();
  if(player.hp <= 0){
    await sleep(700);
    if(battle) defeat();
    return true;
  }
  // 裝備特效：Thorns 反彈傷害
  const th = gearEffect("thorns");
  if(th > 0 && dmg > 0){
    const t = Math.max(1, Math.round(dmg * th / 100));
    m.hp = Math.max(0, m.hp - t);
    showNumber("monster", t, "poison");
    addLog(`🌵 Thorns reflect ${t} damage! 荊棘反彈`, "good");
    updateBattleStatus();
    if(m.hp <= 0){ await sleep(400); await killMonster(); return true; }
  }
  await sleep(300);
  return false;
}

/* ==========================================================================
   勝利 / 失敗 Victory & Defeat
   ========================================================================== */
async function killMonster(){
  const b = battle;
  if(!b || b.phase === "over") return;
  b.phase = "over"; b.busy = true;
  const m = b.monster;
  renderActions();
  const mEl = $("b-monster");
  if(mEl) mEl.classList.add("dying");
  addLog(`★ ${esc(m.name)} is defeated!`, "good");
  await sleep(850);

  const exp = Math.round(m.exp * (1 + totalStat("expBonus")/100));
  const gold = Math.round(m.gold * (1 + totalStat("goldBonus")/100));
  player.gold += gold;
  updateQuests("gold", null, gold);
  player.stats.kills++;
  const prog = player.areaProgress[b.area.id];
  prog.totalKills++;
  if(b.isBoss){
    prog.kills = 0; prog.bossKills++; player.stats.bosses++;
    updateQuests("bossKill", m.name);
  } else prog.kills++;
  updateQuests("kill", m.name);
  updateQuests("areaKill", b.area.id);
  player.winStreak = (player.winStreak || 0) + 1;
  updateQuests("winStreak");
  if(!b.tookDamage) updateQuests("flawless");

  // 先給經驗（升級後再產生裝備）
  const ups = gainExp(exp);

  // 裝備掉落（Boss：3 選 1，至少 Rare）
  let item = null, bossChoices = null;
  if(b.isBoss){
    bossChoices = generateBossChoices(b.area.tier);
    player.pendingLoot = bossChoices;
  } else {
    const chance = NORMAL_DROP_RATE + totalStat("dropRateBonus");
    if(Math.random()*100 < chance) item = generateEquipment(rollRarity(false), b.area.tier);
  }
  if(item) addToInventory(item);
  // 裝備特效：擊殺回血
  let healed = 0;
  const hk = gearEffect("healOnKill");
  if(hk > 0){ healed = Math.max(0, Math.min(Math.round(totalMaxHp() * hk / 100), totalMaxHp() - player.hp)); player.hp += healed; }

  // 藥水掉落
  let potionDrop = 0;
  if(b.isBoss) potionDrop = 1;
  else if(Math.random() < 0.15) potionDrop = 1;
  player.potions += potionDrop;
  let wisdomDrop = 0;
  if(Math.random() < (b.isBoss ? 0.5 : WISDOM_DROP_RATE)){ wisdomDrop = 1; addPotion("wisdomPotion", 1); }

  const questIds = Array.from(b.questChanges);
  const result = {
    name:m.name, isBoss:b.isBoss, exp, gold, ups, item, potionDrop, wisdomDrop, bossChoices, healed,
    areaId:b.area.id, questIds,
    bossNext: prog.kills >= b.area.requiredKillsForBoss
  };
  battle = null;
  saveGame();
  renderVictory(result);
  showScreen("victory");
}let lastVictory = null;

  }).join("");
  $("screen-victory").innerHTML = `

      ${r.healed?`<p class="good">✦ Heal on Kill: +${r.healed} HP</p>`:""}
      ${r.ups?`<p class="levelup">★ LEVEL UP! Lv ${player.level} ★</p><p>+ Skill Points · + Talent Points</p>`:""}
      ${barHTML(player.hp, totalMaxHp(), "hp", "HP")}

      <p>🔥 Combo x${player.combo} · Boss ${Math.min(prog.kills, area.requiredKillsForBoss)}/${area.requiredKillsForBoss}</p>

/* ==========================================================================
   動畫層 Animation Layer（動畫結束後自動移除 DOM）
   ========================================================================== */
function animEl(el, cls, ms){
  if(!el) return;
  el.classList.remove(cls);
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(() => { if(el) el.classList.remove(cls); }, ms || 500);
}
function fxPos(){
  const stage = $("stage"), pe = $("b-player"), me = $("b-monster");
  if(!stage || !pe || !me) return null;
  const st = stage.getBoundingClientRect(), p = pe.getBoundingClientRect(), m = me.getBoundingClientRect();
  return {
    w:st.width, h:st.height,
    px:p.left - st.left + p.width/2, py:p.top - st.top + p.height/2, pTop:p.top - st.top, pBottom:p.bottom - st.top,
    mx:m.left - st.left + m.width/2, my:m.top - st.top + m.height/2, mTop:m.top - st.top, mBottom:m.bottom - st.top
  };
}
function spawnFx(cls, x, y, styles, ms, html){
  const layer = $("anim-layer");
  if(!layer) return null;
  const d = document.createElement("div");
  d.className = "fx " + cls;
  d.style.left = x + "px";
  d.style.top = y + "px";
  if(styles) for(const k in styles) d.style.setProperty(k, styles[k]);
  if(html) d.innerHTML = html;
  layer.appendChild(d);
  let removed = false;
  const rm = () => { if(!removed){ removed = true; d.remove(); } };
  d.addEventListener("animationend", e => { if(e.target === d) rm(); });
  setTimeout(rm, ms || 1200); // 保險：時間到一定移除
  return d;
}
function showNumber(target, val, cls){
  const P = fxPos();
  if(!P) return;
  const x = target === "monster" ? P.mx : P.px;
  const y = (target === "monster" ? P.mTop : P.pTop) + 10;
  spawnFx("dmg-num " + (cls || ""), x + rand(-15,15), y, {}, 1100, esc(String(val)));
}

/* 依技能 anim 欄位播放動畫 */
async function playAnim(name){
  await focusStage();
  const P = fxPos();
  if(!P){ await sleep(200); return; }
  const dx = P.mx - P.px, dy = P.my - P.py;
  const ang = Math.atan2(dy, dx) * 180 / Math.PI;
  const dist = Math.hypot(dx, dy);
  const pl = $("b-player");
  const proj = (cls, html, t, offY, rot) => {
    offY = offY || 0;
    return spawnFx(cls + " fx-proj", P.px, P.py + offY,
      {"--dx":dx + "px","--dy":(dy - offY) + "px","--t":t + "ms","--rot":(rot === undefined ? ang : rot) + "deg"}, t + 120, html);
  };
  const swing = () => { animEl(pl, "lunge-r", 350); const w = pl && pl.querySelector(".hero-weapon"); if(w) animEl(w, "swing", 350); };
  const shake = () => animEl($("stage"), "stage-shake", 450);

function sellCommons(){
  let total = 0, n = 0;

}

/* ==========================================================================
   Skill Tree Screen
   ========================================================================== */
function openSkills(){ renderSkills(); showScreen("skills"); }
function skillTreeOwner(id){
  for(const cn in SKILL_TREES) if(SKILL_TREES[cn].some(s => s.id === id)) return cn;
  for(const j in JOB_SKILLS) if(JOB_SKILLS[j].some(s => s.id === id)) return j;
  return null;
}
function skillStatus(s){
  if(player.learnedSkills.indexOf(s.id) !== -1) return {st:"learned", text:"✔ Learned 已學"};
  const owner = skillTreeOwner(s.id);
  if(owner !== player.className && (player.jobPath || []).indexOf(owner) === -1) return {st:"locked", text:`🔒 ${owner} only 需要轉職`};
  if(player.level < s.levelReq) return {st:"locked", text:`🔒 Need Lv ${s.levelReq}`};
  const miss = s.requires.filter(r => player.learnedSkills.indexOf(r) === -1);
  if(miss.length) return {st:"locked", text:`🔒 Need: ${miss.map(id => { const k = findSkill(id); return k ? k.name : id; }).join(", ")}`};
  if(player.skillPoints < s.cost) return {st:"locked", text:`Need ${s.cost} SP (you have ${player.skillPoints})`};
  return {st:"available", text:"★ Can Learn 可學習"};
}
function skillCardHTML(s){
  const st = skillStatus(s);
  const req = s.requires.length ? s.requires.map(id => { const k = findSkill(id); return k ? k.name : id; }).join(", ") : "None";
  return `<div class="card tree-card ${st.st}">
    <h3>${esc(s.name)}</h3>
    <p><span class="chip ap">${s.ap} AP</span><span class="chip combo">Cost ${s.cost} SP</span><span class="chip">Lv ${s.levelReq}+</span></p>
    <p>${esc(s.desc)}</p>
    <p>Requires: ${esc(req)}</p>
    <p class="status-line ${st.st === "learned" ? "good" : st.st === "available" ? "gold-text" : "warn"}">${st.text}</p>
    <div class="btn-row left"><button class="pbtn ${st.st === "available" ? "green pulse" : "gray"}" ${st.st === "available" ? "" : "disabled"} onclick="learnSkill('${s.id}')">${st.st === "learned" ? "Learned" : "Learn"}</button></div>
  </div>`;
}
function renderSkills(){
  const sections = [{title:`${player.className} Skills 基本技能`, list:SKILL_TREES[player.className]}];
  (player.jobPath || []).forEach((j, i) => {
    if(JOB_SKILLS[j]) sections.push({title:`${i === 0 ? "♛ 1st Job 一轉" : "♛♛ 2nd Job 二轉"}: ${j} Skills`, list:JOB_SKILLS[j]});
  });
  let preview = "";
  const t = jobTier();
  if(t < 2){
    const opts = jobOptions();
    preview = `<div class="panel"><h3>🔒 Future Skills 未解鎖技能</h3>
      <p>${t === 0 ? `Lv ${JOB_LEVEL_1} 轉職` : `Lv ${JOB_LEVEL_2} 2 轉`}後解鎖：${opts.map(j => `<b>${esc(j.name)}</b>（${(JOB_SKILLS[j.name] || []).length} 招新技能）`).join(" / ")}</p></div>`;
  }
  $("screen-skills").innerHTML = `${backBtn()}
    <h2 class="screen-title">Skill Tree 技能樹 — ${esc(player.jobName)}</h2>
    <div class="panel"><span class="chip ap">Skill Points: ${player.skillPoints}</span>
      <p>越強的技能需要越多 SP！每級 +${SP_PER_LEVEL} SP，Lv ${JOB_LEVEL_1}+ 每級 +${SP_PER_LEVEL + 1}，Lv ${JOB_LEVEL_2}+ 每級 +${SP_PER_LEVEL + 2}。</p></div>
    ${sections.map(sec => `<div class="panel"><h3>${esc(sec.title)}</h3></div><div class="card-grid">${sec.list.map(skillCardHTML).join("")}</div>`).join("")}
    ${preview}`;
}
function learnSkill(id){
  const s = findSkill(id);
  if(!s) return;
  if(skillStatus(s).st !== "available"){ toast("Cannot learn this skill yet."); return; }
  player.skillPoints -= s.cost;
  player.learnedSkills.push(id);
  saveGame();
  toast(`✦ Learned ${s.name}!`);
  renderSkills();
}

/* ==========================================================================
   Talent Tree Screen
   ========================================================================== */
function openTalents(){ renderTalents(); showScreen("talents"); }
function talentRank(id){ return (player.learnedTalents && player.learnedTalents[id]) || 0; }
function talentNextLevelReq(t){ return t.levelReq + talentRank(t.id) * (t.levelStep || 0); }
function talentEffectText(eff, r){
  const label = {maxHp:"Max HP",attack:"ATK",defense:"DEF",critRate:"Crit",expBonus:"EXP",goldBonus:"Gold",dropRateBonus:"Drop",
    apStart:"Start AP",comboBonus:"Combo DMG / stack",defendPower:"Defend",potionBonus:"Potion Heal",skillMastery:"Skill DMG",bossHunter:"Boss DMG"};
  const ratio = ["comboBonus","defendPower","potionBonus","skillMastery","bossHunter"];
  return Object.keys(eff).map(k => {
    const v = eff[k] * r;
    if(ratio.indexOf(k) !== -1) return `+${Math.round(v*100)}% ${label[k]||k}`;
    if(PERCENT_STATS.indexOf(k) !== -1) return `+${v}% ${label[k]||k}`;
    return `+${v} ${label[k]||k}`;
  }).join(", ");
}
function talentStatus(t){
  const r = talentRank(t.id);
  if(r >= t.maxLevel) return {st:"learned", text:"✔ MAX Rank 已滿級"};
  const need = talentNextLevelReq(t);
  if(player.level < need) return {st:"locked", text:`🔒 Next rank needs Lv ${need}`};
  if(player.talentPoints < t.cost) return {st:"locked", text:"Not enough Talent Points"};
  return {st:"available", text:"★ Can Upgrade 可提升"};
}
function renderTalents(){
  const cards = TALENTS.map(t => {
    const st = talentStatus(t), r = talentRank(t.id);
    return `<div class="card tree-card ${st.st === "available" ? "available" : (r > 0 ? "learned" : "locked")}">
      <h3>${esc(t.name)} <span class="lv">Rank ${r}/${t.maxLevel}</span></h3>
      ${barHTML(r, t.maxLevel, "exp", "Rank")}
      <p>${esc(t.desc)}</p>
      <p><span class="chip">Cost ${t.cost} TP</span><span class="chip">Next: Lv ${r >= t.maxLevel ? "-" : talentNextLevelReq(t)}+</span></p>
      <p class="good">Current: ${r > 0 ? talentEffectText(t.perLevel, r) : "None"}</p>
      <p class="status-line ${st.st === "learned" ? "good" : st.st === "available" ? "gold-text" : "warn"}">${st.text}</p>
      <div class="btn-row left"><button class="pbtn ${st.st === "available" ? "green pulse" : "gray"}" ${st.st === "available" ? "" : "disabled"} onclick="learnTalent('${t.id}')">${r >= t.maxLevel ? "MAX" : "Upgrade +1"}</button></div>
    </div>`;
  }).join("");
  $("screen-talents").innerHTML = `${backBtn()}
    <h2 class="screen-title">Talent Tree 天賦樹</h2>
    <div class="panel"><span class="chip combo">Talent Points: ${player.talentPoints}</span> <span>每個天賦都可以重複升級！Upgrade talents again and again.</span></div>
    <div class="card-grid">${cards}</div>`;
}
function learnTalent(id){
  const t = TALENTS.find(x => x.id === id);
  if(!t) return;
  if(talentStatus(t).st !== "available"){ toast("Cannot upgrade this talent yet."); return; }
  const before = totalMaxHp();
  player.talentPoints -= t.cost;
  player.learnedTalents[id] = talentRank(id) + 1;
  recalcStats();
  player.hp += Math.max(0, totalMaxHp() - before);
  saveGame();
  toast(`❖ ${t.name} → Rank ${player.learnedTalents[id]}!`);
  renderTalents();
}

/* ==========================================================================

   ========================================================================== */
function openQuests(){ renderQuests(); showScreen("quests"); }
function renderQuests(){
  ensureBounties();
  syncStateQuests();
  const rank = q => q.completed && !q.claimed ? 0 : (!q.completed ? 1 : 2);
  const card = q => {
    const cls = q.claimed ? "claimed" : (q.completed ? "done" : "");
    let btn;
    if(q.claimed) btn = `<button class="pbtn gray" disabled>✔ Claimed</button>`;
    else if(q.completed) btn = `<button class="pbtn gold pulse" onclick="claimQuest('${q.id}')">★ Claim</button>`;
    else btn = `<button class="pbtn gray" disabled>In Progress</button>` +
      (q.bounty ? `<button class="pbtn red small" ${player.gold < BOUNTY_REROLL_COST ? "disabled" : ""} onclick="rerollBounty('${q.id}')">↻ Change (${BOUNTY_REROLL_COST}G)</button>` : "");
    return `<div class="card quest-card ${cls}">
      <h3>${q.bounty ? "📜 " : "★ "}${esc(q.name)}</h3>
      <p>${esc(q.description)}</p>
      ${barHTML(q.progress, q.required, "q", "")}
      <p>Reward: ${rewardsText(q.rewards)}</p>
      <div class="btn-row left">${btn}</div></div>`;
  };
  const bounties = player.quests.filter(q => q.bounty).sort((a,b) => rank(a) - rank(b));
  const chains = Object.keys(QUEST_CHAINS).map(ch => {
    const list = QUESTS.filter(t => t.chain === ch).map(t => player.quests.find(x => x.id === t.id)).filter(Boolean);
    const done = list.filter(q => q.claimed).length;
    const cur = list.find(q => !q.claimed);
    const next = cur ? list[list.indexOf(cur) + 1] : null;
    return `<div class="card">
      <h3>${QUEST_CHAINS[ch]} <span class="lv">${done}/${list.length}</span></h3>
      ${barHTML(done, list.length, "exp", "Chain")}
      ${cur ? card(cur) : `<p class="good">✔ All complete! 全部完成！</p>`}
      ${next ? `<p class="item-sub">Next 下一個：🔒 ${esc(next.name)}</p>` : ""}
    </div>`;
  }).join("");
  $("screen-quests").innerHTML = `${backBtn()}<h2 class="screen-title">Quests 任務</h2>
    <div class="panel"><h3>★ Main Quests 主線任務鏈</h3><p>三條任務鏈，每條一次只有一個任務；領取獎勵後才會開啟下一個。</p></div>
    <div class="card-grid">${chains}</div>
    <div class="panel"><h3>📜 Bounty Board 懸賞任務</h3><p>領取後會出現新的懸賞任務！不喜歡可以花 Gold 更換。</p></div>
    <div class="card-grid">${bounties.map(card).join("")}</div>`;
}

/* 基本 CSV parser：支援逗號分隔與雙引號欄位 */
function parseCSV(text){
  text = String(text || "").replace(/^\uFEFF/, "");
  const rows = []; let row = [], field = "", inQ = false;
  for(let i=0; i<text.length; i++){
    const ch = text[i];
    if(inQ){
      if(ch === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else inQ = false;
      } else field += ch;
    } else {
      if(ch === '"') inQ = true;
      else if(ch === ","){ row.push(field); field = ""; }
      else if(ch === "\n"){ row.push(field); rows.push(row); row = []; field = ""; }
      else if(ch === "\r"){ /* skip */ }
      else field += ch;
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ""));
}
function doImport(){
  const text = $("csv-text").value;
  const res = $("import-result");
  const rows = parseCSV(text);
  if(rows.length && rows[0][0] && rows[0][0].trim().toLowerCase() === "type") rows.shift();
  let maxId = questionBank.reduce((m, q) => Math.max(m, Number(q.id) || 0), 0);
  const mode = (document.querySelector('input[name="importMode"]:checked') || {}).value || "add";
  if(mode === "replace") maxId = 0;
  const list = []; let skipped = 0;
  rows.forEach(r => {
    if(r.length < 8){ skipped++; return; }
    const c = r.map(x => x.trim());
    const ai = parseInt(c[7], 10);
    const choices = [c[3], c[4], c[5], c[6]];
    if(!c[2] || isNaN(ai) || ai < 0 || ai > 3 || choices.some(x => x === "")){ skipped++; return; }
    let diff = (c[1] || "normal").toLowerCase();
    if(["easy","normal","hard"].indexOf(diff) === -1) diff = "normal";
    list.push({id:++maxId, type:(c[0] || "vocabulary").toLowerCase(), difficulty:diff, question:c[2], choices, answerIndex:ai, explanation:c.slice(8).join(", ")});
  });
  if(!list.length){
    res.className = "feedback bad";
    res.innerHTML = `✘ No valid questions found. 沒有可匯入的題目（略過 ${skipped} 行）。請檢查格式。`;
    return;
  }
  if(mode === "replace") questionBank = list;
  else questionBank = questionBank.concat(list);
  customQuestions = true;
  recentQuestions = [];
  saveQuestions();
  renderImport();
  const r2 = $("import-result");
  r2.className = "feedback ok";
  r2.innerHTML = `✔ 成功匯入 ${list.length} 題！ Imported ${list.length} questions (${mode === "replace" ? "Replaced" : "Added"}).${skipped ? ` Skipped ${skipped} invalid rows.` : ""} Total: ${questionBank.length}`;
  showModal("Import Complete!", `<p class="good">成功匯入 ${list.length} 題！</p><p>Mode: ${mode === "replace" ? "Replace 取代" : "Add 加入"}</p><p>Total questions: ${questionBank.length}</p>`, [{text:"OK",cls:"green"}]);
}

const DIFFICULTY = {
  monsterHp:2.6, monsterAtk:1.25, monsterDef:1.3,   // 普通怪倍率
  bossHp:2.8, bossAtk:1.15, bossDef:1.2,            // Boss 倍率
  overLevelHp:0.07, overLevelAtk:0.04, overLevelCap:12, // 玩家等級高於推薦等級時，每級怪物變強
  expMult:1.3, goldMult:1.3,                        // 戰鬥變長，獎勵也提高
  playerDamage:1.0,                                 // 玩家整體傷害倍率（覺得太強可改 0.8）
  comboRate:0.05, comboCap:10,                      // Combo 每層 +5%，最多算 10 層
  weaknessMult:1.5, critMult:2                      // 弱點、暴擊倍率
};
function scaleMonster(m, area, isBoss){
  const D = DIFFICULTY;
  const over = clamp(player.level - area.recommendedLevel, 0, D.overLevelCap);
  m.hp = Math.round(m.hp * (isBoss ? D.bossHp : D.monsterHp) * (1 + over * D.overLevelHp));
  m.maxHp = m.hp;
  m.attack = Math.round(m.attack * (isBoss ? D.bossAtk : D.monsterAtk) * (1 + over * D.overLevelAtk));
  m.defense = Math.round(m.defense * (isBoss ? D.bossDef : D.monsterDef) + over * 0.5);
  m.exp = Math.round(m.exp * D.expMult * (1 + over * 0.06));
  m.gold = Math.round(m.gold * D.goldMult);
  m.isBoss = isBoss;
  return m;
}

}

function shopRefreshCost(){ return 20 + player.level * 10; }
function generateShopStock(){
  const tier = tierForLevel();
  const items = [];
  for(let i=0; i<SHOP_SIZE; i++){
    if(Math.random() < 0.25){
      const P = rollShopPotion(tier);
      const qty = P.price >= 300 ? 1 : pick([1,2,3,5]);
      items.push({id:uid(), type:"potion", potionType:P.id, qty, price:Math.round(P.price * qty * (qty >= 3 ? 0.85 : 1)), sold:false});
    } else {
      const rar = weightedPick(SHOP_WEIGHTS);
      const t = clamp(tier + (Math.random() < 0.2 ? 1 : 0), 1, AREAS.length);
      const item = generateEquipment(rar, t);
      items.push({id:uid(), type:"equip", item, price:Math.round(SHOP_PRICE[rar] * (1 + 0.6 * (t - 1))), sold:false});
    }
  }
  player.shop = {items, refreshes:(player.shop && player.shop.refreshes) || 0};
}
function openShop(){
  if(!player.shop || !player.shop.items || !player.shop.items.length) generateShopStock();

function buyShopItem(id){
  const s = player.shop.items.find(x => x.id === id);
  if(!s || s.sold) return;
  if(player.gold < s.price){ toast("Not enough Gold! 金幣不足"); return; }
  player.gold -= s.price; s.sold = true;
  updateQuests("spend", null, s.price);
  if(s.type === "potion"){ const P = potionInfo(s.potionType || "potion"); addPotion(P.id, s.qty); toast(`Bought ${s.qty} ${P.name}!`); }
  else { player.inventory.push(s.item); toast(`Bought ${s.item.name}! 已放入背包`); }
  saveGame(); renderShop();
}
function refreshShop(){
  const cost = shopRefreshCost();
  if(player.gold < cost){ toast("Not enough Gold to refresh!"); return; }
  player.gold -= cost;
  generateShopStock();
  player.shop.refreshes++;
  saveGame(); renderShop();
  toast("Shop refreshed! 商店已刷新");
}

const BOUNTY_SLOTS = 4;          // 同時存在的懸賞任務數量
const BOUNTY_REROLL_COST = 15;   // 更換任務花費
function unlockedAreas(){
  const list = AREAS.filter(isAreaUnlocked);
  return list.length ? list : [AREAS[0]];
}
function bountyRewards(f, extra){
  const L = player.level;
  return Object.assign({exp:Math.max(20, Math.round(expNeeded(L) * f)), gold:Math.round((30 + L * 15) * f * 2)}, extra || {});
}
function generateBounty(){
  const L = player.level;
  const area = pick(unlockedAreas());
  const kind = pick(["kill","kill","areaKill","answerType","answerType","combo","correct","skillUse","gold","collectRarity","bossKill","level"]);
  const q = {id:"b_" + uid(), bounty:true, type:kind, target:null, required:1, progress:0, completed:false, claimed:false, name:"", description:"", rewards:{}};
  if(kind === "kill"){
    const m = pick(area.monsters), n = rand(3,6) + Math.floor(L/5);
    Object.assign(q, {name:`${m.name} Hunt`, description:`Defeat ${n} ${m.name} in ${area.name}.`, target:m.name, required:n, rewards:bountyRewards(0.35)});
  } else if(kind === "areaKill"){
    const n = rand(6,10) + Math.floor(L/5);
    Object.assign(q, {name:`${area.name} Patrol`, description:`Defeat ${n} monsters in ${area.name}.`, target:area.id, required:n, rewards:bountyRewards(0.45, {potion:1})});
  } else if(kind === "answerType"){
    const t = pick(area.questionTypes), n = rand(6,12);
    Object.assign(q, {name:`${t.charAt(0).toUpperCase() + t.slice(1)} Practice`, description:`Answer ${n} ${t} questions correctly.`, target:t, required:n, rewards:bountyRewards(0.4)});
  } else if(kind === "combo"){
    const n = clamp(3 + Math.floor(L/2) + rand(0,2), 3, 20);
    Object.assign(q, {name:`Combo Challenge x${n}`, description:`Reach a ${n} Combo.`, required:n, rewards:bountyRewards(0.35)});
  } else if(kind === "correct"){
    const n = rand(12,25);
    Object.assign(q, {name:"Quiz Marathon", description:`Answer ${n} questions correctly (any type).`, required:n, rewards:bountyRewards(0.5)});
  } else if(kind === "skillUse"){
    const n = rand(5,10);
    Object.assign(q, {name:"Skill Training", description:`Use active skills ${n} times in battle.`, required:n, rewards:bountyRewards(0.35)});
  } else if(kind === "gold"){
    const n = 60 + L * 40;
    Object.assign(q, {name:"Gold Rush", description:`Earn ${n} Gold from monsters.`, required:n, rewards:bountyRewards(0.3, {potion:1})});
  } else if(kind === "collectRarity"){
    const r = L < 5 ? "Uncommon" : (L < 10 ? "Rare" : "Epic");
    const n = r === "Epic" ? 1 : rand(1,3);
    Object.assign(q, {name:`${r} Treasure Seeker`, description:`Find ${n} ${r} (or better) equipment from monsters.`, target:r, required:n, rewards:bountyRewards(0.4)});
  } else if(kind === "bossKill"){
    Object.assign(q, {name:`Bounty: ${area.boss.name}`, description:`Defeat ${area.boss.name} in ${area.name}.`, target:area.boss.name, required:1, rewards:bountyRewards(0.8, {equipment:Math.random() < 0.3 ? "Epic" : "Rare"})});
  } else {
    Object.assign(q, {type:"level", name:"Grow Stronger", description:`Reach Level ${L + 1}.`, required:L + 1, progress:L, rewards:bountyRewards(0.5, {potion:2})});
  }
  return q;
}
function ensureBounties(){
  if(!player) return;
  player.quests = player.quests.filter(q => !(q.bounty && q.claimed)); // 已領取的懸賞移除
  const active = player.quests.filter(q => q.bounty);
  let guard = 0;
  while(active.length < BOUNTY_SLOTS && guard++ < 40){
    const q = generateBounty();
    if(active.some(a => a.type === q.type && a.target === q.target)) continue; // 避免重複
    player.quests.push(q); active.push(q);
  }
}
function rerollBounty(id){
  if(player.gold < BOUNTY_REROLL_COST){ toast("Not enough Gold!"); return; }
  player.gold -= BOUNTY_REROLL_COST;
  player.quests = player.quests.filter(q => q.id !== id);
  ensureBounties();
  saveGame(); renderQuests();
  toast("New bounty posted! 已更換任務");
}

function downloadText(filename, text){
  try{
    const blob = new Blob(["\uFEFF" + text], {type:"text/csv;charset=utf-8"}); // BOM 讓 Excel 正確顯示中文
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
    toast("⬇ Downloading " + filename);
  }catch(e){
    showModal("Download blocked 無法下載", `<p>請複製下面內容，另存成 .csv 檔：</p><textarea readonly>${esc(text)}</textarea>`, [{text:"OK"}]);
  }
}
function downloadSampleCSV(){ downloadText("pixel_english_hero_sample.csv", SAMPLE_CSV); }
function csvCell(v){
  v = String(v == null ? "" : v);
  return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
}
function exportQuestionsCSV(){
  const lines = ["type,difficulty,question,choice1,choice2,choice3,choice4,answerIndex,explanation"];
  questionBank.forEach(q => {
    const c = q.choices.concat(["","","",""]).slice(0,4);
    lines.push([q.type, q.difficulty, q.question, c[0], c[1], c[2], c[3], q.answerIndex, q.explanation || ""].map(csvCell).join(","));
  });
  downloadText("pixel_english_hero_questions.csv", lines.join("\r\n"));
}

/* 舊存檔裝備數值減半（只執行一次） */
function rebalanceOldGear(){
  if(player.gearVersion >= 2) return;
  const starter = Object.values(STARTER_WEAPONS).map(w => w.name);
  const fix = it => {
    if(!it || !it.stats || starter.indexOf(it.name) !== -1) return;
    for(const k in it.stats) it.stats[k] = Math.max(1, Math.round(it.stats[k] * 0.5));
  };
  for(const s in player.equipment) fix(player.equipment[s]);
  player.inventory.forEach(fix);
  if(player.shop && player.shop.items) player.shop.items.forEach(s => { if(s.item) fix(s.item); });
  player.gearVersion = 2;
}

/* ---------- 任務設定 ---------- */
const QUEST_EXP_CAP = 0.35; // 單一任務最多給「目前升級所需 EXP」的 35%（避免連升好幾級）
const QUEST_CHAINS = {story:"📖 Story 劇情主線", study:"📚 Study 學習之路", training:"⚔ Training 修練之路"};
const STATE_QUEST_TYPES = ["level","skillCount","talentTotal","equipRarity"];
function questExpAmount(r){
  if(!r) return 0;
  const need = player.expToNext;
  const e = r.expPct ? Math.round(need * r.expPct / 100) : (r.exp || 0);
  return Math.min(e, Math.round(need * QUEST_EXP_CAP));
}
function isQuestUnlocked(q){
  if(!q.requires) return true;
  const pre = player.quests.find(x => x.id === q.requires);
  return !!(pre && pre.claimed);
}
function markQuestProgress(q){
  if(q.progress >= q.required){
    q.progress = q.required;
    if(!q.completed){ q.completed = true; toast(`✔ Quest Complete: ${q.name}! Claim it in Quests.`); }
  }
  if(battle && battle.questChanges) battle.questChanges.add(q.id);
}
function questStateValue(q){
  switch(q.type){
    case "level": return player.level;
    case "skillCount": return player.learnedSkills.length;
    case "talentTotal": return Object.values(player.learnedTalents || {}).reduce((s, v) => s + v, 0);
    case "equipRarity": return SLOTS.filter(s => { const it = player.equipment[s.id]; return it && rarityIndex(it.rarity) >= rarityIndex(q.target); }).length;
  }
  return 0;
}
/* 狀態型任務（等級、技能數、天賦、裝備）直接依目前狀態計算進度 */
function syncStateQuests(){
  if(!player) return;
  player.quests.forEach(q => {
    if(q.completed || q.claimed || STATE_QUEST_TYPES.indexOf(q.type) === -1 || !isQuestUnlocked(q)) return;
    const v = Math.min(q.required, questStateValue(q));
    if(v !== q.progress){ q.progress = v; markQuestProgress(q); }
  });
}

/* ---------- 地區解鎖：打倒上一個地區的 Boss 才能進入 ---------- */
function isAreaUnlocked(a){
  const i = AREAS.indexOf(a);
  if(i <= 0) return true;
  const p = player.areaProgress[a.id];
  if(p && p.totalKills > 0) return true; // 舊存檔已進入過的地區保持開放
  const prev = player.areaProgress[AREAS[i-1].id];
  return !!(prev && prev.bossKills > 0);
}

/* ---------- 手機自動捲動（不想要可改成 false） ---------- */
const AUTO_SCROLL = true;
/* 捲到戰鬥畫面（若已完整可見就不動），捲完再播放動畫 */
async function focusStage(){
  if(!AUTO_SCROLL || !battle) return;
  const stage = $("stage");
  if(!stage) return;
  const r = stage.getBoundingClientRect();
  if(r.top >= 0 && r.bottom <= window.innerHeight) return;
  const top = document.querySelector("#screen-battle .battle-top");
  const useTop = top && (r.bottom - top.getBoundingClientRect().top) <= window.innerHeight;
  const el = useTop ? top : stage;
  window.scrollTo({top:Math.max(0, window.pageYOffset + el.getBoundingClientRect().top - 6), behavior:"smooth"});
  await sleep(400);
}
/* 讓 topEl 到 bottomEl 這段內容出現在畫面中，並盡量保留上方的戰鬥畫面 */
function revealRange(topEl, bottomEl){
  if(!AUTO_SCROLL || !topEl || !bottomEl) return;
  const h = window.innerHeight;
  const t = topEl.getBoundingClientRect().top, b = bottomEl.getBoundingClientRect().bottom;
  if(t >= 0 && b <= h) return;
  const y = window.pageYOffset + Math.min(b + 12 - h, t - 8);
  window.scrollTo({top:Math.max(0, y), behavior:"smooth"});
}

/* ---------- 技能說明自動產生（依 effect 欄位） ---------- */
function autoSkillDesc(e){
  const pc = v => Math.round(v * 100) + "%";
  const p = [];
  if(e.mult) p.push(e.hits > 1 ? `${e.hits} hits, ${pc(e.mult)} damage each` : `deal ${pc(e.mult)} damage`);
  if(e.comboScale) p.push(`+${pc(e.comboScale)} per Combo`);
  if(e.pierce) p.push(e.pierce >= 1 ? "ignore Defense" : `ignore ${pc(e.pierce)} Defense`);
  if(e.alwaysCrit) p.push("always Critical");
  if(e.critBonus) p.push(`+${e.critBonus}% Crit`);
  if(e.execute) p.push(`x${1 + e.execute} damage if monster HP < 30%`);
  if(e.readingBonus) p.push(`+${pc(e.readingBonus)} after reading`);
  if(e.lifesteal) p.push(`heal ${pc(e.lifesteal)} of damage`);
  if(e.poison) p.push(`${e.dotName || "Poison"} (${pc(e.poison)} ATK) for ${e.poisonTurns || 3} turns`);
  if(e.stun) p.push(`Stun ${e.stun} turn${e.stun > 1 ? "s" : ""}`);
  else if(e.stunChance) p.push(`${pc(e.stunChance)} Stun chance`);
  if(e.weaken) p.push(`monster ATK -25% for ${e.weaken} turns`);
  if(e.buffAtk) p.push(`ATK +${pc(e.buffAtk)} for ${e.turns || 3} turns`);
  if(e.shield) p.push(`next damage taken -${pc(e.shield)}`);
  if(e.heal) p.push(`heal ${pc(e.heal)} HP`);
  if(e.apGain) p.push(`recover ${e.apGain} AP`);
  if(e.comboUp) p.push(`Combo +${e.comboUp}`);
  if(e.hint) p.push("next question removes 2 wrong choices");
  const s = p.join(", ");
  return s.charAt(0).toUpperCase() + s.slice(1) + ".";
}
function buildJobSkills(raw){

  for(const j in raw) out[j] = raw[j].map(r => ({id:r[0], name:r[1], ap:r[2], cost:r[3], levelReq:r[4], requires:r[5], anim:r[6], effect:r[7], desc:r[8] || autoSkillDesc(r[7])}));
  return out;
}

/* ==========================================================================
   ★ 藥水資料區 POTION_TYPES（老師可調整）
   pct 回復最大HP比例 / flat 固定回復量 / ap 回復AP
   regen 之後每回合回復比例 + regenTurns / price 商店價格 / minTier 商店最早出現的地區
   （id 為 "potion" 的藥水使用原本的 player.potions 數量）
   ========================================================================== */
const POTION_TYPES = [
  {id:"potion",name:"Potion",color:"#e53935",pct:0.30,flat:20,price:30,minTier:1,weight:40},
  {id:"hiPotion",name:"Hi-Potion",color:"#ff9800",pct:0.50,flat:40,price:70,minTier:2,weight:25},
  {id:"regenPotion",name:"Regen Potion",color:"#43a047",pct:0.15,flat:10,regen:0.10,regenTurns:3,price:60,minTier:2,weight:15},
  {id:"ether",name:"Ether",color:"#1e88e5",pct:0,flat:0,ap:3,price:80,minTier:2,weight:12},
  {id:"megaPotion",name:"Mega Potion",color:"#ab47bc",pct:0.80,flat:80,price:150,minTier:4,weight:8},
  {id:"elixir",name:"Elixir",color:"#ffd54f",pct:1.0,flat:0,ap:3,price:400,minTier:5,weight:3},
  {id:"wisdomPotion",name:"Wisdom Potion",color:"#00bcd4",pct:0,flat:0,hint:true,price:45,minTier:1,weight:18}
];
function potionInfo(id){ return POTION_TYPES.find(p => p.id === id) || POTION_TYPES[0]; }
function potionCount(id){ return id === "potion" ? player.potions : ((player.potionBag || {})[id] || 0); }
function addPotion(id, n){
  if(id === "potion"){ player.potions = Math.max(0, player.potions + n); return; }
  player.potionBag = player.potionBag || {};
  player.potionBag[id] = Math.max(0, (player.potionBag[id] || 0) + n);
}
function totalPotions(){ return POTION_TYPES.reduce((s, p) => s + potionCount(p.id), 0); }
/* 實際回復量（含 Potion Mastery 天賦） */
function potionHealAmount(P){
  if(!P.pct && !P.flat) return 0;
  const pct = Math.min(1, P.pct + (P.pct > 0 ? talentValue("potionBonus") : 0));
  return Math.min(totalMaxHp(), Math.round(totalMaxHp() * pct + (P.flat || 0)));
}
function potionEffectText(P){
  const p = [];
  const h = potionHealAmount(P);
  if(h > 0) p.push(`♥ Heal <b>${h} HP</b> (${Math.round(Math.min(1, P.pct + (P.pct > 0 ? talentValue("potionBonus") : 0)) * 100)}%${P.flat ? " +" + P.flat : ""})`);
  if(P.regen) p.push(`then +${Math.round(totalMaxHp() * P.regen)} HP/turn x${P.regenTurns}`);
  if(P.hint) p.push("🧠 4 choices → 2 choices 刪去 2 個錯誤選項（答題時使用，0 AP）");
  return p.join(" · ");
}
function potionIconHTML(P, unit){ return pixelArt(POTION_ICON, {r:P.color}, unit); }
function rollShopPotion(tier){
  const list = POTION_TYPES.filter(p => p.minTier <= tier);
  const w = {};
  list.forEach(p => w[p.id] = p.weight);
  return potionInfo(weightedPick(w));
}
function potionBagHTML(){
  return `<div class="panel"><h3>Potions 藥水 (${totalPotions()})</h3><div class="slot-grid">${POTION_TYPES.map(P => `
    <div class="item-card" style="border-color:${P.color}">
      <div class="item-icon">${potionIconHTML(P, 7)}</div>
      <div class="item-info"><div class="item-name" style="color:${P.color}">${esc(P.name)} x${potionCount(P.id)}</div>
      <div class="item-sub">${potionEffectText(P)}</div>
      <div class="gold-text">Shop: about ${P.price}G (from area ${P.minTier})</div></div>
    </div>`).join("")}</div></div>`;
}
function toggleItems(show){
  if(!battle || battle.phase !== "action" || battle.busy) return;
  battle.showItems = show;
  battle.showSkills = false;
  renderActions();
  revealRange($("action-panel"), $("action-panel"));
}
/* 戰鬥中使用藥水（消耗 1 AP，結束本回合） */
async function usePotion(id){
  if(!actionReady(1)) return;
  const P = potionInfo(id);
  if(P.hint){ toast("🧠 Use the Wisdom Potion while answering! 請在答題時使用"); return; }
  if(potionCount(P.id) <= 0){ toast(`No ${P.name} left!`); return; }
  const real = Math.min(potionHealAmount(P), totalMaxHp() - player.hp);
  if(real <= 0 && !P.ap && !P.regen){ toast("HP is already full! HP 已滿"); return; }
  player.ap--;
  addPotion(P.id, -1);
  battle.busy = true; battle.showItems = false;
  renderActions();
  player.hp += real;
  await playAnim("heal");
  if(!battle) return;
  if(real > 0) showNumber("player", `+${real} HP`, "heal");
  let msg = `✚ ${P.name}! Recovered ${real} HP (HP ${player.hp}/${totalMaxHp()})`;
  if(P.ap){ player.ap = Math.min(MAX_AP, player.ap + P.ap); showNumber("player", `+${P.ap} AP`, "info"); msg += `, +${P.ap} AP`; }
  if(P.regen){ battle.regen = {pct:P.regen, turns:P.regenTurns}; msg += `, Regen x${P.regenTurns}`; }
  addLog(msg, "good");
  updateBattleStatus();
  finishAction();
}

const WISDOM_DROP_RATE = 0.08; // 普通怪掉落機率（Boss 50%）
function wisdomButtonHTML(){
  if(!battle || battle.phase !== "question") return "";
  const n = potionCount("wisdomPotion");
  if(n <= 0) return "";
  const used = battle.hidden && battle.hidden.length > 0;
  return `<button class="pbtn small wisdom-btn" ${used || battle.busy ? "disabled" : ""} onclick="useWisdomPotion()">🧠 Wisdom Potion x${n} — ${used ? "已刪去錯誤選項" : "刪去 2 個錯誤選項 (0 AP)"}</button>`;
}
function useWisdomPotion(){
  if(!battle || battle.phase !== "question" || battle.busy) return;
  if(potionCount("wisdomPotion") <= 0){ toast("No Wisdom Potion left!"); return; }
  if(battle.hidden && battle.hidden.length){ toast("Choices are already narrowed! 已經刪過選項"); return; }
  const q = battle.question;
  const wrong = shuffle(battle.order.filter(i => i !== q.answerIndex));
  battle.hidden = wrong.slice(0, Math.min(2, wrong.length));
  addPotion("wisdomPotion", -1);
  renderQuestion();
  showNumber("player", "WISDOM!", "info");
  addLog("🧠 Wisdom Potion! Two wrong choices removed.", "info");
  updateBattleStatus();
  saveGame();
}

/* ---------- 存檔資料整理（補齊舊版本缺少的欄位） ---------- */
function normalizePlayer(p){
  if(!p || !CLASSES[p.className]) return null;
  player = p;
  if(!player.stats) player.stats = {answered:0,correct:0,kills:0,bosses:0};
  if(!player.maxCombo) player.maxCombo = 0;
  if(!player.level) player.level = 1;
  if(!player.expToNext) player.expToNext = expNeeded(player.level);
  if(!player.jobName) player.jobName = player.className;
  if(typeof player.potions !== "number") player.potions = 0;
  if(!Array.isArray(player.learnedSkills) || !player.learnedSkills.length) player.learnedSkills = [CLASSES[player.className].startSkill];
  if(!player.equipment) player.equipment = {weapon:null,helmet:null,armor:null,accessory:null,emblem:null};
  if(!Array.isArray(player.inventory)) player.inventory = [];
  if(!player.areaProgress) player.areaProgress = {};
  if(!Array.isArray(player.quests)) player.quests = [];
  AREAS.forEach(a => { if(!player.areaProgress[a.id]) player.areaProgress[a.id] = {kills:0,totalKills:0,bossKills:0}; });
  player.quests = player.quests.filter(q => q.bounty || QUESTS.some(t => t.id === q.id));
  QUESTS.forEach(q => { if(!player.quests.find(x => x.id === q.id)) player.quests.push(clone(q)); });
  if(player.winStreak === undefined) player.winStreak = 0;
  rebalanceOldGear();
  // 重新開啟遊戲或讀檔視同離開地區：Combo 和 Boss 進度歸零
  AREAS.forEach(a => player.areaProgress[a.id].kills = 0);
  player.combo = 0;
  player.activeRun = null;
  if(!Array.isArray(player.pendingLoot)) player.pendingLoot = null;
  if(!Array.isArray(player.jobPath)) player.jobPath = player.jobName !== player.className ? [player.jobName] : [];
  if(!player.potionBag) player.potionBag = {};
  if(Array.isArray(player.learnedTalents)){ player.talentPoints += player.learnedTalents.length; player.learnedTalents = {}; }
  if(!player.learnedTalents) player.learnedTalents = {};
  ensureBounties();
  recalcStats();
  syncStateQuests();
  return player;
}

/* ==========================================================================
   ★ 本機存檔 Save / Load
   1. 3 個存檔欄位（瀏覽器 localStorage；不能用時只在這次開啟期間有效）
   2. 下載 / 讀取 .json 存檔檔案（任何環境都能用）
   ========================================================================== */
const SAVE_SLOTS = 3;
const SLOT_PREFIX = "pixelEnglishHero_slot_";
const memorySlots = {}; // localStorage 被限制時的暫存
function storageAvailable(){
  try{ const k = "__peh_test"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; }catch(e){ return false; }
}
function includeQuestionsChecked(){ const cb = $("save-include-q"); return !cb || cb.checked; }
function makeSaveData(includeQ){
  return {game:"PixelEnglishHero", version:5, savedAt:Date.now(), player:clone(player),
    questions:(includeQ && customQuestions) ? clone(questionBank) : null};
}
function readSlot(n){
  let raw = null;
  try{ raw = localStorage.getItem(SLOT_PREFIX + n); }catch(e){}
  if(!raw && memorySlots[n]) raw = memorySlots[n];
  if(!raw) return null;
  try{ return JSON.parse(raw); }catch(e){ return null; }
}
function writeSlot(n, data){
  const raw = JSON.stringify(data);
  memorySlots[n] = raw;
  try{ localStorage.setItem(SLOT_PREFIX + n, raw); return true; }catch(e){ return false; }
}
function deleteSlot(n){
  delete memorySlots[n];
  try{ localStorage.removeItem(SLOT_PREFIX + n); }catch(e){}
}
/* 套用存檔：失敗時還原目前角色 */
function applySaveData(data){
  if(!data || !data.player || !CLASSES[data.player.className]) return false;
  const backup = player;
  try{
    battle = null; recentQuestions = [];
    if(!normalizePlayer(clone(data.player))) throw new Error("bad save");
    if(Array.isArray(data.questions)){
      const qs = data.questions.filter(q => q && q.question && Array.isArray(q.choices) && q.choices.length >= 2 && typeof q.answerIndex === "number");
      if(qs.length){ questionBank = qs; customQuestions = true; saveQuestions(); }
    }
    saveGame();
    return true;
  }catch(e){
    player = backup;
    return false;
  }
}
function parseSaveText(text){
  try{
    const data = JSON.parse(String(text || "").replace(/^\uFEFF/, "").trim());
    if(data && data.className) return {player:data, savedAt:Date.now()}; // 也接受純角色資料
    return data;
  }catch(e){ return null; }
}
function saveSummaryHTML(d){
  const p = d.player;
  return `<p class="st-name">${esc(p.jobName || p.className)} <span class="lv">Lv ${p.level}</span></p>
    <p>💰 ${p.gold} Gold · Kills ${(p.stats && p.stats.kills) || 0}</p>
    <p class="item-sub">🕒 ${esc(new Date(d.savedAt || Date.now()).toLocaleString())}</p>
    ${Array.isArray(d.questions) && d.questions.length ? `<p class="item-sub">📚 含自訂題庫 ${d.questions.length} 題</p>` : ""}`;
}

/* ---------- 存檔畫面 ---------- */
function openSave(){ renderSave(); showScreen("save"); }
function saveBack(){ if(player) goMenu(); else { renderStart(); showScreen("start"); } }
function renderSave(){
  const ok = storageAvailable();
  let slots = "";
  for(let n = 1; n <= SAVE_SLOTS; n++){
    const d = readSlot(n);
    const has = !!(d && d.player && CLASSES[d.player.className]);
    let body = `<div class="empty-slot">Empty Slot 空白存檔</div>`;
    if(has){
      const p = d.player;
      const adv = p.jobName && p.jobName !== p.className ? p.jobName : false;
      const wpn = p.equipment ? p.equipment.weapon : null;
      body = `<div class="sprite-box"><div class="bob">${classSpriteHTML(p.className, 5, adv, wpn, true, p.equipment)}</div></div>${saveSummaryHTML(d)}`;
    }
    slots += `<div class="card class-card save-slot ${has ? "" : "empty"}"><h3>💾 Slot ${n}</h3>${body}
      <div class="btn-row left">
        <button class="pbtn green small" ${player ? "" : "disabled"} onclick="confirmSaveSlot(${n})">Save 存檔</button>
        <button class="pbtn cyan small" ${has ? "" : "disabled"} onclick="confirmLoadSlot(${n})">Load 讀取</button>
        <button class="pbtn red small" ${has ? "" : "disabled"} onclick="confirmDeleteSlot(${n})">Delete</button>
      </div></div>`;
  }
  $("screen-save").innerHTML = `<button class="pbtn gray back-btn" onclick="saveBack()">◀ Back</button>
    <h2 class="screen-title">Save / Load 存檔</h2>
    <div class="panel">
      ${player ? `<p>Current Hero 目前角色：<b class="gold-text">${esc(player.jobName)} Lv ${player.level}</b></p>` : "<p>No hero yet. 你可以讀取存檔繼續遊戲。</p>"}
      <p>${ok ? '<span class="good">✔ 瀏覽器存檔可用：遊戲會自動存檔，也可以手動存到 3 個欄位。</span>'
        : '<span class="warn">⚠ 這個環境不能使用瀏覽器存檔 (localStorage)，存檔欄位只在這次開啟期間有效。請用下方「Download Save File」保存進度！</span>'}</p>
    </div>
    <div class="card-grid">${slots}</div>
    <div class="panel">
      <h3>📁 Save File 存檔檔案</h3>
      <p>下載 .json 存檔到電腦或平板。換電腦、換瀏覽器，或清除瀏覽器資料後都能讀回來。</p>
      ${customQuestions ? `<div class="radio-row"><label><input type="checkbox" id="save-include-q" checked> 存檔包含自訂題庫 Include custom questions</label></div>` : ""}
      <div class="btn-row left"><button class="pbtn gold" ${player ? "" : "disabled"} onclick="downloadSaveFile()">⬇ Download Save File</button></div>

/* ---------- 存檔檔案 ---------- */
function downloadSaveFile(){
  if(!player) return;
  saveGame();
  const d = new Date(), pad = v => String(v).padStart(2, "0");
  const stamp = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
  const name = `PixelEnglishHero_${player.jobName.replace(/\s+/g, "")}_Lv${player.level}_${stamp}.json`;
  const text = JSON.stringify(makeSaveData(includeQuestionsChecked()));
  try{
    const blob = new Blob([text], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 500);
    toast("⬇ Save file downloaded! 存檔已下載");
  }catch(e){
    showModal("Download blocked 無法下載", `<p>請複製下面內容，存成 .json 檔；之後貼回「Paste save data」即可讀取。</p><textarea readonly>${esc(text)}</textarea>`, [{text:"OK"}]);
  }
}
function loadSaveFile(input){
  const f = input.files && input.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = e => {
    const d = parseSaveText(e.target.result);
    input.value = "";
    if(!d || !d.player){ toast("✘ Not a valid save file! 不是有效的存檔"); return; }
    confirmApply(d);
  };
  reader.onerror = () => toast("Cannot read file.");
  reader.readAsText(f, "UTF-8");
}
function loadSaveText(){
  const d = parseSaveText($("save-text").value);
  if(!d || !d.player){ toast("✘ Invalid save data! 存檔內容錯誤"); return; }
  confirmApply(d);
}

/* ---------- 地區挑戰設定（老師可調整） ---------- */
const DEFEAT_RESETS_RUN = true; // 被打敗是否也會重置 Boss 進度

/* 結束目前的地區挑戰：Combo 和 Boss 進度歸零 */
function endAreaRun(){
  if(!player || !player.activeRun) return null;
  const id = player.activeRun;
  const p = player.areaProgress[id];
  const lost = p ? p.kills : 0;
  if(p) p.kills = 0;
  const combo = player.combo;
  player.combo = 0;
  player.activeRun = null;
  return {id, lost, combo};
}
function confirmLeaveArea(){
  if(player.pendingLoot && player.pendingLoot.length){ toast("請先選擇 1 件 Boss 裝備！"); return; }
  const a = AREAS.find(x => x.id === player.activeRun);
  const p = a ? player.areaProgress[a.id] : null;
  if(!a || (p.kills === 0 && player.combo === 0)){ goMenu(); return; }
  showModal("Leave Area? 離開地區？", `<p class="warn">✘ Combo x${player.combo} → 0<br>✘ Boss progress ${Math.min(p.kills, a.requiredKillsForBoss)}/${a.requiredKillsForBoss} → 0</p><p>需要重新一次打通才會出現 Boss。</p>`,

/* ---------- Boss 3 選 1 ---------- */
function generateBossChoices(tier){
  const list = [];
  let guard = 0;
  while(list.length < BOSS_CHOICES && guard++ < 40){
    const it = generateEquipment(rollRarity(true), tier); // 至少 Rare
    if(guard < 30 && list.some(x => x.slot === it.slot)) continue; // 盡量讓三件的部位不同
    list.push(it);
  }
  // 保證至少一件 Epic 以上
  if(!list.some(it => rarityIndex(it.rarity) >= 3)) list[0] = generateEquipment(Math.random() < 0.2 ? "Legendary" : "Epic", tier);
  // 盡量保證至少一件可以裝備
  for(let i=0; i<20 && !list.some(it => canEquip(it).ok); i++) list[list.length - 1] = generateEquipment(rollRarity(true), tier);
  return list;
}
function bossChoiceHTML(list){
  return `<p class="gold-text big-reward">★ Choose 1 of ${list.length}! 三選一</p>` + list.map(it => {
    const c = canEquip(it);
    return itemCardHTML(it, `${c.ok ? "" : `<p class="warn">✘ ${esc(c.reason)}</p>`}<div class="btn-row left"><button class="pbtn gold small" onclick="chooseBossLoot('${it.uid}')">★ Choose This 選這件</button></div>`);
  }).join("");
}
function chooseBossLoot(id){
  const list = player.pendingLoot || [];
  const it = list.find(x => x.uid === id);
  if(!it) return;
  player.pendingLoot = null;
  addToInventory(it);
  saveGame();
  closeModal();
  toast(`★ You chose ${it.name}!`);
  if(lastVictory && $("screen-victory").classList.contains("active")){
    lastVictory.item = it; lastVictory.bossChoices = null; lastVictory.chosen = true;
    renderVictory(lastVictory);
  } else if($("screen-menu").classList.contains("active")) renderMenu();
}
function openPendingLootModal(){
  if(!player.pendingLoot || !player.pendingLoot.length) return;
  showModal("★ Boss Reward 3 選 1", bossChoiceHTML(player.pendingLoot), [{text:"Later 稍後", cls:"gray"}]);
}

/* ==========================================================================

const GEAR_EFFECTS = {

  doubleStrike:{name:"Double Strike", tier:"Epic", val:[20,30], desc:v => `${v}% chance: Attack hits twice 普通攻擊 ${v}% 機率連擊`},
  comboKeeper:{name:"Combo Keeper", tier:"Legendary", val:[50,50], desc:v => `${v}% chance to keep Combo on a wrong answer 答錯時 ${v}% 機率保留 Combo`},
  guardian:{name:"Guardian Angel", tier:"Legendary", val:[1,1], desc:() => "Once per battle, survive a fatal hit with 1 HP 每場戰鬥一次免死"},
  counter:{name:"Counter Master", tier:"Legendary", val:[120,120], desc:v => `After a dodge, counterattack for ${v}% damage 閃避後反擊 ${v}% 傷害`},
  critDamage:{name:"Deadly Precision", tier:"Legendary", val:[50,50], desc:v => `Critical damage +${v}% (x2 → x2.5) 暴擊傷害提升`},

};
function effectName(e){ return (GEAR_EFFECTS[e.id] || {}).name || e.id; }
function effectDesc(e){
  const d = GEAR_EFFECTS[e.id];
  if(!d) return "";
  const s = e.skill ? findSkill(e.skill) : null;
  return d.desc(e.v, s ? s.name : (e.skill || ""));
}
function makeEffect(id, it, lv){
  const d = GEAR_EFFECTS[id];
  const e = {id, v:d.val[lv]};
  if(id === "skillDiscount"){
    const cn = it.classRestriction || player.className;
    let list = (SKILL_TREES[cn] || []).slice();
    if(cn === player.className) (player.jobPath || []).forEach(j => list = list.concat(JOB_SKILLS[j] || []));
    list = list.filter(s => s.ap >= 2);
    if(!list.length) return {id:"vampire", v:GEAR_EFFECTS.vampire.val[lv]};
    const learned = list.filter(s => player.learnedSkills.indexOf(s.id) !== -1);
    e.skill = (learned.length && Math.random() < 0.6 ? pick(learned) : pick(list)).id;
  }
  return e;
}
function rollGearEffects(it){
  const ri = rarityIndex(it.rarity);
  if(ri < 3) return;
  const pool = t => Object.keys(GEAR_EFFECTS).filter(k => GEAR_EFFECTS[k].tier === t);
  const lv = ri >= 4 ? 1 : 0;
  const ids = [];
  if(ri >= 4) ids.push(pick(pool("Legendary")));
  ids.push(pick(pool("Epic")));
  it.effects = ids.map(id => makeEffect(id, it, lv));
}
/* 計算身上裝備的特效總值 */
function equippedEffects(){
  const list = [];
  if(!player || !player.equipment) return list;
  for(const s in player.equipment){
    const it = player.equipment[s];
    if(it && Array.isArray(it.effects)) it.effects.forEach(e => list.push(e));
  }
  return list;
}
function gearEffect(id){ return equippedEffects().filter(e => e.id === id).reduce((t, e) => t + (e.v || 0), 0); }
function hasEffect(id){ return gearEffect(id) > 0; }
function skillApCost(s){
  const d = equippedEffects().filter(e => e.id === "skillDiscount" && e.skill === s.id).reduce((t, e) => t + e.v, 0) + gearEffect("allDiscount");
  return Math.max(1, s.ap - d);
}
function gearEffectsPanelHTML(){
  const rows = [];
  for(const s in player.equipment){
    const it = player.equipment[s];
    if(it && it.effects) it.effects.forEach(e => rows.push(`<div class="gear-fx">✦ <b>${esc(effectName(e))}</b>：${esc(effectDesc(e))} <span class="item-sub">(${esc(it.name)})</span></div>`));
  }
  return `<div class="panel"><h3>✦ Special Effects 裝備特效</h3>
    ${rows.length ? rows.join("") : "<p>No special effects yet. Epic / Legendary 裝備會附帶特效！</p>"}
    <p>💨 Dodge 閃避率：${totalDodge()}%（上限 ${DODGE_CAP}%）</p></div>`;
}

/* ==========================================================================
   ★ 閃避 Dodge（老師可調整）
   ========================================================================== */
const DODGE_CAP = 40;          // 閃避率上限 (%)
const BOSS_DODGE_MULT = 0.7;   // 對 Boss 的閃避率倍率
const CLASS_DODGE = {Warrior:3, Mage:4, Archer:10, Scholar:5};
// 轉職的閃避加成（會顯示在轉職畫面）
[["Berserker",2],["Elementalist",2],["Ranger",5],["Sniper",3],["Sage",2],["Beastmaster",5],["Deadeye",5],["Oracle",3],["Warlord",2]].forEach(([n, v]) => {
  const j = findJob(n); if(j) j.bonus.dodge = v;
});
PERCENT_STATS.push("dodge");
STAT_LABELS.dodge = "Dodge";
// 新天賦：Agility 每級閃避 +1%
TALENTS.push({id:"agility", name:"Agility", desc:"Dodge +1% per rank 閃避率", maxLevel:10, cost:1, levelReq:3, levelStep:2, perLevel:{dodge:1}});
function totalDodge(){
  if(!player) return 0;
  let d = CLASS_DODGE[player.className] || 0;
  (player.jobPath || []).forEach(n => { const j = findJob(n); if(j && j.bonus.dodge) d += j.bonus.dodge; });
  d += talentValue("dodge") + equipBonus("dodge");
  return Math.min(DODGE_CAP, Math.round(d));
}
/* 裝備上的閃避屬性：匕首必定有；飾品、頭盔、盔甲、徽章、弓有機率出現 */
function addDodgeStat(it){
  const ri = Math.max(0, rarityIndex(it.rarity));
  const val = [1, 1, 2, 3, 4][ri];
  const chance = it.weaponType === "dagger" ? 1 : ({accessory:0.4, helmet:0.25, armor:0.25, emblem:0.15}[it.slot] || (it.weaponType === "bow" ? 0.3 : 0));
  if(Math.random() < chance) it.stats.dodge = (it.stats.dodge || 0) + val;
}

/* ---------- 所有新裝備（掉落、商店、任務、Boss）自動加上閃避和特效 ---------- */
const baseGenerateEquipment = generateEquipment;
generateEquipment = function(rarity, tier){
  const it = baseGenerateEquipment(rarity, tier);
  addDodgeStat(it);
  rollGearEffects(it);
  return it;
};

/* ==========================================================================
   ★ 新增功能區 v8：音效 SFX + 背景音樂 BGM
   使用 Web Audio API 即時合成 8-bit 聲音，不需要任何音檔
   ========================================================================== */

/* ---------- 音效設定（老師可修改預設值） ---------- */
const SOUND_KEY = "pixelEnglishHero_sound_v1";
const SOUND = {sfx:true, bgm:true, sfxVol:0.7, bgmVol:0.4}; // 預設：音效開、音樂開
try{ const s = JSON.parse(localStorage.getItem(SOUND_KEY) || "null"); if(s) Object.assign(SOUND, s); }catch(e){}
function saveSound(){ try{ localStorage.setItem(SOUND_KEY, JSON.stringify(SOUND)); }catch(e){} }

let AC = null, sfxBus = null, bgmBus = null, noiseBuf = null, audioUnlocked = false, currentScreen = "start";

/* 建立音訊系統（瀏覽器規定要等玩家第一次點擊後才能發聲） */
function initAudio(){
  if(AC) return AC;
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if(!Ctx) return null;
  try{ AC = new Ctx(); }catch(e){ AC = null; return null; }
  const comp = AC.createDynamicsCompressor();
  comp.connect(AC.destination);
  sfxBus = AC.createGain(); sfxBus.connect(comp);
  bgmBus = AC.createGain(); bgmBus.connect(comp);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for(let i=0; i<d.length; i++) d[i] = Math.random() * 2 - 1;
  applyVolumes();
  return AC;
}
function applyVolumes(){
  if(!AC) return;
  sfxBus.gain.value = SOUND.sfx ? SOUND.sfxVol : 0;
  bgmBus.gain.value = SOUND.bgm ? SOUND.bgmVol * 0.6 : 0;
}
function unlockAudio(){
  const ac = initAudio();
  if(!ac) return;
  if(ac.state === "suspended") ac.resume();
  if(!audioUnlocked){ audioUnlocked = true; bgmRefresh(); }
}
["pointerdown","touchend","click","keydown"].forEach(ev => document.addEventListener(ev, unlockAudio, true));

/* ---------- 合成器基本元件 ---------- */
const NOTE_IDX = {C:0,"C#":1,D:2,"D#":3,E:4,F:5,"F#":6,G:7,"G#":8,A:9,"A#":10,B:11};
function noteFreq(n){
  if(typeof n === "number") return n;
  const m = /^([A-G]#?)(-?\d)$/.exec(n);
  if(!m) return 440;
  const midi = NOTE_IDX[m[1]] + 12 * (Number(m[2]) + 1);
  return 440 * Math.pow(2, (midi - 69) / 12);
}
/* 單音：f 起始頻率 / f2 結束頻率 / type 波形 / dur 長度 / vol 音量 / delay 延遲 / at 絕對時間 / bus 輸出 */
function tone(o){
  if(!AC || !audioUnlocked) return;
  const bus = o.bus || sfxBus;
  if(bus === sfxBus && !SOUND.sfx) return;
  const t0 = (o.at !== undefined ? o.at : AC.currentTime) + (o.delay || 0);
  const dur = o.dur || 0.1, vol = o.vol === undefined ? 0.3 : o.vol;
  const osc = AC.createOscillator(), g = AC.createGain();
  osc.type = o.type || "square";
  osc.frequency.setValueAtTime(o.f || 440, t0);
  if(o.f2) osc.frequency.exponentialRampToValueAtTime(Math.max(20, o.f2), t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + Math.min(0.01, dur / 4));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g); g.connect(bus);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
/* 噪音：用來做斬擊、爆炸、閃電等聲音 */
function noise(o){
  if(!AC || !audioUnlocked || !noiseBuf) return;
  const bus = o.bus || sfxBus;
  if(bus === sfxBus && !SOUND.sfx) return;
  const t0 = (o.at !== undefined ? o.at : AC.currentTime) + (o.delay || 0);
  const dur = o.dur || 0.1, vol = o.vol === undefined ? 0.3 : o.vol;
  const src = AC.createBufferSource();
  src.buffer = noiseBuf; src.loop = true;
  const f = AC.createBiquadFilter();
  f.type = o.filter || "lowpass";
  f.frequency.setValueAtTime(o.freq || 2000, t0);
  if(o.freq2) f.frequency.exponentialRampToValueAtTime(Math.max(20, o.freq2), t0 + dur);
  const g = AC.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  src.connect(f); f.connect(g); g.connect(bus);
  src.start(t0, Math.random() * 0.5); src.stop(t0 + dur + 0.05);
}
/* 連續音符 */
function seq(list, step, o){
  o = o || {};
  const base = o.delay || 0;
  list.forEach((n, i) => {
    if(!n || n === "-") return;
    tone(Object.assign({}, o, {f:noteFreq(n), delay:base + i * step}));
  });
}

function sfx(name, arg){
